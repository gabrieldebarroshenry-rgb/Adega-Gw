        },
      },
    },
  };

<script>
// ============================================================================
// app.js — Vinha Real (Etapa 4: conectado ao Firebase, plano gratuito Spark)
//
// Usa o SDK "compat" do Firebase (API com namespace, ex: firebase.auth()),
// carregado como <script> clássica pelo index.html via cdnjs.cloudflare.com.
// Isso é proposital: <script> clássica não passa pela checagem de CORS que
// um `import` de módulo ES exige, então funciona em qualquer ambiente de
// pré-visualização e também quando publicado de verdade — sem depender de
// nenhum outro arquivo local.
// ============================================================================

// ----------------------------------------------------------------------------
// CONFIGURAÇÃO DO PROJETO — cole aqui as credenciais do SEU projeto Firebase
// (Console do Firebase > Configurações do projeto > Geral > "Seus apps").
// Essas chaves não são segredas — a proteção de verdade está nas Regras do
// Firestore (firestore.rules) e na Authentication, não em escondê-las.
// ----------------------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyBc4h92zJAfoKwAcmrCKrXpjCHUhr07Qzw",
  authDomain: "adega-gw.firebaseapp.com",
  projectId: "adega-gw",
  storageBucket: "adega-gw.firebasestorage.app", // não usado nesta etapa — ver README
  messagingSenderId: "522584066497",
  appId: "1:522584066497:web:eab338e7260063cf2d4740",
};

const firebaseApp = firebase.initializeApp(firebaseConfig);
const auth = firebaseApp.auth();
const db = firebaseApp.firestore();
try {
  db.enablePersistence({ synchronizeTabs: true }).catch((e) =>
    console.warn("Cache local do Firestore não disponível:", e.code)
  );
} catch (e) { /* navegador sem suporte — segue sem cache local, sem problema */ }

try {
  auth.setPersistence("local").catch((e) =>
    console.warn("Não foi possível configurar a persistência de sessão:", e)
  );
} catch (e) {
  console.warn("setPersistence indisponível neste navegador:", e);
}

/* =========================================================================
   AUTENTICAÇÃO
   ========================================================================= */
function login(email, password) {
  return auth.signInWithEmailAndPassword(email, password);
}
function logout() {
  return auth.signOut();
}
function resetPassword(email) {
  return auth.sendPasswordResetEmail(email);
}
async function getUserProfile(uid) {
  const snap = await db.collection("users").doc(uid).get();
  if (!snap.exists) return { role: "funcionario", name: null, active: false };
  return snap.data();
}
function watchAuth(callback) {
  return auth.onAuthStateChanged(async (user) => {
    if (!user) { callback(null); return; }
    try {
      const profile = await getUserProfile(user.uid);
      callback({ uid: user.uid, email: user.email, ...profile });
    } catch (e) {
      console.error("Erro ao carregar perfil do usuário:", e);
      callback({ uid: user.uid, email: user.email, role: "funcionario", name: null });
    }
  });
}
const ROLES = { ADMIN: "administrador", MANAGER: "gerente", STAFF: "funcionario" };
function isAdmin(user) { return user?.role === ROLES.ADMIN; }
function isManager(user) { return user?.role === ROLES.ADMIN || user?.role === ROLES.MANAGER; }

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

// Notificação local — só funciona com o app aberto (ou a aba em segundo
// plano). Não chega com o app fechado; isso exigiria push de servidor.
function notifyLocal(title, body) {
  if (!state.notificationsEnabled || Notification.permission !== "granted") return;
  try { new Notification(title, { body, icon: "icon-192.png" }); } catch (e) { console.warn(e); }
}

/* =========================================================================
   FIRESTORE — camada de serviço (API compat: encadeamento de métodos)
   ========================================================================= */
const fbcol = (name) => db.collection(name);
const fbList = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
const serverTimestamp = () => firebase.firestore.FieldValue.serverTimestamp();
const tsFromDate = (date) => firebase.firestore.Timestamp.fromDate(date);

const fb = {
  // ---- Produtos ----
  async listProducts({ onlyActive = true, max = 300 } = {}) {
    if (onlyActive) {
      // Evita índice composto (active + name): filtra no Firestore, ordena no navegador.
      const list = fbList(await fbcol("products").where("active", "==", true).limit(max).get());
      return list.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    }
    return fbList(await fbcol("products").orderBy("name").limit(max).get());
  },
  async createProduct(data) {
    return fbcol("products").add({ ...data, stock: data.stock ?? 0, active: true, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
  },
  async updateProduct(id, data) {
    return fbcol("products").doc(id).update({ ...data, updatedAt: serverTimestamp() });
  },
  async setProductActive(id, active) {
    return fbcol("products").doc(id).update({ active, updatedAt: serverTimestamp() });
  },

  // ---- Categorias ----
  async listCategories(max = 50) {
    return fbList(await fbcol("categories").orderBy("name").limit(max).get());
  },

  // ---- Estoque ----
  async adjustStock({ productId, productName, quantityDelta, reason, userUid }) {
    return db.runTransaction(async (tx) => {
      const ref = fbcol("products").doc(productId);
      const snap = await tx.get(ref);
      if (!snap.exists) throw new Error("Produto não encontrado.");
      const newStock = (snap.data().stock ?? 0) + quantityDelta;
      if (newStock < 0) throw new Error("O estoque não pode ficar negativo.");
      tx.update(ref, { stock: newStock, updatedAt: serverTimestamp() });
      tx.set(fbcol("stockMovements").doc(), {
        productId, productName, type: "ajuste", quantity: quantityDelta,
        reason: reason || "Ajuste manual", userUid, createdAt: serverTimestamp(),
      });
    });
  },
  async listStockMovements({ productId, max = 30 } = {}) {
    if (productId) {
      // Evita índice composto (productId + createdAt): filtra no Firestore, ordena no navegador.
      const list = fbList(await fbcol("stockMovements").where("productId", "==", productId).limit(max).get());
      return list.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
    }
    return fbList(await fbcol("stockMovements").orderBy("createdAt", "desc").limit(max).get());
  },

  // ---- Vendas (PDV) ----
  async finalizeSale({ items, payment, paymentSplits, subtotal, discount, total, employeeUid, employeeName, clientId, clientName, cashRegisterId }) {
    return db.runTransaction(async (tx) => {
      const productRefs = items.map((it) => fbcol("products").doc(it.productId));
      const productSnaps = await Promise.all(productRefs.map((ref) => tx.get(ref)));

      productSnaps.forEach((snap, i) => {
        if (!snap.exists) throw new Error(`Produto "${items[i].name}" não encontrado.`);
        if ((snap.data().stock ?? 0) < items[i].qty) throw new Error(`Estoque insuficiente para "${snap.data().name}".`);
      });

      const saleRef = fbcol("sales").doc();
      tx.set(saleRef, {
        items, payment, subtotal, discount, total, employeeUid, employeeName,
        clientId: clientId || null, clientName: clientName || "Cliente Balcão",
        status: "concluida", cashRegisterId: cashRegisterId || null, createdAt: serverTimestamp(),
        ...(paymentSplits && paymentSplits.length > 0 ? { paymentSplits } : {}),
      });

      productSnaps.forEach((snap, i) => {
        const newStock = (snap.data().stock ?? 0) - items[i].qty;
        tx.update(productRefs[i], { stock: newStock, updatedAt: serverTimestamp(), lastSoldAt: serverTimestamp() });
        tx.set(fbcol("stockMovements").doc(), {
          productId: items[i].productId, productName: snap.data().name, type: "venda", quantity: -items[i].qty,
          reason: `Venda ${saleRef.id}`, userUid: employeeUid, saleId: saleRef.id, createdAt: serverTimestamp(),
        });
      });

      if (cashRegisterId) {
        if (paymentSplits && paymentSplits.length > 0) {
          // Um lançamento de caixa por forma de pagamento, pra conferência bater certinho.
          paymentSplits.forEach((sp) => {
            tx.set(fbcol("cashMovements").doc(), {
              cashRegisterId, type: "venda", amount: sp.amount, payment: sp.method,
              saleId: saleRef.id, userUid: employeeUid, createdAt: serverTimestamp(),
            });
          });
        } else {
          tx.set(fbcol("cashMovements").doc(), {
            cashRegisterId, type: "venda", amount: total, payment, saleId: saleRef.id, userUid: employeeUid, createdAt: serverTimestamp(),
          });
        }
      }
      return saleRef.id;
    });
  },
  async listRecentSales(max = 20) {
    return fbList(await fbcol("sales").orderBy("createdAt", "desc").limit(max).get());
  },
  async listSalesToday(max = 200) {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    return fbList(await fbcol("sales").where("createdAt", ">=", tsFromDate(start)).orderBy("createdAt", "desc").limit(max).get());
  },
  async listSalesRange(days = 7, max = 500) {
    const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - (days - 1));
    return fbList(await fbcol("sales").where("createdAt", ">=", tsFromDate(start)).orderBy("createdAt", "desc").limit(max).get());
  },
  async listSalesRangeCustom({ start, end, max = 1500 } = {}) {
    const startDate = new Date(start); startDate.setHours(0, 0, 0, 0);
    const endDate = new Date(end); endDate.setHours(23, 59, 59, 999);
    return fbList(await fbcol("sales")
      .where("createdAt", ">=", tsFromDate(startDate))
      .where("createdAt", "<=", tsFromDate(endDate))
      .orderBy("createdAt", "desc").limit(max).get());
  },
  async cancelSale(saleId) {
    return fbcol("sales").doc(saleId).update({ status: "cancelada", cancelledAt: serverTimestamp() });
  },

  // ---- Histórico de ações (auditoria) ----
  async logAction({ action, description, userUid, userName }) {
    return fbcol("auditLog").add({ action, description, userUid, userName, createdAt: serverTimestamp() });
  },
  async listAuditLog(max = 100) {
    return fbList(await fbcol("auditLog").orderBy("createdAt", "desc").limit(max).get());
  },

  // ---- Comandas (contas em aberto) ----
  async createComanda({ customerId, customerName, userUid, userName }) {
    return fbcol("comandas").add({
      customerId: customerId || null, customerName: customerName || "Sem identificação",
      items: [], subtotal: 0, status: "aberta",
      openedBy: userUid, openedByName: userName, openedAt: serverTimestamp(),
    });
  },
  async listOpenComandas() {
    // Evita índice composto (status + openedAt): filtra no Firestore, ordena no navegador.
    const snap = await fbcol("comandas").where("status", "==", "aberta").get();
    return fbList(snap).sort((a, b) => (a.openedAt?.toMillis?.() || 0) - (b.openedAt?.toMillis?.() || 0));
  },
  async addItemToComanda({ comandaId, productId, productName, price, qty, userUid }) {
    return db.runTransaction(async (tx) => {
      const comandaRef = fbcol("comandas").doc(comandaId);
      const productRef = fbcol("products").doc(productId);
      const [comandaSnap, productSnap] = await Promise.all([tx.get(comandaRef), tx.get(productRef)]);
      if (!comandaSnap.exists) throw new Error("Comanda não encontrada.");
      if (comandaSnap.data().status !== "aberta") throw new Error("Esta comanda já foi fechada.");
      if (!productSnap.exists) throw new Error("Produto não encontrado.");
      const currentStock = productSnap.data().stock ?? 0;
      if (currentStock < qty) throw new Error(`Estoque insuficiente para "${productSnap.data().name}".`);

      const items = [...(comandaSnap.data().items || [])];
      const idx = items.findIndex(it => it.productId === productId);
      if (idx >= 0) items[idx] = { ...items[idx], qty: items[idx].qty + qty };
      else items.push({ productId, name: productName, price, qty, discount: 0 });
      const subtotal = items.reduce((s, it) => s + it.price * it.qty - (it.discount || 0), 0);

      tx.update(productRef, { stock: currentStock - qty, updatedAt: serverTimestamp(), lastSoldAt: serverTimestamp() });
      tx.update(comandaRef, { items, subtotal, updatedAt: serverTimestamp() });
      tx.set(fbcol("stockMovements").doc(), {
        productId, productName, type: "comanda", quantity: -qty,
        reason: `Comanda ${comandaId}`, userUid, comandaId, createdAt: serverTimestamp(),
      });
    });
  },
  async removeItemFromComanda({ comandaId, productId, qty, userUid }) {
    return db.runTransaction(async (tx) => {
      const comandaRef = fbcol("comandas").doc(comandaId);
      const productRef = fbcol("products").doc(productId);
      const [comandaSnap, productSnap] = await Promise.all([tx.get(comandaRef), tx.get(productRef)]);
      if (!comandaSnap.exists) throw new Error("Comanda não encontrada.");
      const items = [...(comandaSnap.data().items || [])];
      const idx = items.findIndex(it => it.productId === productId);
      if (idx < 0) throw new Error("Item não encontrado na comanda.");
      const productName = items[idx].name;
      const removeQty = Math.min(qty, items[idx].qty);
      if (items[idx].qty - removeQty <= 0) items.splice(idx, 1);
      else items[idx] = { ...items[idx], qty: items[idx].qty - removeQty };
      const subtotal = items.reduce((s, it) => s + it.price * it.qty - (it.discount || 0), 0);

      tx.update(comandaRef, { items, subtotal, updatedAt: serverTimestamp() });
      if (productSnap.exists) {
        tx.update(productRef, { stock: (productSnap.data().stock ?? 0) + removeQty, updatedAt: serverTimestamp() });
      }
      tx.set(fbcol("stockMovements").doc(), {
        productId, productName, type: "ajuste", quantity: removeQty,
        reason: `Remoção de item da comanda ${comandaId}`, userUid, comandaId, createdAt: serverTimestamp(),
      });
    });
  },
  async closeComanda({ comandaId, payment, paymentSplits, discount, serviceCharge, employeeUid, employeeName, cashRegisterId }) {
    return db.runTransaction(async (tx) => {
      const comandaRef = fbcol("comandas").doc(comandaId);
      const comandaSnap = await tx.get(comandaRef);
      if (!comandaSnap.exists) throw new Error("Comanda não encontrada.");
      const comanda = comandaSnap.data();
      if (comanda.status !== "aberta") throw new Error("Esta comanda já foi fechada.");
      if (!comanda.items || comanda.items.length === 0) throw new Error("A comanda está vazia.");
      const subtotal = comanda.subtotal || 0;
      const total = Math.max(0, subtotal - (discount || 0)) + (serviceCharge || 0);

      // Estoque já foi baixado item a item — aqui só registra a venda e cobra.
      const saleRef = fbcol("sales").doc();
      tx.set(saleRef, {
        items: comanda.items, payment, subtotal, discount: discount || 0, serviceCharge: serviceCharge || 0, total,
        employeeUid, employeeName,
        clientId: comanda.customerId || null, clientName: comanda.customerName || "Cliente Balcão",
        status: "concluida", cashRegisterId: cashRegisterId || null, createdAt: serverTimestamp(),
        comandaId,
        ...(paymentSplits && paymentSplits.length > 0 ? { paymentSplits } : {}),
      });
      tx.update(comandaRef, { status: "fechada", closedAt: serverTimestamp(), saleId: saleRef.id, total, discount: discount || 0, serviceCharge: serviceCharge || 0 });

      if (cashRegisterId) {
        if (paymentSplits && paymentSplits.length > 0) {
          paymentSplits.forEach((sp) => {
            tx.set(fbcol("cashMovements").doc(), {
              cashRegisterId, type: "venda", amount: sp.amount, payment: sp.method,
              saleId: saleRef.id, userUid: employeeUid, createdAt: serverTimestamp(),
            });
          });
        } else {
          tx.set(fbcol("cashMovements").doc(), {
            cashRegisterId, type: "venda", amount: total, payment, saleId: saleRef.id, userUid: employeeUid, createdAt: serverTimestamp(),
          });
        }
      }
      return saleRef.id;
    });
  },
  async cancelComanda(comandaId) {
    return fbcol("comandas").doc(comandaId).update({ status: "cancelada", cancelledAt: serverTimestamp() });
  },

  // ---- Entregadores ----
  async createDeliveryDriver(data) {
    return fbcol("deliveryDrivers").add({ ...data, active: true, createdAt: serverTimestamp() });
  },
  async listDeliveryDrivers(max = 100) {
    return fbList(await fbcol("deliveryDrivers").orderBy("name").limit(max).get());
  },
  async updateDeliveryDriver(id, data) {
    return fbcol("deliveryDrivers").doc(id).update(data);
  },

  // ---- Entregas ----
  async createDelivery(data) {
    return fbcol("deliveries").add({ ...data, status: "pendente", paid: false, createdAt: serverTimestamp() });
  },
  async listDeliveries(max = 200) {
    return fbList(await fbcol("deliveries").orderBy("createdAt", "desc").limit(max).get());
  },
  async updateDeliveryStatus(id, status) {
    const data = { status };
    if (status === "entregue") data.deliveredAt = serverTimestamp();
    return fbcol("deliveries").doc(id).update(data);
  },
  async settleDriverDeliveries(deliveryIds) {
    // Marca várias entregas como pagas de uma vez só — é isso que fecha a
    // conta do entregador (exige gerência, já garantido pela regra de segurança).
    const batch = db.batch();
    deliveryIds.forEach(id => batch.update(fbcol("deliveries").doc(id), { paid: true, paidAt: serverTimestamp() }));
    return batch.commit();
  },

  // ---- Caixa ----
  async getOpenCashRegister() {
    const snap = await fbcol("cashRegisters").where("status", "==", "aberto").limit(1).get();
    return snap.empty ? null : { id: snap.docs[0].id, ...snap.docs[0].data() };
  },
  async openCashRegister({ openingAmount, userUid, userName }) {
    return fbcol("cashRegisters").add({ openingAmount, status: "aberto", openedBy: userUid, openedByName: userName, openedAt: serverTimestamp() });
  },
  async addCashMovement({ cashRegisterId, type, amount, reason, userUid }) {
    return fbcol("cashMovements").add({ cashRegisterId, type, amount, reason: reason || "", userUid, createdAt: serverTimestamp() });
  },
  async listCashMovements(cashRegisterId) {
    // Evita índice composto (cashRegisterId + createdAt): filtra no Firestore, ordena no navegador.
    const list = fbList(await fbcol("cashMovements").where("cashRegisterId", "==", cashRegisterId).get());
    return list.sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));
  },
  async closeCashRegister({ cashRegisterId, expectedAmount, informedAmount, userUid }) {
    const difference = Number((informedAmount - expectedAmount).toFixed(2));
    return fbcol("cashRegisters").doc(cashRegisterId).update({ status: "fechado", expectedAmount, informedAmount, difference, closedBy: userUid, closedAt: serverTimestamp() });
  },

  // ---- Clientes ----
  async listCustomers(max = 200) { return fbList(await fbcol("customers").orderBy("name").limit(max).get()); },
  async listCustomersPage({ max = 30, cursor = null } = {}) {
    let ref = fbcol("customers").orderBy("name").limit(max);
    if (cursor) ref = ref.startAfter(cursor);
    const snap = await ref.get();
    const items = fbList(snap);
    const lastDoc = snap.docs[snap.docs.length - 1];
    return { items, hasMore: snap.size === max, cursor: lastDoc ? lastDoc.data().name : null };
  },
  async createCustomer(data) { return fbcol("customers").add({ ...data, createdAt: serverTimestamp() }); },
  async updateCustomer(id, data) { return fbcol("customers").doc(id).update(data); },
  async customerPurchaseHistory(customerId, max = 20) {
    // Evita índice composto (clientId + createdAt): filtra no Firestore, ordena no navegador.
    const list = fbList(await fbcol("sales").where("clientId", "==", customerId).limit(max).get());
    return list.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
  },

  // ---- Fornecedores ----
  async listSuppliers(max = 200) { return fbList(await fbcol("suppliers").orderBy("name").limit(max).get()); },
  async createSupplier(data) { return fbcol("suppliers").add({ ...data, createdAt: serverTimestamp() }); },

  // ---- Compras ----
  async createPurchase({ items, supplierId, supplierName, total, userUid }) {
    return db.runTransaction(async (tx) => {
      const productRefs = items.map((it) => fbcol("products").doc(it.productId));
      const productSnaps = await Promise.all(productRefs.map((ref) => tx.get(ref)));
      const purchaseRef = fbcol("purchases").doc();
      tx.set(purchaseRef, { items, supplierId, supplierName, total, userUid, createdAt: serverTimestamp() });
      productSnaps.forEach((snap, i) => {
        const newStock = (snap.data()?.stock ?? 0) + items[i].qty;
        const productUpdate = { stock: newStock, updatedAt: serverTimestamp() };
        if (items[i].cost > 0) productUpdate.cost = items[i].cost; // atualiza o custo do produto com o valor pago agora
        tx.update(productRefs[i], productUpdate);
        tx.set(fbcol("stockMovements").doc(), {
          productId: items[i].productId, productName: snap.data()?.name, type: "compra", quantity: items[i].qty,
          reason: `Compra ${purchaseRef.id}`, userUid, purchaseId: purchaseRef.id, createdAt: serverTimestamp(),
        });
      });
      return purchaseRef.id;
    });
  },

  // ---- Movimentos de conta (extrato) — atualiza o saldo e registra a
  // linha do extrato numa transação só, pra nunca ficar um sem o outro ----
  async registerAccountMovement({ accountId, accountName, type, amount, description, categoryId, categoryName, relatedType, relatedId, userUid }) {
    return db.runTransaction(async (tx) => {
      const ref = fbcol("financialAccounts").doc(accountId);
      const snap = await tx.get(ref);
      if (!snap.exists) throw new Error("Conta financeira não encontrada.");
      const delta = type === "entrada" ? amount : -amount;
      const newBalance = (snap.data().currentBalance || 0) + delta;
      tx.update(ref, { currentBalance: newBalance, updatedAt: serverTimestamp() });
      tx.set(fbcol("accountMovements").doc(), {
        accountId, accountName, type, amount, description: description || "",
        categoryId: categoryId || null, categoryName: categoryName || null,
        relatedType: relatedType || "manual", relatedId: relatedId || null,
        userUid, createdAt: serverTimestamp(),
      });
    });
  },

  async promoteToAdminWithCode(uid, code, email) {
    // A regra do Firestore só aceita essa escrita se o código bater com o
    // configurado em firestore.rules. Se não bater, a promessa rejeita
    // com erro de permissão — é a própria regra validando, não o app.
    // set+merge (em vez de update) funciona mesmo se o documento não existir.
    return fbcol("users").doc(uid).set({ role: "administrador", setupCode: code, email: email || null, active: true }, { merge: true });
  },

  // ---------------------------------------------------------------------
  // DADOS DE EXEMPLO — popula o banco real com um catálogo e um histórico
  // de vendas realista, pra o dono ver o sistema funcionando de verdade.
  // Só roda pra administrador (mesma restrição das regras de segurança).
  // ---------------------------------------------------------------------
  // Busca tudo que foi marcado como exemplo (isExample: true) em cada
  // coleção relevante — só funciona pra dados criados a partir de agora,
  // não retroage sobre exemplos populados antes dessa marcação existir.
  async listExampleData() {
    const collections = ["products", "customers", "suppliers", "sales", "accountsPayable", "accountsReceivable", "comandas", "deliveryDrivers", "deliveries", "stockMovements", "cashRegisters"];
    const results = {};
    await Promise.all(collections.map(async (col) => {
      try { results[col] = fbList(await fbcol(col).where("isExample", "==", true).get()); }
      catch (e) { console.error(col, e); results[col] = []; }
    }));
    return results;
  },

  async seedExampleData(userUid, userName) {
    const daysAgo = (n, hour, min) => {
      const d = new Date();
      d.setDate(d.getDate() - n);
      d.setHours(hour, min, 0, 0);
      return firebase.firestore.Timestamp.fromDate(d);
    };

    // 1. Produtos (com níveis de estoque variados, incluindo baixo/zerado,
    //    e custo/margem já preenchidos pro simulador de preço funcionar)
    const productDefs = [
      { name: "Cabernet Sauvignon Reserva", sku: "TIN-CS-001", barcode: "7891234560012", category: "Tintos", price: 89.9, cost: 49.9, stock: 34, minStock: 10 },
      { name: "Malbec Argentino", sku: "TIN-MB-002", barcode: "7891234560029", category: "Tintos", price: 74.5, cost: 41.0, stock: 8, minStock: 12 },
      { name: "Chardonnay Premium", sku: "BRA-CH-003", barcode: "7891234560036", category: "Brancos", price: 68.0, cost: 37.5, stock: 21, minStock: 10 },
      { name: "Sauvignon Blanc", sku: "BRA-SV-004", barcode: "7891234560043", category: "Brancos", price: 59.9, cost: 33.0, stock: 3, minStock: 8 },
      { name: "Espumante Brut Nacional", sku: "ESP-BR-005", barcode: "7891234560050", category: "Espumantes", price: 54.0, cost: 29.5, stock: 40, minStock: 15 },
      { name: "Champagne Francês", sku: "ESP-CH-006", barcode: "7891234560067", category: "Espumantes", price: 320.0, cost: 185.0, stock: 6, minStock: 4 },
      { name: "Rosé Provence", sku: "ROS-01-007", barcode: "7891234560074", category: "Rosés", price: 92.0, cost: 50.0, stock: 0, minStock: 6 },
      { name: "Whisky 12 Anos", sku: "DES-WH-008", barcode: "7891234560081", category: "Destilados", price: 189.9, cost: 105.0, stock: 14, minStock: 6 },
      { name: "Gin Premium Botânico", sku: "DES-GN-009", barcode: "7891234560098", category: "Destilados", price: 129.0, cost: 70.0, stock: 17, minStock: 8 },
      { name: "Cerveja Artesanal IPA", sku: "CER-IPA-012", barcode: "7891234560128", category: "Cervejas", price: 24.9, cost: 12.5, stock: 58, minStock: 20 },
    ];
    const productIds = [];
    for (const p of productDefs) {
      const ref = await fbcol("products").add({ isExample: true, ...p, targetMargin: 40, extraFeesPercent: 3, active: true, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      productIds.push({ id: ref.id, ...p });
    }
    const byName = (name) => productIds.find(p => p.name === name);

    // 2. Cliente e fornecedor de exemplo
    const customerRef = await fbcol("customers").add({ isExample: true, name: "Fernanda Costa", phone: "(11) 98888-1234", email: "fernanda@exemplo.com", createdAt: serverTimestamp() });
    await fbcol("suppliers").add({ isExample: true, name: "Vinícola Sul Distribuidora", phone: "(51) 3222-4455", email: "contato@vinicolasul.com", createdAt: serverTimestamp() });

    // 3. Vendas espalhadas nos últimos 7 dias (pra popular gráfico, ranking e últimas vendas)
    const employees = ["Bianca Ferreira", "Rodrigo Lima", userName || "Administrador"];
    const paymentOptions = ["Pix", "Dinheiro", "Débito", "Crédito"];
    const salesPlan = [
      { daysAgo: 6, hour: 17, items: [["Cabernet Sauvignon Reserva", 2], ["Cerveja Artesanal IPA", 3]] },
      { daysAgo: 5, hour: 12, items: [["Espumante Brut Nacional", 1]] },
      { daysAgo: 5, hour: 18, items: [["Whisky 12 Anos", 1], ["Gin Premium Botânico", 1]] },
      { daysAgo: 4, hour: 15, items: [["Malbec Argentino", 2]] },
      { daysAgo: 3, hour: 11, items: [["Chardonnay Premium", 1], ["Cerveja Artesanal IPA", 2]] },
      { daysAgo: 3, hour: 19, items: [["Champagne Francês", 1]] },
      { daysAgo: 2, hour: 14, items: [["Cabernet Sauvignon Reserva", 1], ["Sauvignon Blanc", 1]] },
      { daysAgo: 1, hour: 10, items: [["Gin Premium Botânico", 2]] },
      { daysAgo: 1, hour: 17, items: [["Cerveja Artesanal IPA", 4]] },
      { daysAgo: 0, hour: 9, items: [["Espumante Brut Nacional", 2]] },
      { daysAgo: 0, hour: 13, items: [["Cabernet Sauvignon Reserva", 1], ["Whisky 12 Anos", 1]] },
    ];
    let n = 1000;
    for (const plan of salesPlan) {
      const items = plan.items.map(([name, qty]) => {
        const prod = byName(name);
        return { productId: prod.id, name: prod.name, qty, price: prod.price, discount: 0 };
      });
      const subtotal = items.reduce((s, it) => s + it.price * it.qty, 0);
      const employeeName = employees[n % employees.length];
      const payment = paymentOptions[n % paymentOptions.length];
      await fbcol("sales").add({ isExample: true,
        items, payment, subtotal, discount: 0, total: subtotal,
        employeeUid: userUid, employeeName,
        clientId: null, clientName: "Cliente Balcão",
        status: "concluida", cashRegisterId: null,
        createdAt: daysAgo(plan.daysAgo, plan.hour, (n * 7) % 60),
      });
      n++;
    }

    // 4. Contas a pagar / a receber de exemplo
    await fbcol("accountsPayable").add({ isExample: true, description: "Aluguel do espaço", supplierName: "Imobiliária Central", amount: 2200, dueDate: daysAgo(-5, 12, 0), paid: false, createdAt: serverTimestamp() });
    await fbcol("accountsPayable").add({ isExample: true, description: "Fornecimento Vinícola Sul", supplierName: "Vinícola Sul Distribuidora", amount: 3450, dueDate: daysAgo(-2, 12, 0), paid: false, createdAt: serverTimestamp() });
    await fbcol("accountsPayable").add({ isExample: true, description: "Conta de energia", supplierName: "Concessionária", amount: 380, dueDate: daysAgo(3, 12, 0), paid: true, paidAt: serverTimestamp(), createdAt: serverTimestamp() });
    await fbcol("accountsReceivable").add({ isExample: true, description: "Evento fechado — degustação", clientName: "Buffet Boa Mesa", amount: 1800, dueDate: daysAgo(-7, 12, 0), received: false, createdAt: serverTimestamp() });

    // 5. Comandas em aberto (uma vinculada a cliente cadastrado, outra livre)
    const gin = byName("Gin Premium Botânico");
    const cerveja = byName("Cerveja Artesanal IPA");
    const espumante = byName("Espumante Brut Nacional");
    await fbcol("comandas").add({ isExample: true,
      customerId: customerRef.id, customerName: "Fernanda Costa",
      items: [{ productId: gin.id, name: gin.name, price: gin.price, qty: 2, discount: 0 }],
      subtotal: gin.price * 2, status: "aberta",
      openedBy: userUid, openedByName: userName || "Administrador", openedAt: serverTimestamp(),
    });
    await fbcol("comandas").add({ isExample: true,
      customerId: null, customerName: "Mesa 3",
      items: [
        { productId: cerveja.id, name: cerveja.name, price: cerveja.price, qty: 4, discount: 0 },
        { productId: espumante.id, name: espumante.name, price: espumante.price, qty: 1, discount: 0 },
      ],
      subtotal: cerveja.price * 4 + espumante.price, status: "aberta",
      openedBy: userUid, openedByName: userName || "Administrador", openedAt: serverTimestamp(),
    });

    // 6. Entregador de exemplo com pedidos em status variados
    const driverRef = await fbcol("deliveryDrivers").add({ isExample: true, name: "Carlos Delivery", phone: "(11) 97777-2233", feePerDelivery: 8, active: true, createdAt: serverTimestamp() });
    await fbcol("deliveries").add({ isExample: true, customerName: "João — Rua das Palmeiras, 45", driverId: driverRef.id, driverName: "Carlos Delivery", feeAmount: 8, status: "pendente", paid: false, createdAt: serverTimestamp() });
    await fbcol("deliveries").add({ isExample: true, customerName: "Marcela — Av. Central, 900", driverId: driverRef.id, driverName: "Carlos Delivery", feeAmount: 8, status: "a_caminho", paid: false, createdAt: serverTimestamp() });
    await fbcol("deliveries").add({ isExample: true, customerName: "Pedro — Rua Nova, 12", driverId: driverRef.id, driverName: "Carlos Delivery", feeAmount: 10, status: "entregue", paid: false, createdAt: daysAgo(1, 16, 0), deliveredAt: daysAgo(1, 16, 40) });

    // 7. Uma perda de estoque (pro relatório de Perdas) e um caixa já fechado (pro relatório de Caixa)
    const rose = byName("Rosé Provence");
    await fbcol("stockMovements").add({ isExample: true, productId: rose.id, productName: rose.name, type: "ajuste", quantity: -1, reason: "Garrafa quebrada no transporte", userUid, createdAt: daysAgo(2, 10, 0) });
    await fbcol("cashRegisters").add({ isExample: true,
      openingAmount: 200, status: "fechado", openedBy: userUid, openedByName: userName || "Administrador", openedAt: daysAgo(1, 9, 0),
      expectedAmount: 640, informedAmount: 635, difference: -5, closedBy: userUid, closedAt: daysAgo(1, 20, 0),
    });
  },
};

// Notificações de verdade — nada de lista fixa. Monta a partir do que já
// está carregado (produtos, contas a pagar), sem nenhuma consulta extra.
function buildNotifications() {
  const list = [];
  const outOfStock = PRODUCTS.filter(p => p.stock === 0);
  const lowStock = PRODUCTS.filter(p => p.stock > 0 && p.stock <= (p.minStock ?? 0));
  if (outOfStock.length > 0) {
    list.push({ title: "Estoque zerado", desc: `${outOfStock.length} produto${outOfStock.length === 1 ? "" : "s"} sem nenhuma unidade`, type: "alert" });
  }
  if (lowStock.length > 0) {
    list.push({ title: "Estoque baixo", desc: `${lowStock.length} produto${lowStock.length === 1 ? "" : "s"} precisando de reposição`, type: "warning" });
  }
  if (isManager(state.currentUser)) {
    const now = new Date();
    const overdue = (state.cashFlowPayables || []).filter(p => !p.paid).filter(p => {
      const d = toJsDate(p.dueDate);
      return d && d < now;
    });
    if (overdue.length > 0) {
      const total = overdue.reduce((s, p) => s + (p.amount || 0), 0);
      list.push({ title: "Contas atrasadas", desc: `${overdue.length} conta${overdue.length === 1 ? "" : "s"} vencida${overdue.length === 1 ? "" : "s"} · ${currency(total)}`, type: "alert" });
    }
    const in3Days = new Date(); in3Days.setDate(in3Days.getDate() + 3); in3Days.setHours(23, 59, 59, 999);
    const dueSoon = (state.cashFlowPayables || []).filter(p => !p.paid).filter(p => {
      const d = toJsDate(p.dueDate);
      return d && d >= now && d <= in3Days;
    });
    if (dueSoon.length > 0) {
      const total = dueSoon.reduce((s, p) => s + (p.amount || 0), 0);
      list.push({ title: "Contas vencendo", desc: `${dueSoon.length} conta${dueSoon.length === 1 ? "" : "s"} nos próximos 3 dias · ${currency(total)}`, type: "warning" });
    }
  }
  return list;
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return "Bom dia";
  if (h < 18) return "Boa tarde";
  return "Boa noite";
}
function firstName(user) {
  if (!user) return "";
  const base = user.name || user.email?.split("@")[0] || "";
  return base.split(" ")[0].replace(/^\w/, c => c.toUpperCase());
}
function initials(user) {
  if (!user) return "";
  const base = user.name || user.email || "";
  const parts = base.trim().split(/\s+/);
  return parts.length > 1
    ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
    : base.slice(0, 2).toUpperCase();
}

async function loadInitialData() {
  state.dataLoading = true;
  state.dataError = null;
  render();
  try {
    const [products, categories, salesToday, salesRange, cash, payables, cashFlowPayables, cashFlowReceivables] = await Promise.all([
      fb.listProducts({ onlyActive: true }),
      fb.listCategories().catch(() => []),
      fb.listSalesToday(),
      fb.listSalesRange(30, 1000),
      fb.getOpenCashRegister().catch(() => null),
      fb.listAccountsPayable(5).catch(() => []),
      fb.listAccountsPayable(200).catch(() => []),
      fb.listAccountsReceivable(200).catch(() => []),
    ]);
    PRODUCTS = products;
    CATEGORIES_CACHE = categories;
    state.sales = salesToday;
    SALES_RANGE_CACHE = salesRange;
    state.openCashRegister = cash;
    state.accountsPayable = payables;
    state.cashFlowPayables = cashFlowPayables;
    state.cashFlowReceivables = cashFlowReceivables;
    if (cash) {
      try { state.cashMovements = await fb.listCashMovements(cash.id); } catch (e) { console.error(e); state.cashMovements = []; }
    }
    if (PRODUCTS.length === 0 && isAdmin(state.currentUser) && !state.autoSeeded) {
      state.autoSeeded = true;
      try {
        await fb.seedExampleData(state.currentUser.uid, firstName(state.currentUser));
        const [products2, salesToday2, salesRange2, payables2] = await Promise.all([
          fb.listProducts({ onlyActive: true }),
          fb.listSalesToday(),
          fb.listSalesRange(30, 1000),
          fb.listAccountsPayable(5).catch(() => []),
        ]);
        PRODUCTS = products2;
        state.sales = salesToday2;
        SALES_RANGE_CACHE = salesRange2;
        state.accountsPayable = payables2;
        showToast("Dados de exemplo carregados");
      } catch (e) {
        console.error("Falha ao popular exemplos automaticamente:", e);
      }
    }
    if (localStorage.getItem("vinhaReal_notifications") === "on" && Notification?.permission === "granted") {
      state.notificationsEnabled = true;
    }
    if (!state.notifiedLowStockThisSession) {
      const lowStockCount = PRODUCTS.filter(p => p.stock <= (p.minStock ?? 0)).length;
      if (lowStockCount > 0) {
        notifyLocal("Estoque baixo", `${lowStockCount} produto${lowStockCount === 1 ? "" : "s"} precisando de reposição.`);
      }
      state.notifiedLowStockThisSession = true;
    }
  } catch (e) {
    console.error("Erro ao carregar dados iniciais:", e);
    state.dataError = e.message || "Não foi possível carregar os dados do Firestore.";
  } finally {
    state.dataLoading = false;
    render();
  }
}

// Gera a conta a pagar do mês atual pra cada recorrente ativa que ainda não
// foi gerada esse mês. Roda toda vez que alguém abre a tela Financeiro —
// não existe "robô" rodando sozinho fora disso (app sem servidor próprio).
async function generateDueRecurringBills() {
  const currentMonth = new Date().toISOString().slice(0, 7); // "YYYY-MM"
  const due = state.recurringBills.filter(rb => rb.active !== false && rb.lastGeneratedMonth !== currentMonth);
  if (due.length === 0) return;
  let created = 0;
  for (const rb of due) {
    try {
      const dueDate = new Date();
      dueDate.setDate(Math.min(rb.dueDay || 5, 28));
      dueDate.setHours(12, 0, 0, 0);
      await fb.createAccountPayable({
        description: rb.description,
        supplierName: rb.category === "Fornecedores" && rb.supplierName ? rb.supplierName : rb.category,
        amount: rb.amount,
        dueDate: tsFromDate(dueDate),
        recurringBillId: rb.id,
      });
      await fb.updateRecurringBill(rb.id, { lastGeneratedMonth: currentMonth });
      rb.lastGeneratedMonth = currentMonth;
      created++;
    } catch (e) { console.error(e); }
  }
  if (created > 0) {
    const page = await fb.listAccountsPayablePage({ max: 20 });
    state.financePayables = page.items;
    state.payablesCursor = page.cursor; state.payablesHasMore = page.hasMore;
    showToast(`${created} conta${created === 1 ? "" : "s"} recorrente${created === 1 ? "" : "s"} gerada${created === 1 ? "" : "s"} esse mês`);
  }
}

    showToast("Não foi possível carregar o relatório.");
  } finally {
    state.reportsLoading = false;
    render();
  }
}

async function loadReportCustomRange(start, end) {
  if (!start || !end || start > end) { showToast("Selecione um período válido."); return; }
  state.reportsLoading = true;
  render();
  try {
    state.reportSales = await fb.listSalesRangeCustom({ start, end });
    state.reportPeriod = "custom";
    state.reportCustomStart = start;
    state.reportCustomEnd = end;
    state.reportsLoaded = true;
    state.reportCustomOpen = false;
  } catch (e) {
    console.error(e);
    showToast("Não foi possível carregar o relatório.");
  } finally {
    state.reportsLoading = false;
    render();
  }
}

/* =========================================================================
   RENDER RAIZ
   ========================================================================= */
function render() {
  const app = document.getElementById("app");
  document.getElementById("global-tooltip")?.classList.remove("show"); // nunca deixa uma dica presa entre uma tela e outra

  // 1. Ainda não sabemos se há sessão salva
  if (!state.authChecked) {
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center">
        <div class="w-10 h-10 rounded-full border-2 border-[#E8590C] border-t-transparent animate-spin"></div>
      </div>`;
    return;
  }

  // 2. Sem sessão -> tela de login
  if (!state.currentUser) {
    app.innerHTML = renderLoginScreen();
    attachEvents();
    return;
  }

  // 3. Autenticado -> app normal
  app.innerHTML = `
    <div class="h-[100dvh] flex bg-white">
      ${renderSidebar()}
      ${state.mobileNavOpen ? `<div id="overlay" class="fixed inset-0 bg-black/50 z-30 lg:hidden"></div>` : ""}
      <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
        ${renderTopbar()}
        <main id="page-content" class="flex-1 min-w-0 overflow-y-auto overflow-x-hidden px-4 sm:px-7 py-5 sm:py-6 pb-28 lg:pb-6">
          ${renderPageRouter()}
        </main>
      </div>
    </div>
    ${renderMobileBottomNav()}
    ${state.newSaleOpen ? renderNewSaleOverlay() : ""}
    ${state.customerPickerOpen ? renderCustomerPickerModal() : ""}
    ${state.barcodeScannerOpen ? renderBarcodeScannerOverlay() : ""}
    ${state.confirmedSale ? renderConfirmation() : ""}
    ${state.selectedSaleId ? renderSaleDetailModal(state.sales.find(s => s.id === state.selectedSaleId)) : ""}
    ${state.toast ? `
      <div class="fixed top-20 sm:top-24 left-1/2 -translate-x-1/2 z-[60] bg-[#1B1210] text-white text-sm px-4 py-2.5 rounded-full shadow-lg fade-in flex items-center gap-2 whitespace-nowrap max-w-[90vw]">
        ${icon("check", 15, "text-[#E8590C]")} ${state.toast}
      </div>` : ""}
  `;
  attachEvents();
}

/* =========================================================================
   ROTEADOR DE PÁGINAS
   ========================================================================= */
function renderPageRouter() {
  // Página exige um papel que o usuário logado não tem -> volta para o dashboard
  const allowed = (NAV_ACCESS[state.page] || []).includes(state.currentUser?.role);
  if (!allowed) {
    return renderPlaceholder("dashboard");
  }
  if (state.dataLoading) {
    return state.page === "dashboard" ? skeletonDashboard() : skeletonListRows(state.page === "produtos" || state.page === "estoque" ? 6 : 4);
  }
  if (state.dataError) {
    return `
      <div class="bg-[#F1EDE7] border border-[#D8CFC6] rounded-2xl p-6 text-center">
        <p class="text-sm text-[#1B1210] font-medium">Não foi possível carregar os dados</p>
        <p class="text-xs text-[#7E7268] mt-1">${state.dataError}</p>
        <button data-action="retry-load" class="mt-4 bg-[#1B1210] text-white text-sm font-medium px-5 py-2.5 rounded-full hover:bg-[#2A1E1B]">Tentar novamente</button>
      </div>`;
  }
  // Páginas com busca sob demanda: mostra o giratório até o primeiro carregamento
  // terminar, em vez de piscar "nenhum encontrado" com a lista ainda vazia.
  const LAZY_LOAD_FLAGS = {
    clientes: ["customersLoaded"],
    fornecedores: ["suppliersLoaded"],
    compras: ["purchasesLoaded", "suppliersLoaded"],
    financeiro: ["financeLoaded"],
    funcionarios: ["employeesLoaded"],
    relatorios: ["reportsLoaded"],
    configuracoes: ["settingsLoaded"],
    comandas: ["comandasLoaded"],
    entregas: ["deliveriesLoaded"],
  };
  const requiredFlags = LAZY_LOAD_FLAGS[state.page];
  if (requiredFlags && !requiredFlags.every(f => state[f])) {
    return state.page === "relatorios" ? skeletonReport() : skeletonListRows();
  }
  switch (state.page) {
    case "dashboard": return renderDashboard();
    case "pdv": return renderVendas();
    case "comandas": return renderComandas();
    case "entregas": return renderEntregas();
    case "produtos": return renderProdutos();
    case "estoque": return renderEstoque();
    case "caixa": return renderCaixa();
    case "financeiro": return renderFinanceiro();
    case "clientes": return renderClientes();
    case "fornecedores": return renderFornecedores();
    case "compras": return renderCompras();
    case "funcionarios": return renderFuncionarios();
    case "relatorios": return renderRelatorios();
    case "configuracoes": return renderConfiguracoes();
    default: return renderPlaceholder(state.page);
  }
}

function toJsDate(ts) {
  if (!ts) return null;
  if (typeof ts.toDate === "function") return ts.toDate();
  return new Date(ts);
}
function saleTimeLabel(s) {
  const d = toJsDate(s.createdAt);
  return d ? d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "";
}

const STAGNANT_DAYS = 30; // dias sem venda pra considerar o produto "parado"

function daysSince(ts) {
  const d = toJsDate(ts);
  if (!d) return null;
  return Math.floor((Date.now() - d.getTime()) / (1000 * 60 * 60 * 24));
}

// Produto "parado": sem nenhuma venda registrada nos últimos 30 dias.
// Se nunca vendeu, só conta como parado se já está cadastrado há tempo
// suficiente (produto novo não é "parado", só ainda não teve chance de vender).
function isStagnant(p) {
  const sinceSale = daysSince(p.lastSoldAt);
  if (sinceSale !== null) return sinceSale >= STAGNANT_DAYS;
  const sinceCreated = daysSince(p.createdAt);
  return sinceCreated !== null && sinceCreated >= STAGNANT_DAYS;
}

// Sugestão de reposição: olha o ritmo de venda dos últimos 7 dias (mesmo
// cache já usado no Dashboard, sem nenhuma consulta extra) e sugere repor
// o suficiente pra cobrir ~3 semanas nesse ritmo.
// Filtra vendas dos últimos N dias a partir de uma data explícita — nunca
// confia que o array recebido "já vem" só com N dias, sempre recorta de novo.
function salesWithinDays(salesRange, days) {
  const cutoff = new Date(); cutoff.setHours(0, 0, 0, 0); cutoff.setDate(cutoff.getDate() - (days - 1));
  return salesRange.filter(s => {
    const d = toJsDate(s.createdAt);
    return d && d >= cutoff;
  });
}

const WEEKDAY_FULL = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

// Média de faturamento por dia da semana (não soma bruta — divide pelo
// número de vezes que cada dia apareceu no período, pra não distorcer
// se o histórico tiver mais segundas do que sábados, por exemplo).
function buildDayOfWeekPattern(salesRange) {
  const totals = Array.from({ length: 7 }, () => ({ revenue: 0, occurrences: 0 }));
  const seenDates = new Set();
  salesRange.forEach(s => {
    if (s.status === "cancelada") return;
    const d = toJsDate(s.createdAt);
    if (!d) return;
    const dateKey = d.toISOString().slice(0, 10);
    const dow = d.getDay();
    if (!seenDates.has(dateKey)) { seenDates.add(dateKey); totals[dow].occurrences += 1; }
    totals[dow].revenue += s.total || 0;
  });
  return totals.map((t, i) => ({
    day: i,
    label: WEEKDAY_FULL[i],
    shortLabel: WEEKDAY_SHORT[i],
    avgRevenue: t.occurrences > 0 ? t.revenue / t.occurrences : 0,
  }));
}

// Fluxo de caixa futuro: quanto ainda entra e sai nos próximos 7 dias, e o
// saldo projetado (caixa de hoje + a receber − a pagar no período).
function computeCashFlowForecast() {
  const now = new Date();
  const in7Days = new Date(); in7Days.setDate(in7Days.getDate() + 7); in7Days.setHours(23, 59, 59, 999);

  const withinWindow = (item) => {
    const d = toJsDate(item.dueDate);
    return d && d >= now && d <= in7Days;
  };

  const receivables7d = (state.cashFlowReceivables || [])
    .filter(r => !r.received && withinWindow(r))
    .reduce((s, r) => s + (r.amount || 0), 0);

  const payables7d = (state.cashFlowPayables || [])
    .filter(p => !p.paid && withinWindow(p))
    .reduce((s, p) => s + (p.amount || 0), 0);

  let currentCash = 0;
  if (state.openCashRegister) {
    const vendas = (state.cashMovements || []).filter(m => m.type === "venda").reduce((s, m) => s + m.amount, 0);
    const sangrias = (state.cashMovements || []).filter(m => m.type === "sangria").reduce((s, m) => s + m.amount, 0);
    const suprimentos = (state.cashMovements || []).filter(m => m.type === "suprimento").reduce((s, m) => s + m.amount, 0);
    currentCash = (state.openCashRegister.openingAmount || 0) + vendas + suprimentos - sangrias;
  }

  return { receivables7d, payables7d, currentCash, projected: currentCash + receivables7d - payables7d };
}

function suggestReorderQty(p) {
  const recent = salesWithinDays(SALES_RANGE_CACHE, 30);
  const sold30 = recent
    .filter(s => s.status !== "cancelada")
    .reduce((sum, s) => sum + (s.items || []).filter(it => it.productId === p.id).reduce((n, it) => n + it.qty, 0), 0);
  const dailyRate = sold30 / 30;
  if (dailyRate <= 0) return 0;
  const idealStock = Math.ceil(dailyRate * 21);
  return Math.max(0, idealStock - p.stock);
}

// Dias até o estoque zerar no ritmo de venda atual (média dos últimos 30
// dias). Retorna null quando não há venda recente suficiente pra estimar.
function predictDaysUntilEmpty(p) {
  const recent = salesWithinDays(SALES_RANGE_CACHE, 30);
  const sold30 = recent
    .filter(s => s.status !== "cancelada")
    .reduce((sum, s) => sum + (s.items || []).filter(it => it.productId === p.id).reduce((n, it) => n + it.qty, 0), 0);
  const dailyRate = sold30 / 30;
  if (dailyRate <= 0 || p.stock <= 0) return null;
  return Math.floor(p.stock / dailyRate);
}

// Agrega os últimos N dias a partir de uma única consulta (SALES_RANGE_CACHE)
function buildRevenueByDay(salesRange, days = 7) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const buckets = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    buckets.push({ time: d.getTime(), day: WEEKDAY_SHORT[d.getDay()], value: 0 });
  }
  salesRange.forEach(s => {
    if (s.status === "cancelada") return;
    const d = toJsDate(s.createdAt);
    if (!d) return;
    d.setHours(0, 0, 0, 0);
    const bucket = buckets.find(b => b.time === d.getTime());
    if (bucket) bucket.value += s.total || 0;
  });
  return buckets.map(({ day, value }) => ({ day, value }));
}

// Ranking de produtos mais vendidos a partir dos itens das vendas do período
function buildTopProducts(salesRange, max = 5, days = null) {
  const sales = days ? salesWithinDays(salesRange, days) : salesRange;
  const map = new Map();
  sales.forEach(s => {
    if (s.status === "cancelada") return;
    (s.items || []).forEach(it => {
      const cur = map.get(it.productId) || { id: it.productId, name: it.name, sold: 0, revenue: 0 };
      cur.sold += it.qty;
      cur.revenue += it.qty * it.price - (it.discount || 0);
      map.set(it.productId, cur);
    });
  });
  return Array.from(map.values()).sort((a, b) => b.revenue - a.revenue).slice(0, max);
}

const RANK_MODES = {
  "mais-vendidos": { sortBy: "sold", order: "desc", label: "Mais vendidos", metricLabel: "Vendas" },
  "maior-faturamento": { sortBy: "revenue", order: "desc", label: "Maior faturamento", metricLabel: "Faturamento" },
  "maior-lucro": { sortBy: "profit", order: "desc", label: "Maior lucro", metricLabel: "Lucro" },
  "menor-saida": { sortBy: "sold", order: "asc", label: "Menor saída", metricLabel: "Vendas" },
};

// Ranking flexível: quantidade, faturamento ou lucro, em qualquer direção.
// Só entram produtos com pelo menos 1 venda no período (produto nunca
// vendido não é "menor saída", é "parado" — outra tela, outro conceito).
function buildProductRanking(salesRange, mode = "mais-vendidos", max = 8) {
  const { sortBy, order } = RANK_MODES[mode] || RANK_MODES["mais-vendidos"];
  const map = new Map();
  salesRange.forEach(s => {
    if (s.status === "cancelada") return;
    (s.items || []).forEach(it => {
      const cur = map.get(it.productId) || { id: it.productId, name: it.name, sold: 0, revenue: 0, profit: 0 };
      const product = PRODUCTS.find(p => p.id === it.productId);
      const cost = product?.cost || 0;
      cur.sold += it.qty;
      cur.revenue += it.qty * it.price - (it.discount || 0);
      cur.profit += (it.price - cost) * it.qty - (it.discount || 0);
      map.set(it.productId, cur);
    });
  });
  const arr = Array.from(map.values());
  arr.sort((a, b) => order === "asc" ? a[sortBy] - b[sortBy] : b[sortBy] - a[sortBy]);
  return arr.slice(0, max);
}

// Lucro real a partir do custo cadastrado em cada produto (atualizado a cada
// compra). Quando o produto não tem custo informado, considera lucro = receita
// pra esse item (melhor que assumir uma margem genérica que não é real).
function calcProfit(sales) {
  return sales.filter(s => s.status !== "cancelada").reduce((total, s) => {
    const saleProfit = (s.items || []).reduce((sum, it) => {
      const product = PRODUCTS.find(p => p.id === it.productId);
      const cost = product?.cost || 0;
      return sum + (it.price - cost) * it.qty;
    }, 0);
    return total + saleProfit - (s.discount || 0);
  }, 0);
}

// Gráfico de área em SVG puro — sem biblioteca externa, sem risco de falha de CDN.
function renderRevenueChart(data) {
  const W = 400, H = 92, padX = 6, padY = 10;
  const n = data.length;
  const values = data.map(d => d.value);
  const max = Math.max(...values, 0) || 1; // evita divisão por zero quando não há vendas ainda
  const stepX = n > 1 ? (W - padX * 2) / (n - 1) : 0;
  const todayIndex = n - 1;

  const points = data.map((d, i) => ({
    x: padX + i * stepX,
    y: padY + (1 - d.value / max) * (H - padY * 2),
    day: d.day,
  }));

  // Curva suavizada (Bézier cúbica usando pontos médios)
  let linePath = `M ${points[0].x} ${points[0].y}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i], p1 = points[i + 1];
    const midX = (p0.x + p1.x) / 2;
    linePath += ` C ${midX} ${p0.y}, ${midX} ${p1.y}, ${p1.x} ${p1.y}`;
  }
  const areaPath = `${linePath} L ${points[n - 1].x} ${H} L ${points[0].x} ${H} Z`;
  const today = points[todayIndex];

  return `
    <div class="relative h-full">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="absolute inset-x-0" style="top:0; bottom:16px; width:100%; height:calc(100% - 16px);">
        <defs>
          <linearGradient id="revGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E8590C" stop-opacity="0.22" />
            <stop offset="100%" stop-color="#E8590C" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path d="${areaPath}" fill="url(#revGrad)" />
        <path d="${linePath}" fill="none" stroke="#E8590C" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke" />
        <circle cx="${today.x}" cy="${today.y}" r="3.5" fill="#E8590C" stroke="#FFFFFF" stroke-width="1.6" />
      </svg>

      <!-- Rótulos dos dias, alinhados a cada ponto (espaçados quando há muitos pontos) -->
      <div class="absolute inset-x-0 bottom-0 h-4">
        ${(() => {
          const labelStep = Math.max(1, Math.ceil(n / 7));
          return points.map((p, i) => (i % labelStep !== 0 && i !== todayIndex) ? "" : `
            <span class="absolute text-2xs ${i === todayIndex ? "text-[#C2410C] font-semibold" : "text-[#B3A79D]"}"
              style="left:${(p.x / W) * 100}%; transform: translateX(-50%);">${p.day}</span>
          `).join("");
        })()}
      </div>
    </div>
  `;
}

function summaryCard(label, value, iconName, chip) {

function saleRow(s) {

}

/* =========================================================================
   NOVA VENDA — fluxo em tela cheia (mobile-first)
   ========================================================================= */
function getCartLines() {
  return state.cart.map(i => {
    const product = PRODUCTS.find(p => p.id === i.productId);
    const lineSubtotal = product.price * i.qty;
    const lineTotal = Math.max(0, lineSubtotal - i.discount);
    return { ...i, product, lineSubtotal, lineTotal };
  });
}

    return matchesCategory && matchesQuery;

  const lines = getCartLines();

          </div>
        </div>
        <div class="flex-1 overflow-y-auto px-3 pb-3">
          <button data-action="select-customer:" class="w-full flex items-center gap-3 px-2.5 py-2.5 rounded-xl hover:bg-[#FAF8F5] text-left transition-colors">
            <div class="w-9 h-9 rounded-full bg-[#F1EDE7] text-[#1B1210] flex items-center justify-center flex-shrink-0">${icon("users", 15)}</div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-[#241C1A]">Cliente Balcão</p>
              <p class="text-tiny text-[#79695C]">Sem identificação</p>
            </div>
            ${!state.selectedCustomerId ? icon("check", 16, "text-[#C2410C] flex-shrink-0") : ""}
          </button>
          ${filtered.length === 0
            ? `<div class="py-8 text-center text-sm text-[#7E7268]">${state.pdvCustomers.length === 0 ? "Nenhum cliente cadastrado ainda." : "Nenhum cliente encontrado."}</div>`
            : filtered.map(c => `
              <button data-action="select-customer:${c.id}" class="w-full flex items-center gap-3 px-2.5 py-2.5 rounded-xl hover:bg-[#FAF8F5] text-left transition-colors">
                <div class="w-9 h-9 rounded-full bg-[#FDE7DA] text-[#C2410C] flex items-center justify-center flex-shrink-0 text-xs font-semibold">${(c.name || "?").slice(0, 1).toUpperCase()}</div>
                <div class="min-w-0 flex-1">

function renderConfirmation() {
  const s = state.confirmedSale;
  return `
    <div class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden text-center p-7 fade-in">
        <div class="w-14 h-14 rounded-full bg-[#FDE7DA] text-[#C2410C] flex items-center justify-center mx-auto mb-4">${icon("check", 28)}</div>
        <h3 class="font-serif text-xl2 text-[#241C1A]">Venda concluída</h3>
        <p class="text-sm text-[#7E7268] mt-1">Venda ${s.id} registrada com sucesso</p>
        <div class="mt-5 bg-[#FAF8F5] rounded-2xl p-4 text-sm space-y-2 text-left">
          ${s.clientName && s.clientName !== "Cliente Balcão" ? `<div class="flex justify-between"><span class="text-[#7E7268]">Cliente</span><span class="text-[#241C1A]">${s.clientName}</span></div>` : ""}
          <div class="flex justify-between"><span class="text-[#7E7268]">Itens</span><span class="text-[#241C1A]">${s.itemsCount}</span></div>
          <div class="flex justify-between"><span class="text-[#7E7268]">Pagamento</span><span class="text-[#241C1A]">${s.payment}</span></div>
          <div class="flex justify-between"><span class="text-[#7E7268]">Horário</span><span class="text-[#241C1A]">${s.time}</span></div>
          <div class="flex justify-between pt-2 border-t border-[#E7E1D9]"><span class="font-medium text-[#241C1A]">Total</span><span class="font-serif text-[#C2410C] text-lg">${currency(s.total)}</span></div>
        </div>
        <button data-action="new-sale" class="w-full mt-6 bg-[#1B1210] text-white font-medium py-3 rounded-full text-sm hover:bg-[#2A1E1B] transition-colors">Nova venda</button>
        <button data-action="finish-and-close" class="w-full mt-2 text-[#7E7268] text-sm font-medium py-2 hover:text-[#241C1A]">Voltar para Vendas</button>
      </div>
    </div>
  `;
}

function renderSaleDetailModal(sale) {
  if (!sale) return "";
  const canCancel = sale.status !== "cancelada";
  const d = toJsDate(sale.createdAt);
  const dateTimeStr = d
    ? `${d.toLocaleDateString("pt-BR")} às ${d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`
    : "";
  return `
    <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in max-h-[92vh] flex flex-col">
        <div class="px-5 py-4 border-b border-[#F1EDE7] flex items-center justify-between flex-shrink-0">
          <div>
            <h3 class="font-serif text-lg2 text-[#241C1A]">Venda #${sale.id.replace("V-", "")}</h3>
            <p class="text-xs text-[#7E7268] mt-0.5">${dateTimeStr}${sale.employeeName ? " · " + sale.employeeName : ""}</p>
          </div>
          <button data-action="close-sale-detail" class="text-[#79695C] hover:text-[#241C1A]">${icon("x", 20)}</button>
        </div>
        <div class="flex-1 overflow-y-auto p-5 space-y-4">
          <div>${statusPill(sale.status)}</div>
          <div class="divide-y divide-[#F4F0E9]">
            ${sale.items.map(it => `
              <div class="py-2.5 flex items-center justify-between gap-3">
                <div class="min-w-0">
                  <p class="text-sm text-[#241C1A] font-medium truncate">${it.name}</p>
                  <p class="text-xs text-[#7E7268]">${it.qty} × ${currency(it.price)}${it.discount ? ` · desconto ${currency(it.discount)}` : ""}</p>
                </div>
                <p class="text-sm font-medium text-[#241C1A] flex-shrink-0">${currency(it.qty * it.price - (it.discount || 0))}</p>
              </div>
            `).join("")}
          </div>
          <div class="bg-[#F9F7F4] rounded-2xl p-4 text-sm space-y-2">
            <div class="flex justify-between"><span class="text-[#7E7268]">Subtotal</span><span class="text-[#241C1A]">${currency(sale.subtotal)}</span></div>
            <div class="flex justify-between"><span class="text-[#7E7268]">Desconto</span><span class="${sale.discount > 0 ? "text-[#1B1210]" : "text-[#241C1A]"}">${sale.discount > 0 ? "- " + currency(sale.discount) : currency(0)}</span></div>
            ${sale.serviceCharge > 0 ? `<div class="flex justify-between"><span class="text-[#7E7268]">Taxa de serviço</span><span class="text-[#241C1A]">+ ${currency(sale.serviceCharge)}</span></div>` : ""}
            <div class="flex justify-between pt-2 border-t border-[#EFEAE3]"><span class="font-medium text-[#241C1A]">Total</span><span class="font-serif text-[#C2410C] text-lg">${currency(sale.total)}</span></div>
            ${sale.paymentSplits && sale.paymentSplits.length > 0 ? `
              <div class="pt-1 space-y-1">
                <span class="text-[#7E7268]">Pagamento dividido</span>
                ${sale.paymentSplits.map(sp => `
                  <div class="flex justify-between pl-2"><span class="text-[#4A3F3A]">${sp.method}</span><span class="text-[#241C1A]">${currency(sp.amount)}</span></div>
                `).join("")}
              </div>
            ` : `
              <div class="flex justify-between pt-1"><span class="text-[#7E7268]">Pagamento</span><span class="text-[#241C1A]">${sale.payment}</span></div>
            `}
            ${sale.clientName && sale.clientName !== "Cliente Balcão" ? `
              <div class="flex justify-between pt-1"><span class="text-[#7E7268]">Cliente</span><span class="text-[#241C1A]">${sale.clientName}</span></div>
            ` : ""}
          </div>
        </div>
        <div class="p-4 border-t border-[#F1EDE7] flex flex-col gap-2 flex-shrink-0">
          ${(() => {
            const c = state.customers.find(x => x.id === sale.clientId) || state.pdvCustomers.find(x => x.id === sale.clientId);
            return c?.phone ? `
              <button data-action="whatsapp-order:${sale.id}" class="w-full flex items-center justify-center gap-1.5 bg-[#25D366] hover:bg-[#20BD5A] text-white text-sm font-medium py-3 rounded-full transition-colors">
                ${icon("whatsapp", 15)} Enviar pedido por WhatsApp
              </button>
            ` : "";
          })()}
          <div class="flex gap-2">
            <button data-action="print-receipt:${sale.id}" class="flex-1 flex items-center justify-center gap-1.5 border border-[#EFEAE3] text-[#4A3F3A] text-sm font-medium py-3 rounded-full hover:bg-[#F9F7F4] transition-colors">
              ${icon("printer", 15)} Comprovante
            </button>
            ${canCancel ? `
            <button data-action="cancel-sale:${sale.id}" class="flex-1 flex items-center justify-center gap-1.5 border border-[#D8CFC6] text-[#1B1210] text-sm font-medium py-3 rounded-full hover:bg-[#F1EDE7] transition-colors">
              ${icon("x", 15)} Cancelar
            </button>` : ""}
          </div>
        </div>
      </div>
    </div>
  `;
}

/* =========================================================================
   PRODUTOS — CRUD real no Firestore
   ========================================================================= */
function renderProdutos() {
  const q = (state.query || "").trim().toLowerCase();
  const categories = ["Todas", ...Array.from(new Set(PRODUCTS.map(p => p.category).filter(Boolean)))];
  const filtered = PRODUCTS.filter(p => {
    const matchesCategory = state.category === "Todas" || !state.category || p.category === state.category;
    const matchesQuery = !q || p.name.toLowerCase().includes(q) || (p.sku || "").toLowerCase().includes(q);
    return matchesCategory && matchesQuery;
  });

  return `
    <div class="space-y-6">
      <div class="flex items-center justify-between gap-3">
        <p class="text-sm text-[#7E7268]">${PRODUCTS.length} produto${PRODUCTS.length === 1 ? "" : "s"} ativos</p>
        <button data-action="open-product-modal" class="inline-flex items-center justify-center gap-1.5 bg-[#E8590C] hover:bg-[#C2410C] text-white text-sm font-medium px-5 py-3 rounded-full transition-all flex-shrink-0 active:scale-[0.98]">
          ${icon("plus", 16)} Novo produto
        </button>
      </div>

      <div class="flex flex-col sm:flex-row gap-2.5">
        <div class="relative flex-1">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#79695C]">${icon("search", 16)}</span>
          <input id="produtos-search" value="${state.query || ""}" placeholder="Buscar por nome ou código"
            class="w-full bg-white border border-[#EFEAE3] rounded-full pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
        </div>
        <div class="flex gap-2 overflow-x-auto no-scrollbar">
          ${categories.map(c => `
            <button data-action="set-category:${c}" class="whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs font-medium border transition-colors
              ${(state.category || "Todas") === c ? "bg-[#E8590C] border-[#E8590C] text-white" : "bg-white border-[#EFEAE3] text-[#4A3F3A] hover:border-[#E8590C]/40"}">${c}</button>
          `).join("")}
        </div>
      </div>

      <div class="bg-white border border-[#EFEAE3] rounded-2xl shadow-[0_1px_2px_rgba(27,18,16,0.04)] divide-y divide-[#F4F0E9] overflow-hidden">
        ${filtered.length === 0 ? `<div class="py-14 text-center text-sm text-[#7E7268]">Nenhum produto encontrado.</div>` : filtered.map(p => `
          <button data-action="edit-product:${p.id}" class="w-full flex items-center gap-3 px-4 sm:px-5 py-3.5 text-left hover:bg-[#FAF8F5] active:scale-[0.99] transition-all">
            <div class="w-10 h-10 rounded-full bg-[#FDE7DA] text-[#C2410C] flex items-center justify-center flex-shrink-0 overflow-hidden">
              ${p.imageUrl ? `<img src="${p.imageUrl}" class="w-full h-full object-cover" alt="" />` : icon("wine", 17)}
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-[#241C1A] truncate">${p.name}</p>
              <p class="text-tiny text-[#79695C] truncate">${p.sku || "—"} · ${p.category || "Sem categoria"}</p>
            </div>
            <div class="text-right flex-shrink-0">
              <p class="text-sm font-serif text-[#C2410C]">${currency(p.price)}</p>
              ${p.cost > 0 && p.price > 0 ? `<p class="text-2xs text-[#7E7268] mt-0.5">${(((p.price - p.cost) / p.price) * 100).toFixed(0)}% margem</p>` : ""}
              <p class="text-tiny mt-0.5 ${p.stock === 0 ? "text-[#1B1210] font-semibold" : p.stock <= (p.minStock ?? 0) ? "text-[#A67C00] font-semibold" : "text-[#7E7268]"}">${p.stock} un.</p>
            </div>
            <span class="w-8 h-8 rounded-lg flex items-center justify-center text-[#79695C] flex-shrink-0">${icon("edit", 15)}</span>
          </button>
        `).join("")}
      </div>
    </div>
    ${state.productModalOpen ? renderProductModal() : ""}
  `;
}

const CATEGORY_PRESETS = ["Cerveja", "Whisky", "Vodka", "Gin", "Cachaça", "Vinho", "Energético", "Refrigerante", "Água", "Outros"];

function renderProductModal() {
  const editing = state.editingProductId ? PRODUCTS.find(p => p.id === state.editingProductId) : null;
  const isLowStock = editing && editing.stock <= (editing.minStock ?? 0);
  const categoryOptions = Array.from(new Set([...CATEGORY_PRESETS, ...PRODUCTS.map(p => p.category).filter(Boolean)]));
  return `
    <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in max-h-[92vh] flex flex-col">
        <div class="px-5 py-4 border-b border-[#F1EDE7] flex items-center justify-between flex-shrink-0">
          <div class="min-w-0">
            <h3 class="font-serif text-lg2 text-[#241C1A]">${editing ? "Editar produto" : "Novo produto"}</h3>
            ${isLowStock ? `<p class="text-2xs text-[#A67C00] font-medium mt-0.5">${icon("box", 11, "inline -mt-0.5")} Estoque abaixo do mínimo</p>` : ""}
          </div>
          <button data-action="close-product-modal" class="text-[#79695C] hover:text-[#241C1A] flex-shrink-0">${icon("x", 20)}</button>

          ${state.formError ? `<div class="bg-[#F1EDE7] border border-[#D8CFC6] text-[#1B1210] text-xs rounded-xl px-3.5 py-2.5">${state.formError}</div>` : ""}

          <!-- Informações básicas -->
          <div class="space-y-3.5">
            <p class="text-2xs font-semibold uppercase tracking-[0.08em] text-[#A79684]">Informações básicas</p>
            <div>
              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Nome do produto <span class="text-[#C2410C]">*</span></label>
              <input id="pf-name" required value="${editing?.name || ""}" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Categoria</label>
                <input id="pf-category" list="pf-category-options" value="${editing?.category || ""}" placeholder="Selecione ou digite" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
                <datalist id="pf-category-options">
                  ${categoryOptions.map(c => `<option value="${c}"></option>`).join("")}
                </datalist>
              </div>
              <div>
                <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Marca</label>
                <input id="pf-brand" value="${editing?.brand || ""}" placeholder="ex: Heineken" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Código (SKU)</label>
                <input id="pf-sku" value="${editing?.sku || ""}" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
              </div>
              <div>
                <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Código de barras</label>
                <input id="pf-barcode" inputmode="numeric" value="${editing?.barcode || ""}" placeholder="Só números" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
              </div>
            </div>
          </div>

          <!-- Preços -->
          <div class="space-y-3.5">
            <p class="text-2xs font-semibold uppercase tracking-[0.08em] text-[#A79684]">Preços</p>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Preço de venda <span class="text-[#C2410C]">*</span></label>
                <div class="relative">
                  <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-sm text-[#A79684]">R$</span>
                  <input id="pf-price" type="text" inputmode="decimal" required value="${editing?.price ? formatCurrencyInput(String(Math.round(editing.price * 100))) : ""}" placeholder="0,00" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl pl-10 pr-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Custo</label>
                <div class="relative">
                  <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-sm text-[#A79684]">R$</span>
                  <input id="pf-cost" type="text" inputmode="decimal" value="${editing?.cost ? formatCurrencyInput(String(Math.round(editing.cost * 100))) : ""}" placeholder="0,00" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl pl-10 pr-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
                </div>
              </div>
            </div>
            <p class="text-tiny text-[#79695C]">O custo é atualizado automaticamente a cada compra registrada — pode ajustar aqui a qualquer momento também.</p>

              <p class="text-xs font-semibold text-[#4A3F3A]">Simulador de margem</p>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-2xs text-[#7E7268] mb-1">Margem desejada (%)</label>
                  <input id="pf-margin" type="number" min="0" max="95" step="0.5" value="${editing?.targetMargin ?? ""}" placeholder="ex: 40"
                    class="w-full bg-white border border-[#EFEAE3] rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
                </div>
                <div>
                  <label class="block text-2xs text-[#7E7268] mb-1">Taxas adicionais (%)</label>

              </div>
              <div class="flex items-center justify-between bg-white rounded-lg px-3 py-2.5 border border-[#EFEAE3]">

                <span id="pf-profit-display" class="text-sm font-medium text-[#241C1A]">—</span>

          <div class="space-y-3.5">
            <p class="text-2xs font-semibold uppercase tracking-[0.08em] text-[#A79684]">Estoque</p>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Quantidade</label>
                <input id="pf-stock" type="number" min="0" value="${editing?.stock ?? 0}" ${editing ? "disabled" : ""} class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20 disabled:opacity-50" />
              </div>
              <div>
                <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Estoque mínimo</label>
                <input id="pf-minstock" type="number" min="0" value="${editing?.minStock ?? 5}" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
              </div>
            </div>
            ${editing ? `<p class="text-tiny text-[#79695C]">Pra corrigir a quantidade, use a tela de Estoque (registra o motivo do ajuste) — aqui é só o estoque mínimo que dispara o alerta.</p>` : ""}
          </div>

          <!-- Detalhes adicionais -->
          <div class="space-y-3.5">
            <p class="text-2xs font-semibold uppercase tracking-[0.08em] text-[#A79684]">Detalhes adicionais</p>
            <div class="grid grid-cols-2 gap-3">
