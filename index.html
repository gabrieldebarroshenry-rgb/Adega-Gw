                <select id="pf-supplier" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20">
                  <option value="">Sem fornecedor</option>
                  ${(state.suppliers || []).map(s => `<option value="${s.id}" ${editing?.supplierId === s.id ? "selected" : ""}>${s.name}</option>`).join("")}
                </select>
              </div>
              <div>
                <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Validade</label>
                <input id="pf-expiry" type="date" value="${editing?.expiryDate || ""}" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Descrição / observações</label>
              <textarea id="pf-description" rows="2" placeholder="Detalhes que ajudam na hora da venda ou reposição" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20 resize-none">${editing?.description || ""}</textarea>
            </div>
            <div>
              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Link da foto (opcional)</label>
              <input id="pf-image" value="${editing?.imageUrl || ""}" placeholder="https://..." class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
              <p class="text-tiny text-[#79695C] mt-1">Cole um link de imagem já hospedada (Drive, Imgur, etc). Upload direto de arquivo é um recurso futuro.</p>
            </div>
            ${editing ? `
            <label class="flex items-center gap-2.5 pt-1">
              <input id="pf-active" type="checkbox" ${editing.active !== false ? "checked" : ""} class="w-4 h-4 rounded accent-[#E8590C]" />
              <span class="text-sm text-[#241C1A]">Produto ativo</span>
            </label>
            <p class="text-tiny text-[#79695C] -mt-2">Desativar não apaga o produto nem o histórico de vendas — só some das listas de venda e estoque. Exclusão definitiva não existe de propósito, pra nunca quebrar uma venda antiga.</p>
            ` : ""}
          </div>
        </form>
        <div class="p-4 border-t border-[#F1EDE7] flex-shrink-0 flex gap-2">
          <button type="button" data-action="close-product-modal" class="flex-1 border border-[#EFEAE3] text-[#4A3F3A] font-medium py-3 rounded-full text-sm hover:bg-[#F9F7F4] transition-colors">
            Cancelar
          </button>
          ${!editing ? `
          <button type="submit" form="product-form" data-save-mode="new" ${state.formLoading ? "disabled" : ""}
            class="flex-1 border border-[#E8590C] text-[#C2410C] disabled:opacity-50 font-medium py-3 rounded-full text-sm hover:bg-[#FDE7DA] transition-all active:scale-[0.98]">
            Salvar e Novo
          </button>
          ` : ""}
          <button type="submit" form="product-form" data-save-mode="close" ${state.formLoading ? "disabled" : ""}
            class="flex-1 bg-[#E8590C] disabled:bg-[#D8CFC6] text-white font-medium py-3 rounded-full text-sm hover:bg-[#C2410C] transition-all active:scale-[0.98]">
            ${state.formLoading ? "Salvando..." : editing ? "Salvar produto" : "Salvar produto"}
          </button>
        </div>
      </div>
    </div>
  `;
}

/* =========================================================================
   ESTOQUE — níveis e ajuste manual (com motivo)
   ========================================================================= */
function renderEstoque() {
  const q = (state.query || "").trim().toLowerCase();
  const filterType = state.stockFilter || "todos";

  const withMeta = PRODUCTS.map(p => ({
    ...p,
    _stagnant: isStagnant(p),
    _reorder: suggestReorderQty(p),
  }));

  const sorted = [...withMeta].sort((a, b) => (a.stock <= (a.minStock ?? 0) ? -1 : 1) - (b.stock <= (b.minStock ?? 0) ? -1 : 1));
  const filtered = sorted.filter(p => {
    const matchesQuery = !q || p.name.toLowerCase().includes(q) || (p.sku || "").toLowerCase().includes(q);
    const matchesFilter =
      filterType === "todos" ? true :
      filterType === "zerado" ? p.stock === 0 :
      filterType === "baixo" ? p.stock > 0 && p.stock <= (p.minStock ?? 0) :
      filterType === "parado" ? p._stagnant :
      true;
    return matchesQuery && matchesFilter;
  });

  const outOfStock = PRODUCTS.filter(p => p.stock === 0).length;
  const lowStock = PRODUCTS.filter(p => p.stock > 0 && p.stock <= (p.minStock ?? 0)).length;
  const stagnantCount = withMeta.filter(p => p._stagnant).length;

  const FILTERS = [
    ["todos", "Todos"],
    ["zerado", "Zerado"],
    ["baixo", "Baixo"],
    ["parado", "Parados"],
  ];

  return `
    <div class="space-y-6">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <p class="text-sm text-[#7E7268]">${outOfStock} zerado${outOfStock === 1 ? "" : "s"} · ${lowStock} próximo${lowStock === 1 ? "" : "s"} de acabar · ${stagnantCount} parado${stagnantCount === 1 ? "" : "s"}</p>
        <div class="flex gap-2 flex-wrap">
          ${isManager(state.currentUser) ? `
          <button data-action="open-product-modal" class="inline-flex items-center justify-center gap-1.5 bg-[#E8590C] hover:bg-[#C2410C] text-white text-sm font-medium px-4 py-2.5 rounded-full transition-all active:scale-[0.98] flex-shrink-0">
            ${icon("plus", 15)} Novo produto
          </button>
          ` : ""}
          <button data-action="open-inventory-count" class="inline-flex items-center justify-center gap-1.5 bg-[#1B1210] hover:bg-[#2A1E1B] text-white text-sm font-medium px-4 py-2.5 rounded-full transition-colors flex-shrink-0">
            ${icon("barcode", 15)} Contagem de inventário
          </button>
        </div>
      </div>

      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#79695C]">${icon("search", 16)}</span>
        <input id="estoque-search" value="${state.query || ""}" placeholder="Buscar produto"
          class="w-full bg-white border border-[#EFEAE3] rounded-full pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
      </div>

      <div class="flex gap-2 overflow-x-auto no-scrollbar">
        ${FILTERS.map(([v, label]) => `
          <button data-action="set-stock-filter:${v}" class="whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs font-medium border transition-colors
            ${filterType === v ? "bg-[#1B1210] border-[#1B1210] text-white" : "bg-white border-[#EFEAE3] text-[#4A3F3A] hover:border-[#1B1210]/30"}">${label}</button>
        `).join("")}
      </div>

      <div class="bg-white border border-[#EFEAE3] rounded-2xl shadow-[0_1px_2px_rgba(27,18,16,0.04)] divide-y divide-[#F4F0E9] overflow-hidden">
        ${filtered.length === 0 ? `<div class="py-14 text-center text-sm text-[#7E7268]">Nenhum produto encontrado.</div>` : filtered.map(p => {
          const status = p.stock === 0
            ? `<span class="text-tiny font-medium px-2 py-1 rounded-full bg-[#F1EDE7] text-[#1B1210] whitespace-nowrap">Zerado</span>`
            : p.stock <= (p.minStock ?? 0)
              ? `<span class="text-tiny font-medium px-2 py-1 rounded-full bg-[#FFF3D6] text-[#A67C00] whitespace-nowrap">Baixo</span>`
              : `<span class="text-tiny font-medium px-2 py-1 rounded-full bg-[#F9F7F4] text-[#7E7268] whitespace-nowrap">Ok</span>`;
          const metaBits = [p.sku || "—"];
          if (p._stagnant) metaBits.push("sem venda há 30+ dias");
          const daysLeft = predictDaysUntilEmpty(p);
          if (daysLeft !== null && daysLeft <= 14) metaBits.push(daysLeft === 0 ? "acaba hoje" : `acaba em ~${daysLeft}d`);
          if (p._reorder > 0) metaBits.push(`sugestão: repor ${p._reorder} un.`);
          return `
          <div class="flex items-center gap-3 px-4 sm:px-5 py-3.5">
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-[#241C1A] truncate">${p.name}</p>
              <p class="text-tiny text-[#79695C] truncate">${metaBits.join(" · ")}</p>
            </div>
            <p class="text-sm text-[#241C1A] flex-shrink-0 hidden sm:block w-14 text-right">${p.stock} un.</p>
            <div class="flex-shrink-0 flex flex-col items-end gap-1">
              ${status}
              ${p._stagnant ? `<span class="text-2xs font-medium px-1.5 py-0.5 rounded-full bg-[#F1EDE7] text-[#4A3F3A] whitespace-nowrap">Parado</span>` : ""}
            </div>
            <button data-action="open-stock-history:${p.id}" data-tip="Histórico" class="w-8 h-8 rounded-full flex items-center justify-center text-[#7E7268] hover:bg-[#F4F2EF] flex-shrink-0">${icon("clock", 15)}</button>
            ${p.stock <= (p.minStock ?? 0) ? `<button data-action="open-supplier-picker:${p.id}" data-tip="Avisar fornecedor" class="w-8 h-8 rounded-full flex items-center justify-center text-[#25D366] hover:bg-[#E9F9EF] flex-shrink-0">${icon("whatsapp", 15)}</button>` : ""}
            <button data-action="open-stock-adjust:${p.id}" class="text-xs font-medium text-[#C2410C] border border-[#F5C9A8] px-3 py-1.5 rounded-full hover:bg-[#FDE7DA] transition-colors flex-shrink-0">Ajustar</button>
          </div>`;
        }).join("")}
      </div>
    </div>
    ${state.stockAdjustProductId ? renderStockAdjustModal() : ""}
    ${state.stockHistoryProductId ? renderStockHistoryModal() : ""}
    ${state.supplierPickerOpen ? renderSupplierPickerModal() : ""}
    ${state.inventoryCountOpen ? renderInventoryCountOverlay() : ""}
    ${state.productModalOpen ? renderProductModal() : ""}
  `;
}

function renderStockAdjustModal() {
  const p = PRODUCTS.find(x => x.id === state.stockAdjustProductId);
  if (!p) return "";
  return `
    <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in">
        <div class="px-5 py-4 border-b border-[#F1EDE7] flex items-center justify-between">
          <h3 class="font-serif text-lg2 text-[#241C1A]">Ajustar estoque</h3>
          <button data-action="close-stock-adjust" class="text-[#79695C] hover:text-[#241C1A]">${icon("x", 20)}</button>
        </div>
        <form id="stock-adjust-form" class="p-5 space-y-3.5">
          ${state.formError ? `<div class="bg-[#F1EDE7] border border-[#D8CFC6] text-[#1B1210] text-xs rounded-xl px-3.5 py-2.5">${state.formError}</div>` : ""}
          <div>
            <p class="text-sm font-medium text-[#241C1A]">${p.name}</p>
            <p class="text-xs text-[#7E7268]">Estoque atual: ${p.stock} un.</p>
          </div>
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Ajuste (use negativo para reduzir, ex: -3)</label>
            <input id="sa-delta" type="number" step="1" required placeholder="ex: 10 ou -3" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Motivo</label>
            <input id="sa-reason" required placeholder="ex: Contagem de inventário, avaria..." class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>
          <button type="submit" ${state.formLoading ? "disabled" : ""} class="w-full bg-[#E8590C] disabled:bg-[#D8CFC6] text-white font-medium py-3 rounded-full text-sm hover:bg-[#C2410C] transition-all active:scale-[0.98]">
            ${state.formLoading ? "Salvando..." : "Confirmar ajuste"}
          </button>
        </form>
      </div>
    </div>
  `;
}

function renderStockHistoryModal() {
  const p = PRODUCTS.find(x => x.id === state.stockHistoryProductId);
  if (!p) return "";
  const movements = state.stockHistoryMovements;
  return `
    <div id="stock-history-modal" class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in max-h-[80vh] flex flex-col">
        <div class="px-5 py-4 border-b border-[#F1EDE7] flex items-center justify-between flex-shrink-0">
          <div class="min-w-0">
            <h3 class="font-serif text-lg2 text-[#241C1A]">Histórico de estoque</h3>
            <p class="text-xs text-[#7E7268] mt-0.5 truncate">${p.name}</p>
          </div>
          <button data-action="close-stock-history" class="text-[#79695C] hover:text-[#241C1A] flex-shrink-0">${icon("x", 20)}</button>
        </div>
        <div class="flex-1 overflow-y-auto p-5">
          ${state.stockHistoryLoading ? skeletonListRows(3) : movements.length === 0 ? `
            <div class="py-12 text-center text-sm text-[#7E7268]">Nenhuma movimentação registrada ainda.</div>
          ` : `
            <div class="space-y-2.5">
              ${movements.map(m => stockMoveRow(m)).join("")}
            </div>
          `}
        </div>
      </div>
    </div>
  `;
}

function renderInventoryCountOverlay() {
  const q = (state.inventoryQuery || "").trim().toLowerCase();
  const filtered = PRODUCTS.filter(p => !q || p.name.toLowerCase().includes(q) || (p.sku || "").toLowerCase().includes(q));
  const countedNum = Object.keys(state.inventoryCounts).length;
  const diffNum = Object.entries(state.inventoryCounts).filter(([id, val]) => {
    const p = PRODUCTS.find(x => x.id === id);
    return p && val !== p.stock;
  }).length;

  return `
    <div id="inventory-count-overlay" class="fixed inset-0 z-50 lg:bg-black/40 lg:flex lg:items-center lg:justify-center lg:p-6">
    <div class="bg-white flex flex-col h-full lg:h-[85vh] lg:max-w-2xl lg:w-full lg:rounded-3xl lg:shadow-2xl lg:overflow-hidden">
      <div class="h-14 flex items-center gap-3 px-4 border-b border-[#F1EDE7] flex-shrink-0">
        <button data-action="close-inventory-count" class="text-[#4A3F3A] p-1 -ml-1">${icon("arrowLeft", 20)}</button>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-medium text-[#241C1A]">Contagem de inventário</p>
          <p id="inv-summary" class="text-2xs text-[#7E7268]">${countedNum} contado${countedNum === 1 ? "" : "s"} · ${diffNum} divergência${diffNum === 1 ? "" : "s"}</p>
        </div>
      </div>

      <div class="p-4 border-b border-[#F1EDE7] flex-shrink-0">
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#79695C]">${icon("search", 16)}</span>
          <input id="inventory-search" value="${state.inventoryQuery || ""}" placeholder="Buscar produto pra contar"
            class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-full pl-9 pr-9 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          <button data-action="open-barcode-scanner:inventory" data-tip="Ler código de barras" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[#79695C] hover:text-[#C2410C] p-1">${icon("barcode", 16)}</button>
        </div>
        <p class="text-2xs text-[#79695C] mt-2">Digite a quantidade física de cada produto, ou escaneie o código de barras — cada leitura soma 1 na contagem.</p>
      </div>

      <div class="flex-1 overflow-y-auto divide-y divide-[#F4F0E9]">
        ${filtered.length === 0 ? `<div class="py-14 text-center text-sm text-[#7E7268]">Nenhum produto encontrado.</div>` : filtered.map(p => {
          const counted = state.inventoryCounts[p.id];
          const hasCounted = counted !== undefined;
          const diff = hasCounted ? counted - p.stock : null;
          const showBadge = hasCounted && diff !== 0;
          return `
          <div class="flex items-center gap-3 px-4 py-3">
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-[#241C1A] truncate">${p.name}</p>
              <p class="text-2xs text-[#79695C] truncate">Sistema: ${p.stock} un.${p.sku ? " · " + p.sku : ""}</p>
            </div>
            <span id="inv-diff-${p.id}" class="text-2xs font-medium px-2 py-1 rounded-full flex-shrink-0 ${diff > 0 ? "bg-[#FDE7DA] text-[#C2410C]" : "bg-[#F1EDE7] text-[#1B1210]"}" style="${showBadge ? "" : "display:none"}">${diff > 0 ? "+" + diff : diff}</span>
            <input type="number" min="0" id="inv-input-${p.id}" data-inventory-count="${p.id}" data-system-stock="${p.stock}" value="${hasCounted ? counted : ""}" placeholder="—"
              class="w-16 text-center bg-[#F9F7F4] border ${showBadge ? "border-[#E8590C]/40" : "border-[#EFEAE3]"} rounded-lg px-2 py-2 text-sm flex-shrink-0 focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>`;
        }).join("")}
      </div>

      <div class="p-4 border-t border-[#F1EDE7] flex-shrink-0 bg-[#F9F7F4]">
        <button id="inv-finalize-btn" data-action="finalize-inventory-count" ${diffNum === 0 || state.inventorySubmitting ? "disabled" : ""}
          class="w-full bg-[#E8590C] disabled:bg-[#D8CFC6] disabled:cursor-not-allowed text-white font-medium py-3.5 rounded-full text-sm hover:bg-[#C2410C] transition-all active:scale-[0.98]">
          ${state.inventorySubmitting ? "Ajustando estoque..." : diffNum > 0 ? `Finalizar contagem (${diffNum} ajuste${diffNum === 1 ? "" : "s"})` : "Finalizar contagem"}
        </button>
      </div>
    </div>
    </div>
  `;
}

function renderSupplierPickerModal() {
  const p = PRODUCTS.find(x => x.id === state.supplierPickerProductId);
  if (!p) return "";
  const withPhone = state.suppliers.filter(s => s.phone);
  return `
    <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in max-h-[75vh] flex flex-col">
        <div class="px-5 py-4 border-b border-[#F1EDE7] flex items-center justify-between flex-shrink-0">
          <div class="min-w-0">
            <h3 class="font-serif text-lg2 text-[#241C1A]">Avisar fornecedor</h3>
            <p class="text-xs text-[#7E7268] mt-0.5 truncate">Sobre: ${p.name}</p>
          </div>
          <button data-action="close-supplier-picker" class="text-[#79695C] hover:text-[#241C1A] flex-shrink-0">${icon("x", 20)}</button>
        </div>
        <div class="flex-1 overflow-y-auto p-3">
          ${withPhone.length === 0 ? `<div class="py-10 text-center text-sm text-[#7E7268] px-4">Nenhum fornecedor com telefone cadastrado ainda.</div>` :
            withPhone.map(s => `
              <div class="flex items-center gap-3 px-2 py-2.5 rounded-xl">
                <div class="w-8 h-8 rounded-full bg-[#F1EDE7] text-[#1B1210] flex items-center justify-center flex-shrink-0">${icon("truck", 14)}</div>
                <p class="text-sm font-medium text-[#241C1A] truncate flex-1 min-w-0">${s.name}</p>
                <button data-action="whatsapp-supplier:${s.id}" class="flex items-center gap-1.5 text-xs font-medium text-[#25D366] border border-[#25D366]/40 px-3 py-1.5 rounded-full hover:bg-[#E9F9EF] transition-colors flex-shrink-0">
                  ${icon("whatsapp", 13)} Enviar
                </button>
              </div>
            `).join("")}
        </div>
      </div>
    </div>
  `;
}

function stockMoveRow(m) {
  const typeLabels = { venda: "Venda", compra: "Compra", ajuste: "Ajuste manual", comanda: "Comanda" };
  const label = typeLabels[m.type] || m.type || "Movimentação";
  const positive = m.quantity > 0;
  const d = toJsDate(m.createdAt);
  const dateStr = d ? `${d.toLocaleDateString("pt-BR")} · ${d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}` : "";
  const chip = positive ? "bg-[#FDE7DA] text-[#C2410C]" : "bg-[#F1EDE7] text-[#1B1210]";
  return `
    <div class="flex items-center gap-3 bg-[#F9F7F4] rounded-xl px-3.5 py-3">
      <div class="min-w-0 flex-1">
        <p class="text-sm text-[#241C1A] truncate">${m.reason || label}</p>
        <p class="text-tiny text-[#79695C] mt-0.5">${label} · ${dateStr}</p>
      </div>
      <span class="text-sm font-semibold px-2 py-1 rounded-full flex-shrink-0 ${chip}">${positive ? "+" : ""}${m.quantity}</span>
    </div>
  `;
}

/* =========================================================================
   CAIXA — abertura, sangria, suprimento e fechamento
   ========================================================================= */
function renderCaixa() {
  if (!state.openCashRegister) {
    return `
      <div class="max-w-sm mx-auto">
        <div class="bg-white border border-[#EFEAE3] rounded-2xl shadow-[0_1px_2px_rgba(27,18,16,0.04)] p-6 text-center">
          <div class="w-12 h-12 rounded-full bg-[#FDE7DA] text-[#C2410C] flex items-center justify-center mx-auto mb-4">${icon("wallet", 20)}</div>
          <h3 class="font-serif text-lg text-[#241C1A] mb-1.5">Caixa fechado</h3>
          <p class="text-xs text-[#7E7268] mb-5">Informe o valor inicial para abrir o caixa do turno.</p>
          <form id="open-cash-form" class="space-y-3 text-left">
            ${state.formError ? `<div class="bg-[#F1EDE7] border border-[#D8CFC6] text-[#1B1210] text-xs rounded-xl px-3.5 py-2.5">${state.formError}</div>` : ""}
            <div>
              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Saldo inicial (R$)</label>
              <input id="oc-amount" type="number" min="0" step="0.01" required placeholder="0,00" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
            </div>
            <button type="submit" ${state.formLoading ? "disabled" : ""} class="w-full bg-[#E8590C] disabled:bg-[#D8CFC6] text-white font-medium py-3 rounded-full text-sm hover:bg-[#C2410C] transition-all active:scale-[0.98]">
              ${state.formLoading ? "Abrindo..." : "Abrir caixa"}
            </button>
          </form>
        </div>
      </div>
      ${renderCashModals()}
    `;
  }

  const c = state.openCashRegister;
  const vendas = state.cashMovements.filter(m => m.type === "venda");
  const sangrias = state.cashMovements.filter(m => m.type === "sangria");
  const suprimentos = state.cashMovements.filter(m => m.type === "suprimento");
  const totalVendas = vendas.reduce((s, m) => s + m.amount, 0);
  const totalSangrias = sangrias.reduce((s, m) => s + m.amount, 0);
  const totalSuprimentos = suprimentos.reduce((s, m) => s + m.amount, 0);
  const saldoEsperado = (c.openingAmount || 0) + totalVendas + totalSuprimentos - totalSangrias;

  return `
    <div class="space-y-6">
      <div class="flex items-center justify-between gap-3">
        <p class="text-sm text-[#7E7268]">Aberto por ${c.openedByName || "—"}</p>
        <span class="text-tiny font-medium px-2.5 py-1 rounded-full bg-[#FDE7DA] text-[#C2410C] flex-shrink-0">Aberto</span>
      </div>

      <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
        ${summaryCard("Saldo inicial", currency(c.openingAmount || 0), "wallet", "bg-[#F1EDE7] text-[#1B1210]")}
        ${summaryCard("Vendas", currency(totalVendas), "receipt", "bg-[#FDE7DA] text-[#C2410C]")}
        ${summaryCard("Sangrias", currency(totalSangrias), "trendUp", "bg-[#FFF3D6] text-[#A67C00]")}
        ${summaryCard("Saldo esperado", currency(saldoEsperado), "wallet", "bg-[#F6DEB8] text-[#A67C00]")}
      </div>

      <div class="flex gap-2">
        <button data-action="open-cash-move:sangria" class="flex-1 bg-white border border-[#EFEAE3] text-[#4A3F3A] text-sm font-medium py-3 rounded-full hover:border-[#1B1210]/20 transition-colors">Sangria</button>
        <button data-action="open-cash-move:suprimento" class="flex-1 bg-white border border-[#EFEAE3] text-[#4A3F3A] text-sm font-medium py-3 rounded-full hover:border-[#1B1210]/20 transition-colors">Suprimento</button>
        <button data-action="open-close-cash" class="flex-1 bg-[#1B1210] text-white text-sm font-medium py-3 rounded-full hover:bg-[#2A1E1B] transition-colors">Fechar caixa</button>
      </div>

      <div>
        <h3 class="font-serif text-base text-[#241C1A] mb-3">Movimentações</h3>
        <div class="bg-white border border-[#EFEAE3] rounded-2xl shadow-[0_1px_2px_rgba(27,18,16,0.04)] divide-y divide-[#F4F0E9] overflow-hidden">
          ${state.cashMovements.length === 0 ? `<div class="py-10 text-center text-sm text-[#7E7268]">Nenhuma movimentação ainda.</div>` : state.cashMovements.slice().reverse().map(m => `
            <div class="flex items-center gap-3 px-4 sm:px-5 py-3">
              <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${m.type === "venda" ? "bg-[#FDE7DA] text-[#C2410C]" : m.type === "suprimento" ? "bg-[#FFF3D6] text-[#A67C00]" : "bg-[#F1EDE7] text-[#1B1210]"}">
                ${icon(m.type === "venda" ? "receipt" : "wallet", 14)}
              </div>
              <div class="min-w-0 flex-1">
                <p class="text-sm text-[#241C1A] capitalize">${m.type}${m.reason ? ` — ${m.reason}` : ""}</p>
              </div>
              <p class="text-sm font-medium flex-shrink-0 ${m.type === "sangria" ? "text-[#1B1210]" : "text-[#C2410C]"}">${m.type === "sangria" ? "-" : "+"}${currency(m.amount)}</p>
            </div>
          `).join("")}
        </div>
      </div>
    </div>
    ${renderCashModals()}
  `;
}

function renderCashModals() {
  return `
    ${state.cashMoveType ? `
    <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in">
        <div class="px-5 py-4 border-b border-[#F1EDE7] flex items-center justify-between">
          <h3 class="font-serif text-lg2 text-[#241C1A] capitalize">${state.cashMoveType}</h3>
          <button data-action="close-cash-move" class="text-[#79695C] hover:text-[#241C1A]">${icon("x", 20)}</button>
        </div>
        <form id="cash-move-form" class="p-5 space-y-3.5">
          ${state.formError ? `<div class="bg-[#F1EDE7] border border-[#D8CFC6] text-[#1B1210] text-xs rounded-xl px-3.5 py-2.5">${state.formError}</div>` : ""}
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Valor (R$)</label>
            <input id="cm-amount" type="number" min="0" step="0.01" required placeholder="0,00" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />

          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Motivo</label>
            <input id="cm-reason" placeholder="ex: Pagamento de fornecedor" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>
          <button type="submit" ${state.formLoading ? "disabled" : ""} class="w-full bg-[#E8590C] disabled:bg-[#D8CFC6] text-white font-medium py-3 rounded-full text-sm hover:bg-[#C2410C] transition-all active:scale-[0.98]">
            ${state.formLoading ? "Salvando..." : "Confirmar"}
          </button>
        </form>
      </div>
    </div>` : ""}

    ${state.closeCashOpen ? (() => {
      const c = state.openCashRegister;
      const vendas = state.cashMovements.filter(m => m.type === "venda").reduce((s, m) => s + m.amount, 0);
      const sangrias = state.cashMovements.filter(m => m.type === "sangria").reduce((s, m) => s + m.amount, 0);
      const suprimentos = state.cashMovements.filter(m => m.type === "suprimento").reduce((s, m) => s + m.amount, 0);
      const esperado = (c?.openingAmount || 0) + vendas + suprimentos - sangrias;
      return `
      <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in">
          <div class="px-5 py-4 border-b border-[#F1EDE7] flex items-center justify-between">
            <h3 class="font-serif text-lg2 text-[#241C1A]">Fechar caixa</h3>
            <button data-action="close-close-cash" class="text-[#79695C] hover:text-[#241C1A]">${icon("x", 20)}</button>
          </div>
          <form id="close-cash-form" class="p-5 space-y-3.5">
            ${state.formError ? `<div class="bg-[#F1EDE7] border border-[#D8CFC6] text-[#1B1210] text-xs rounded-xl px-3.5 py-2.5">${state.formError}</div>` : ""}
            <div class="bg-[#F9F7F4] rounded-xl p-3.5 text-sm flex justify-between">
              <span class="text-[#7E7268]">Saldo esperado</span>
              <span class="font-medium text-[#241C1A]">${currency(esperado)}</span>
            </div>
            <div>
              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Saldo informado (contado no caixa)</label>
              <input id="cc-informed" type="number" min="0" step="0.01" required placeholder="0,00" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
            </div>
            <button type="submit" ${state.formLoading ? "disabled" : ""} class="w-full bg-[#1B1210] disabled:bg-[#D8CFC6] text-white font-medium py-3 rounded-full text-sm hover:bg-[#2A1E1B] transition-colors">
              ${state.formLoading ? "Fechando..." : "Confirmar fechamento"}
            </button>
          </form>
        </div>
      </div>`;
    })() : ""}
  `;
}

/* =========================================================================
   FINANCEIRO — contas a pagar e a receber
   ========================================================================= */
function renderFinanceiro() {
  const payablesOpen = state.financePayables.filter(p => !p.paid);
  const receivablesOpen = state.financeReceivables.filter(r => !r.received);
  const totalPagar = payablesOpen.reduce((s, p) => s + (p.amount || 0), 0);
  const totalReceber = receivablesOpen.reduce((s, r) => s + (r.amount || 0), 0);
  const list = state.financeTab === "pagar" ? state.financePayables : state.financeReceivables;

  const TABS = [
    ["visao", "Visão geral"],
    ["pagar", "A pagar"],
    ["receber", "A receber"],
    ["recorrentes", "Recorrentes"],
    ["contas", "Contas"],
    ["categorias", "Categorias"],
    ["fluxo", "Fluxo de caixa"],
  ];
  const newButtonAction = { visao: null, pagar: "open-finance-modal", receber: "open-finance-modal", recorrentes: "open-recurring-modal", contas: "open-account-modal", categorias: "open-category-modal", fluxo: null }[state.financeTab];
  const newButtonLabel = { pagar: "Nova conta", receber: "Nova conta", recorrentes: "Nova recorrente", contas: "Nova conta financeira", categorias: "Nova categoria" }[state.financeTab];

  return `
    <div class="space-y-6">
      <div class="flex items-center justify-between gap-3">
        <p class="text-sm text-[#7E7268]">${payablesOpen.length} a pagar · ${receivablesOpen.length} a receber</p>
        ${newButtonAction ? `
        <button data-action="${newButtonAction}" class="inline-flex items-center justify-center gap-1.5 bg-[#E8590C] hover:bg-[#C2410C] text-white text-sm font-medium px-5 py-3 rounded-full transition-all flex-shrink-0 active:scale-[0.98]">
          ${icon("plus", 16)} ${newButtonLabel}
        </button>
        ` : ""}
      </div>

      <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
        ${summaryCard("A pagar (pendente)", currency(totalPagar), "landmark", "bg-[#F1EDE7] text-[#1B1210]")}
        ${summaryCard("A receber (pendente)", currency(totalReceber), "wallet", "bg-[#FDE7DA] text-[#C2410C]")}
      </div>

      <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
        ${TABS.map(([v, label]) => `
          <button data-action="set-finance-tab:${v}" class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-colors flex-shrink-0 ${state.financeTab === v ? "bg-[#1B1210] text-white" : "bg-[#F4F2EF] text-[#4A3F3A]"}">${label}</button>
        `).join("")}
      </div>

      ${state.financeTab === "visao" ? renderFinanceOverviewTab() : ""}
      ${state.financeTab === "recorrentes" ? renderRecurringTab() : ""}
      ${state.financeTab === "contas" ? renderAccountsTab() : ""}
      ${state.financeTab === "categorias" ? renderCategoriesTab() : ""}
      ${state.financeTab === "fluxo" ? renderCashFlowTab() : ""}
      ${(state.financeTab === "pagar" || state.financeTab === "receber") ? `
      <div class="space-y-2.5">
        ${list.length === 0
          ? `<div class="bg-white border border-[#EFEAE3] rounded-2xl shadow-[0_1px_2px_rgba(27,18,16,0.04)] py-14 text-center text-sm text-[#7E7268]">Nenhuma conta ${state.financeTab === "pagar" ? "a pagar" : "a receber"} cadastrada ainda.</div>`
          : list.map(item => financeRow(item, state.financeTab)).join("")}
      </div>
      ${state.financeTab === "pagar" ? loadMoreButton("payables", state.payablesHasMore) : loadMoreButton("receivables", state.receivablesHasMore)}
      ` : ""}
    </div>
    ${state.financeModalOpen ? renderFinanceModal() : ""}
    ${state.recurringModalOpen ? renderRecurringModal() : ""}
    ${state.accountModalOpen ? renderAccountModal() : ""}
    ${state.categoryModalOpen ? renderCategoryModal() : ""}
    ${state.confirmPaymentItem ? renderConfirmPaymentModal() : ""}
  `;
}

const RECURRING_CATEGORIES = ["Aluguel", "Internet", "Energia", "Sistema", "Salários", "Fornecedores", "Outro"];
const COST_CENTERS = ["Loja/Balcão", "Delivery", "Administrativo", "Marketing", "Outro"];
const ACCOUNT_TYPES = [["caixa", "Caixa"], ["banco", "Banco"], ["pix", "Pix"], ["outro", "Outro"]];
const ACCOUNT_TYPE_ICON = { caixa: "wallet", banco: "landmark", pix: "wine", outro: "box" };

function renderAccountsTab() {
  const totalBalance = state.financialAccounts.filter(a => a.active !== false).reduce((s, a) => s + (a.currentBalance || 0), 0);
  return `
    <div class="space-y-4">
      <div class="bg-[#1B1210] rounded-2xl px-5 py-4">
        <p class="text-2xs uppercase tracking-[0.14em] text-[#E8590C] mb-1">Saldo total em contas</p>
        <p class="font-serif text-2xl2 text-white">${currency(totalBalance)}</p>
      </div>
      <div class="space-y-2.5">
        ${state.financialAccounts.length === 0
          ? `<div class="bg-white border border-[#EFEAE3] rounded-2xl shadow-[0_1px_2px_rgba(27,18,16,0.04)] py-14 text-center text-sm text-[#7E7268]">Nenhuma conta financeira cadastrada ainda.</div>`
          : state.financialAccounts.map(a => `
            <button data-action="edit-account:${a.id}" class="w-full text-left flex items-center gap-3 bg-white border border-[#EFEAE3] rounded-2xl shadow-[0_1px_2px_rgba(27,18,16,0.04)] px-4 py-3.5 hover:border-[#E8590C]/25 active:scale-[0.99] transition-all ${a.active === false ? "opacity-50" : ""}">
              <div class="w-9 h-9 rounded-full bg-[#FDE7DA] text-[#C2410C] flex items-center justify-center flex-shrink-0">${icon(ACCOUNT_TYPE_ICON[a.type] || "wallet", 15)}</div>
              <div class="min-w-0 flex-1">
                <p class="text-sm font-medium text-[#241C1A] truncate">${a.name}</p>
                <p class="text-tiny text-[#7E7268]">${ACCOUNT_TYPES.find(t => t[0] === a.type)?.[1] || "Conta"}${a.active === false ? " · inativa" : ""}</p>
              </div>
              <p class="text-sm font-serif text-[#241C1A] flex-shrink-0">${currency(a.currentBalance || 0)}</p>
            </button>
          `).join("")}
      </div>
    </div>
  `;
}

function renderCategoriesTab() {
  const receitas = state.financeCategories.filter(c => c.type === "receita");
  const despesas = state.financeCategories.filter(c => c.type === "despesa");
  const totalByCategory = (categoryId, kind) => {
    const list = kind === "receita" ? (state.cashFlowReceivables || []) : (state.cashFlowPayables || []);
    const filtered = list.filter(item => item.categoryId === categoryId && (kind === "receita" ? item.received : item.paid));
    return filtered.reduce((s, item) => s + (item.amount || 0), 0);
  };
  const catRow = (c) => `
    <button data-action="edit-category:${c.id}" class="w-full text-left flex items-center gap-3 bg-white border border-[#EFEAE3] rounded-2xl shadow-[0_1px_2px_rgba(27,18,16,0.04)] px-4 py-3 hover:border-[#E8590C]/25 active:scale-[0.99] transition-all ${c.active === false ? "opacity-50" : ""}">
      <div class="w-2 h-2 rounded-full flex-shrink-0 ${c.type === "receita" ? "bg-[#C2410C]" : "bg-[#1B1210]"}"></div>
      <p class="text-sm text-[#241C1A] flex-1 min-w-0 truncate">${c.name}</p>
      ${c.active === false ? `<span class="text-2xs text-[#A79684] flex-shrink-0">inativa</span>` : ""}
      <span class="text-sm font-serif text-[#241C1A] flex-shrink-0">${currency(totalByCategory(c.id, c.type))}</span>
    </button>
  `;
  return `
    <div class="space-y-5">
      <p class="text-2xs text-[#79695C] -mt-1.5 px-1">Valor total já pago/recebido em cada categoria (histórico completo).</p>
      <div>
        <p class="text-xs font-semibold text-[#4A3F3A] mb-2">Receitas</p>
        <div class="space-y-2">
          ${receitas.length === 0 ? `<p class="text-sm text-[#7E7268] px-1">Nenhuma categoria de receita ainda.</p>` : receitas.map(catRow).join("")}
        </div>
      </div>
      <div>
        <p class="text-xs font-semibold text-[#4A3F3A] mb-2">Despesas</p>
        <div class="space-y-2">
          ${despesas.length === 0 ? `<p class="text-sm text-[#7E7268] px-1">Nenhuma categoria de despesa ainda.</p>` : despesas.map(catRow).join("")}
        </div>
      </div>
    </div>
  `;
}

        </div>
        <form id="account-form" class="p-5 space-y-4">
          ${state.formError ? `<div class="bg-[#F1EDE7] border border-[#D8CFC6] text-[#1B1210] text-xs rounded-xl px-3.5 py-2.5">${state.formError}</div>` : ""}
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-2">Tipo</label>

            <div class="grid grid-cols-4 gap-2">
              ${ACCOUNT_TYPES.map(([v, label]) => `

                  ${icon(ACCOUNT_TYPE_ICON[v] || "wallet", 18)}
                  <span class="text-2xs font-medium">${label}</span>
                </button>
              `).join("")}
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Nome</label>
            <input id="fa-name" required value="${editing?.name || ""}" placeholder="ex: Banco Itaú, Pix Adega GW" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Saldo ${editing ? "atual" : "inicial"}</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-sm text-[#A79684]">R$</span>
              <input id="fa-balance" type="number" step="0.01" value="${editing?.currentBalance ?? ""}" placeholder="0,00" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl pl-10 pr-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
            </div>
            ${editing ? `<p class="text-2xs text-[#79695C] mt-1">Editar aqui corrige o saldo direto — não gera um movimento no extrato.</p>` : ""}
          </div>
          ${editing ? `
          <label class="flex items-center gap-2.5 cursor-pointer select-none">
            <input id="fa-active" type="checkbox" ${editing.active !== false ? "checked" : ""} class="w-[15px] h-[15px] rounded accent-[#E8590C] cursor-pointer" />
            <span class="text-sm text-[#4A3F3A]">Ativa</span>
          </label>
          ` : ""}
          <button type="submit" ${state.formLoading ? "disabled" : ""} class="w-full bg-[#E8590C] disabled:bg-[#D8CFC6] text-white font-medium py-3 rounded-full text-sm hover:bg-[#C2410C] transition-all active:scale-[0.98]">
            ${state.formLoading ? "Salvando..." : editing ? "Salvar alterações" : "Criar conta"}
          </button>
        </form>
      </div>
    </div>
  `;
}

function renderCategoryModal() {
  const editing = state.editingCategoryId ? state.financeCategories.find(c => c.id === state.editingCategoryId) : null;
  return `
    <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in">
        <div class="px-5 py-4 border-b border-[#F1EDE7] flex items-center justify-between">
          <h3 class="font-serif text-lg2 text-[#241C1A]">${editing ? "Editar categoria" : "Nova categoria"}</h3>
          <button data-action="close-category-modal" class="text-[#79695C] hover:text-[#241C1A]">${icon("x", 20)}</button>
        </div>
        <form id="category-form" class="p-5 space-y-3.5">
          ${state.formError ? `<div class="bg-[#F1EDE7] border border-[#D8CFC6] text-[#1B1210] text-xs rounded-xl px-3.5 py-2.5">${state.formError}</div>` : ""}
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Nome</label>
            <input id="fc-name" required value="${editing?.name || ""}" placeholder="ex: Marketing, Fornecedores, Vendas" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>
          <div>

// Agrupa o extrato de movimentos por dia, semana (segunda-a-domingo) ou mês.
function buildCashFlowGroups(movements, grouping) {
  const groups = new Map();
  movements.forEach(m => {
    const d = toJsDate(m.createdAt);
    if (!d) return;
    let key, label;
    if (grouping === "dia") {
      key = d.toISOString().slice(0, 10);
      label = d.toLocaleDateString("pt-BR");
    } else if (grouping === "semana") {
      const monday = new Date(d);
      const day = monday.getDay();
      monday.setDate(monday.getDate() - ((day + 6) % 7)); // volta pra segunda-feira
      key = monday.toISOString().slice(0, 10);
      label = `Semana de ${monday.toLocaleDateString("pt-BR")}`;
    } else {
      key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      label = d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    }
    const g = groups.get(key) || { key, label, entradas: 0, saidas: 0, sortDate: d };
    if (m.type === "entrada") g.entradas += m.amount || 0; else g.saidas += m.amount || 0;
    if (d > g.sortDate) g.sortDate = d;
    groups.set(key, g);
  });
  return Array.from(groups.values()).sort((a, b) => b.sortDate - a.sortDate);
}

// DRE simplificada do mês atual: faturamento → custos → despesas → taxas de
// cartão (estimadas) → lucro líquido. Usa o cache de 30 dias que o app já
// carrega (sem consulta extra), filtrado pro mês corrente.
function buildMonthDRE() {
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const monthSales = SALES_RANGE_CACHE.filter(s => {
    const d = toJsDate(s.createdAt);
    return d && d >= monthStart && s.status !== "cancelada";
  });
  const faturamento = monthSales.reduce((s, sale) => s + (sale.total || 0), 0);
  const custos = monthSales.reduce((s, sale) =>
    s + (sale.items || []).reduce((si, it) => {
      const p = PRODUCTS.find(x => x.id === it.productId);
      return si + (p?.cost || 0) * it.qty;
    }, 0), 0);
  const despesas = (state.cashFlowPayables || []).filter(p => {
    const d = toJsDate(p.paidAt);
    return p.paid && d && d >= monthStart;
  }).reduce((s, p) => s + (p.amount || 0), 0);
  const feeCredito = (state.storeSettings.cardFeeCredito || 0) / 100;
  const feeDebito = (state.storeSettings.cardFeeDebito || 0) / 100;
  const taxasCartao = monthSales.reduce((s, sale) => {
    if (sale.payment === "Crédito") return s + (sale.total || 0) * feeCredito;
    if (sale.payment === "Débito") return s + (sale.total || 0) * feeDebito;
    return s;
  }, 0);
  const lucroLiquido = faturamento - custos - despesas - taxasCartao;
  return { faturamento, custos, despesas, taxasCartao, lucroLiquido, monthSales };
}

function buildPaymentBreakdown(sales) {
  const map = new Map();
  sales.filter(s => s.status !== "cancelada").forEach(s => {
    if (s.paymentSplits && s.paymentSplits.length > 0) {
      s.paymentSplits.forEach(sp => {
        const cur = map.get(sp.method) || { label: sp.method || "Outros", count: 0, total: 0 };
        cur.total += sp.amount || 0;
        map.set(sp.method, cur);
      });
      // Conta a venda uma vez só, na forma de pagamento de maior valor no split.
      const main = s.paymentSplits.reduce((a, b) => (b.amount > a.amount ? b : a));
      map.get(main.method).count += 1;
    } else {
      const cur = map.get(s.payment) || { label: s.payment || "Outros", count: 0, total: 0 };
      cur.count += 1;
      cur.total += s.total || 0;
      map.set(s.payment, cur);
    }
  });
  return Array.from(map.values()).sort((a, b) => b.total - a.total);
}

function buildEmployeePerformance(sales) {
  const map = new Map();
  sales.filter(s => s.status !== "cancelada").forEach(s => {
    const key = s.employeeName || "—";
    const cur = map.get(key) || { name: key, count: 0, total: 0 };
    cur.count += 1;
    cur.total += s.total || 0;
    map.set(key, cur);
  });
  return Array.from(map.values()).sort((a, b) => b.total - a.total);
}

const formatNumBR = (v) => (v ?? 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// Exporta o detalhe das vendas do período como CSV (separador ";", padrão
// PT-BR de decimal com vírgula) — usa só o que já está carregado na tela,
// sem nenhuma consulta extra ao Firestore.
function exportReportCSV(sales, periodLabel) {
  const escapeCsv = (val) => {
    const s = String(val ?? "");
    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const headers = ["Data", "Hora", "Funcionário", "Cliente", "Forma de pagamento", "Status", "Itens", "Subtotal", "Desconto", "Total", "Lucro estimado"];
  const rows = sales.map(s => {
    const d = toJsDate(s.createdAt);
    const dateStr = d ? d.toLocaleDateString("pt-BR") : "";
    const itemsStr = (s.items || []).map(it => `${it.qty}x ${it.name}`).join(" | ");
    const paymentStr = s.paymentSplits && s.paymentSplits.length > 0
      ? s.paymentSplits.map(sp => `${sp.method} (${currency(sp.amount)})`).join(" + ")
      : (s.payment || "");
    return [
      dateStr, saleTimeLabel(s), s.employeeName || "", s.clientName || "Cliente Balcão",
      paymentStr, s.status || "", itemsStr,
      formatNumBR(s.subtotal), formatNumBR(s.discount), formatNumBR(s.total), formatNumBR(calcProfit([s])),
    ].map(escapeCsv).join(";");
  });
  if (rows.length === 0) { showToast("Nenhuma venda no período pra exportar."); return; }

  const csv = "\uFEFF" + [headers.join(";"), ...rows].join("\r\n"); // BOM garante acentuação correta no Excel
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `vinha-real-vendas-${periodLabel}-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("CSV exportado");
}

// Monta o texto do comprovante de uma venda (formato simples, ótimo pra
// WhatsApp/SMS/e-mail — não depende de nenhuma lib de PDF).
function buildReceiptText(sale) {
  const d = toJsDate(sale.createdAt);
  const dateStr = d ? d.toLocaleDateString("pt-BR") : (sale.date || "");
  const lines = [
    "VINHA REAL",
    `Venda #${sale.id.replace("V-", "")}`,
    `${dateStr}${sale.time ? " às " + sale.time : ""}`.trim(),
    "",
    ...( (sale.items || []).flatMap(it => [
      it.name,
      `  ${it.qty}x ${currency(it.price)} = ${currency(it.qty * it.price - (it.discount || 0))}`,
    ])),
    "--------------------------------",
    `Subtotal: ${currency(sale.subtotal)}`,
  ];
  if (sale.discount > 0) lines.push(`Desconto: -${currency(sale.discount)}`);
  if (sale.serviceCharge > 0) lines.push(`Taxa de serviço: +${currency(sale.serviceCharge)}`);
  lines.push(`Total: ${currency(sale.total)}`);
  lines.push("");
  lines.push(`Pagamento: ${sale.payment}`);
  if (sale.clientName && sale.clientName !== "Cliente Balcão") lines.push(`Cliente: ${sale.clientName}`);
  if (sale.employeeName) lines.push(`Atendido por: ${sale.employeeName}`);
  lines.push("");
  lines.push("Obrigado pela preferência!");
  return lines.join("\n");
}

// Compartilha o comprovante: tenta o menu nativo de compartilhamento do
// celular primeiro (WhatsApp, SMS, e-mail...); se não houver suporte, copia
// o texto pra área de transferência pra colar onde quiser.
// Abre o WhatsApp já com a conversa e a mensagem prontas — a pessoa ainda
// precisa apertar "enviar" do lado de lá; não existe disparo automático
// sem a API paga do WhatsApp Business (que exige aprovação da Meta).
function openWhatsApp(phone, message) {
  if (!phone) { showToast("Esse contato não tem telefone cadastrado."); return; }
  const digits = phone.replace(/\D/g, "");
  if (!digits) { showToast("Telefone inválido."); return; }
  const withCountry = digits.length <= 11 ? `55${digits}` : digits;
  const url = `https://wa.me/${withCountry}${message ? `?text=${encodeURIComponent(message)}` : ""}`;
  window.open(url, "_blank");
}

async function shareReceipt(sale) {
  const text = buildReceiptText(sale);
  const title = `Comprovante — Venda #${sale.id.replace("V-", "")}`;

  if (navigator.share) {
    try {
      await navigator.share({ title, text });
      return;
    } catch (e) {
      if (e?.name === "AbortError") return; // usuário cancelou o compartilhamento
      // qualquer outro erro cai pro fallback de cópia abaixo
    }
  }

  try {
    await navigator.clipboard.writeText(text);
    showToast("Comprovante copiado — cole onde quiser enviar");
    return;
  } catch (e) { /* segue pro último fallback */ }

  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    showToast("Comprovante copiado — cole onde quiser enviar");
  } catch (e) {
    showToast("Não foi possível compartilhar o comprovante.");
  }
}

// Calcula o total a cobrar no fechamento de uma comanda, considerando o
// desconto e a taxa de serviço opcional (10% sobre o valor já descontado).
function computeComandaCloseTotals(comanda) {
  const subtotal = comanda.subtotal || 0;
  const discount = Number(state.comandaDiscount) || 0;
  const afterDiscount = Math.max(0, subtotal - discount);
  const serviceCharge = state.comandaServiceCharge ? Math.round(afterDiscount * 0.10 * 100) / 100 : 0;
  const total = afterDiscount + serviceCharge;
  return { subtotal, discount, afterDiscount, serviceCharge, total };
}

// Atualiza só os números do modal de fechamento (taxa de serviço + total),
// sem recriar os campos — evita perder o foco de quem está digitando.
function updateComandaCloseTotals() {
  const comanda = state.comandas.find(c => c.id === state.activeComandaId);
  if (!comanda) return;
  const { serviceCharge, total } = computeComandaCloseTotals(comanda);
  const serviceEl = document.getElementById("comanda-service-charge-value");
  if (serviceEl) serviceEl.textContent = serviceCharge > 0 ? "+ " + currency(serviceCharge) : currency(0);
  const totalEl = document.getElementById("comanda-close-total");
  if (totalEl) totalEl.textContent = currency(total);
}

// Máscara de valor em R$: digita só números, formata sozinho (ex: "1234" -> "12,34").
// Sempre formata a partir dos dígitos brutos — não tem o problema clássico
// de cursor pulando de posição ao reformatar em campo de texto.
function formatCurrencyInput(rawValue) {
  const digits = (rawValue || "").replace(/\D/g, "");
  if (!digits) return "";
  const num = parseInt(digits, 10) / 100;
  return num.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function parseCurrencyInput(rawValue) {
  const digits = (rawValue || "").replace(/\D/g, "");
  return digits ? parseInt(digits, 10) / 100 : 0;
}
function bindCurrencyMask(id, onInput) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("input", (e) => {
    e.target.value = formatCurrencyInput(e.target.value);
    if (onInput) onInput();
  });
}

function updatePricingSimulator() {
  const costEl = document.getElementById("pf-cost");
  const priceEl = document.getElementById("pf-price");
  const marginEl = document.getElementById("pf-margin");
  const feesEl = document.getElementById("pf-fees");
  const suggestedEl = document.getElementById("pf-suggested-price");
  const profitEl = document.getElementById("pf-profit-display");
  if (!costEl || !priceEl || !suggestedEl || !profitEl) return;

  const cost = parseCurrencyInput(costEl.value);
  const price = parseCurrencyInput(priceEl.value);
  const margin = Number(marginEl?.value) || 0;
  const fees = Number(feesEl?.value) || 0;

  // Preço sugerido: custo dividido por (1 - margem% - taxas%), ambas como
  // fração do preço final — assim a margem "bate" de verdade no preço, não
  // só sobre o custo (evita o erro clássico de confundir margem com markup).
  const denom = 1 - margin / 100 - fees / 100;
  if (cost > 0 && margin > 0 && denom > 0.01) {
    const suggested = cost / denom;
    suggestedEl.textContent = currency(suggested);
    suggestedEl.dataset.value = suggested.toFixed(2);
  } else {
    suggestedEl.textContent = "—";
    suggestedEl.dataset.value = "";
  }

  // Lucro com o preço que já está no campo "Preço de venda" agora mesmo.
  if (price > 0) {
    const profit = price - cost - (price * fees) / 100;
    const profitPct = (profit / price) * 100;
    const color = profit > 0 ? "text-[#C2410C]" : profit < 0 ? "text-[#1B1210]" : "text-[#4A3F3A]";
    profitEl.className = `text-sm font-medium ${color}`;
    profitEl.textContent = `${currency(profit)} (${profitPct.toFixed(1)}%)`;
  } else {
    profitEl.textContent = "—";
    profitEl.className = "text-sm font-medium text-[#241C1A]";
  }
}

    const informed = Number(document.getElementById("cc-informed").value);

    const c = state.openCashRegister;
    const vendas = state.cashMovements.filter(m => m.type === "venda").reduce((s, m) => s + m.amount, 0);
    const sangrias = state.cashMovements.filter(m => m.type === "sangria").reduce((s, m) => s + m.amount, 0);
    const suprimentos = state.cashMovements.filter(m => m.type === "suprimento").reduce((s, m) => s + m.amount, 0);
    const expected = (c.openingAmount || 0) + vendas + suprimentos - sangrias;
    const difference = Number((informed - expected).toFixed(2));
    const confirmMsg = difference !== 0
      ? `Fechar o caixa com diferença de ${currency(Math.abs(difference))} (${difference > 0 ? "sobrando" : "faltando"})? Não dá pra reabrir depois.`

// Atualiza só o selo de diferença e a borda do campo de um produto, sem
// recriar a lista inteira — preserva o foco de quem está digitando.
function updateInventoryRowUI(productId) {
  const input = document.getElementById(`inv-input-${productId}`);
  const badge = document.getElementById(`inv-diff-${productId}`);
  if (!input) return;
  const systemStock = Number(input.dataset.systemStock) || 0;
  const hasCounted = input.value !== "";
  const counted = Number(input.value) || 0;
  const diff = hasCounted ? counted - systemStock : null;
  const showBadge = hasCounted && diff !== 0;

  if (badge) {
    badge.style.display = showBadge ? "" : "none";
    if (showBadge) {
      badge.textContent = diff > 0 ? `+${diff}` : String(diff);
      badge.className = `text-2xs font-medium px-2 py-1 rounded-full flex-shrink-0 ${diff > 0 ? "bg-[#FDE7DA] text-[#C2410C]" : "bg-[#F1EDE7] text-[#1B1210]"}`;
    }
  }
  input.className = `w-16 text-center bg-[#F9F7F4] border ${showBadge ? "border-[#E8590C]/40" : "border-[#EFEAE3]"} rounded-lg px-2 py-2 text-sm flex-shrink-0 focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20`;
}

function updateInventorySummary() {
  const countedNum = Object.keys(state.inventoryCounts).length;
  const diffNum = Object.entries(state.inventoryCounts).filter(([id, val]) => {
    const p = PRODUCTS.find(x => x.id === id);
    return p && val !== p.stock;
  }).length;
  const summaryEl = document.getElementById("inv-summary");
  if (summaryEl) summaryEl.textContent = `${countedNum} contado${countedNum === 1 ? "" : "s"} · ${diffNum} divergência${diffNum === 1 ? "" : "s"}`;
  const btn = document.getElementById("inv-finalize-btn");
  if (btn) {
    btn.disabled = diffNum === 0;
    btn.textContent = diffNum > 0 ? `Finalizar contagem (${diffNum} ajuste${diffNum === 1 ? "" : "s"})` : "Finalizar contagem";
  }
}

let toastTimer = null;
// Leitor de código de barras — carrega a biblioteca só quando usada pela
// primeira vez (não pesa no carregamento inicial do app pra quem não usa).
let jspdfLoadPromise = null;
function loadJsPDF() {
  if (window.jspdf?.jsPDF?.API?.autoTable) return Promise.resolve();
  if (jspdfLoadPromise) return jspdfLoadPromise;
  jspdfLoadPromise = new Promise((resolve, reject) => {
    const s1 = document.createElement("script");
    s1.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js";
    s1.onload = () => {
      const s2 = document.createElement("script");
      s2.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/5.0.8/jspdf.plugin.autotable.min.js";
      s2.onload = () => resolve();
      s2.onerror = () => { jspdfLoadPromise = null; reject(new Error("Não foi possível carregar o gerador de PDF.")); };
      document.head.appendChild(s2);
    };
    s1.onerror = () => { jspdfLoadPromise = null; reject(new Error("Não foi possível carregar o gerador de PDF.")); };
    document.head.appendChild(s1);
  });
  return jspdfLoadPromise;
}

let xlsxLoadPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    script.onload = () => resolve();
    script.onerror = () => { xlsxLoadPromise = null; reject(new Error("Não foi possível carregar o gerador de Excel.")); };
    document.head.appendChild(script);
  });
  return xlsxLoadPromise;
}

// Exportação genérica — qualquer um dos 10 relatórios usa a mesma função,
// só muda o título/cabeçalhos/linhas que cada um monta.
async function exportReportExcel(title, headers, rows, filename) {
  try {
    await loadXLSX();
    const ws = window.XLSX.utils.aoa_to_sheet([headers, ...rows]);
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, title.slice(0, 31));
    window.XLSX.writeFile(wb, `${filename}.xlsx`);
    showToast("Excel exportado");
  } catch (e) {
    console.error(e);
    showToast(e.message || "Não foi possível exportar o Excel.");
  }
}

async function exportReportPDF(title, subtitle, headers, rows, filename) {
  try {
    await loadJsPDF();
    const doc = new window.jspdf.jsPDF();
    doc.setFontSize(15);
    doc.text("Vinha Real", 14, 16);
    doc.setFontSize(11);
    doc.text(title, 14, 24);
    let startY = 30;
    if (subtitle) {
      doc.setFontSize(9);
      doc.setTextColor(130);
      doc.text(subtitle, 14, 30);
      doc.setTextColor(0);
      startY = 36;
    }
    doc.autoTable({
      head: [headers], body: rows, startY,
      styles: { fontSize: 8, cellPadding: 3 },
      headStyles: { fillColor: [232, 89, 12], textColor: 255 },
      alternateRowStyles: { fillColor: [249, 247, 244] },
    });
    doc.save(`${filename}.pdf`);
    showToast("PDF exportado");
  } catch (e) {
    console.error(e);
    showToast(e.message || "Não foi possível exportar o PDF.");
  }
}
