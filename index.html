async function buildProReportData(key) {
  switch (key) {
    case "vendas": {
      const rows = state.reportSales.map(s => {
        const d = toJsDate(s.createdAt);
        return [d ? d.toLocaleDateString("pt-BR") : "", saleTimeLabel(s), s.employeeName || "", s.clientName || "Cliente Balcão",
          s.payment || "", s.status || "", formatNumBR(s.subtotal), formatNumBR(s.discount), formatNumBR(s.total)];
      });
      return { title: "Relatório de Vendas", headers: ["Data", "Hora", "Funcionário", "Cliente", "Pagamento", "Status", "Subtotal", "Desconto", "Total"], rows };
    }
    case "lucro": {
      const ranking = buildProductRanking(state.reportSales, "maior-lucro", 9999);
      const rows = ranking.map(p => [p.name, p.sold, formatNumBR(p.revenue), formatNumBR(p.revenue - p.profit), formatNumBR(p.profit), p.revenue > 0 ? `${((p.profit / p.revenue) * 100).toFixed(1)}%` : "0%"]);
      return { title: "Relatório de Lucro por Produto", headers: ["Produto", "Qtd vendida", "Faturamento", "Custo", "Lucro", "Margem"], rows };
    }
    case "estoque": {
      const rows = PRODUCTS.map(p => [p.name, p.sku || "", p.category || "", p.stock, p.minStock ?? 0, formatNumBR(p.cost || 0), formatNumBR(p.price || 0), p.stock === 0 ? "Zerado" : p.stock <= (p.minStock ?? 0) ? "Baixo" : "Ok"]);
      return { title: "Relatório de Estoque", headers: ["Produto", "SKU", "Categoria", "Estoque", "Estoque mín.", "Custo", "Preço", "Status"], rows };
    }
    case "compras": {
      const purchases = await fb.listPurchases(500);
      const rows = purchases.map(p => {
        const d = toJsDate(p.createdAt);
        const qty = (p.items || []).reduce((s, it) => s + it.qty, 0);
        return [d ? d.toLocaleDateString("pt-BR") : "", p.supplierName || "—", qty, formatNumBR(p.total)];
      });
      return { title: "Relatório de Compras", headers: ["Data", "Fornecedor", "Itens", "Total"], rows };
    }
    case "produtos": {
      const rows = PRODUCTS.map(p => [p.name, p.sku || "", p.category || "", formatNumBR(p.price || 0), formatNumBR(p.cost || 0), p.cost > 0 && p.price > 0 ? `${(((p.price - p.cost) / p.price) * 100).toFixed(1)}%` : "—", p.stock]);
      return { title: "Catálogo de Produtos", headers: ["Produto", "SKU", "Categoria", "Preço", "Custo", "Margem", "Estoque"], rows };
    }
    case "clientes": {
      if (!state.pdvCustomersLoaded) { state.pdvCustomers = await fb.listCustomers(300); state.pdvCustomersLoaded = true; }
      const rows = state.pdvCustomers.map(c => [c.name, c.phone || "", c.email || ""]);
      return { title: "Relatório de Clientes", headers: ["Nome", "Telefone", "E-mail"], rows };
    }
    case "fornecedores": {
      if (!state.suppliersLoaded) { state.suppliers = await fb.listSuppliers(200); state.suppliersLoaded = true; }
      const rows = state.suppliers.map(s => [s.name, s.phone || "", s.email || ""]);
      return { title: "Relatório de Fornecedores", headers: ["Nome", "Telefone", "E-mail"], rows };
    }
    case "caixa": {
      const registers = await fb.listCashRegisters(100);
      const rows = registers.map(r => {
        const opened = toJsDate(r.openedAt);
        return [opened ? opened.toLocaleDateString("pt-BR") : "", r.openedByName || "", formatNumBR(r.openingAmount || 0),
          formatNumBR(r.expectedAmount || 0), formatNumBR(r.informedAmount || 0), formatNumBR(r.difference || 0), r.status === "aberto" ? "Aberto" : "Fechado"];
      });
      return { title: "Relatório de Caixa", headers: ["Data", "Aberto por", "Valor inicial", "Esperado", "Informado", "Diferença", "Status"], rows };
    }
    case "perdas": {
      const movements = await fb.listStockMovements({ max: 500 });
      const losses = movements.filter(m => m.type === "ajuste" && m.quantity < 0);
      const rows = losses.map(m => {
        const d = toJsDate(m.createdAt);
        return [d ? d.toLocaleDateString("pt-BR") : "", m.productName || "", Math.abs(m.quantity), m.reason || ""];
      });
      return { title: "Relatório de Perdas", headers: ["Data", "Produto", "Quantidade", "Motivo"], rows };
    }
    case "financeiro": {
      const [payables, receivables] = await Promise.all([fb.listAccountsPayable(500), fb.listAccountsReceivable(500)]);
      const rows = [
        ...payables.map(p => ["A pagar", p.description || "", p.supplierName || "", formatNumBR(p.amount), p.paid ? "Pago" : "Pendente"]),
        ...receivables.map(r => ["A receber", r.description || "", r.clientName || "", formatNumBR(r.amount), r.received ? "Recebido" : "Pendente"]),
      ];
      return { title: "Contas a Pagar e Receber", headers: ["Tipo", "Descrição", "Contato", "Valor", "Status"], rows };
    }
  }
}


let tesseractLoadPromise = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    script.onload = () => resolve();
    script.onerror = () => { tesseractLoadPromise = null; reject(new Error("Não foi possível carregar o leitor de nota fiscal.")); };
    document.head.appendChild(script);
  });
  return tesseractLoadPromise;
}

// Heurísticas simples em cima do texto reconhecido — nada de "entender" a
// nota de verdade, só procurar padrões de data e valor em R$. Confiável só
// até certo ponto; por isso sempre mostramos o texto bruto pra conferência.
function parseInvoiceText(text) {
  const dateMatch = text.match(/(\d{2})\/(\d{2})\/(\d{2,4})/);
  let detectedDate = null;
  if (dateMatch) {
    let [, dd, mm, yyyy] = dateMatch;
    if (yyyy.length === 2) yyyy = "20" + yyyy;
    if (Number(dd) <= 31 && Number(mm) <= 12) detectedDate = `${yyyy}-${mm}-${dd}`;
  }
  const moneyMatches = [...text.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2})/g)].map(m => m[1]);
  const values = moneyMatches
    .map(v => Number(v.replace(/\./g, "").replace(",", ".")))
    .filter(v => !isNaN(v) && v > 0);
  const detectedTotal = values.length > 0 ? Math.max(...values) : null;
  return { detectedDate, detectedTotal };
}

let quaggaLoadPromise = null;
function loadQuaggaScript() {
  if (window.Quagga) return Promise.resolve();
  if (quaggaLoadPromise) return quaggaLoadPromise;
  quaggaLoadPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js";
    script.onload = () => resolve();
    script.onerror = () => { quaggaLoadPromise = null; reject(new Error("Não foi possível carregar o leitor de código de barras. Verifique sua conexão.")); };
    document.head.appendChild(script);
  });
  return quaggaLoadPromise;
}

function startQuaggaScanner() {
  const target = document.getElementById("barcode-scanner-viewport");
  if (!target || !window.Quagga) return;
  window.Quagga.init({
    inputStream: { type: "LiveStream", target, constraints: { facingMode: "environment" } },
    decoder: { readers: ["ean_reader", "ean_8_reader", "code_128_reader", "upc_reader"] },
    locate: true,
  }, (err) => {
    if (err) {
      console.error(err);
      state.barcodeScannerError = "Não foi possível acessar a câmera. Verifique se a permissão foi concedida ao navegador.";
      render();
      return;
    }
    window.Quagga.start();
  });
  window.Quagga.onDetected(onBarcodeDetected);
}

async function onBarcodeDetected(result) {
  const code = result?.codeResult?.code;
  if (!code) return;
  const product = PRODUCTS.find(p => p.barcode === code);
  const context = state.barcodeScannerContext;
  stopQuaggaScanner();
  if (!product) {
    showToast(`Código ${code} não encontrado no catálogo.`);
    return;
  }
  if (context === "pdv") {
    await handleAction(`add-to-cart:${product.id}`); // esse fluxo já mostra seu próprio aviso
  } else if (context === "comanda") {
    await handleAction(`add-item-to-comanda:${product.id}`);
    showToast(`${product.name} adicionado à comanda`); // esse fluxo não avisa sozinho
  } else if (context === "inventory") {
    state.inventoryCounts[product.id] = (state.inventoryCounts[product.id] || 0) + 1;
    renderInventoryCountOnly();
    showToast(`${product.name}: ${state.inventoryCounts[product.id]} contado(s)`);
  }
}

function stopQuaggaScanner() {
  try {
    if (window.Quagga) { window.Quagga.offDetected(onBarcodeDetected); window.Quagga.stop(); }
  } catch (e) { /* câmera já parada, sem problema */ }
  state.barcodeScannerOpen = false;
  state.barcodeScannerContext = null;
  render();
}

// Registra uma ação sensível no histórico de auditoria. Nunca deve travar
// nem quebrar a ação principal — se o log falhar, só avisa no console.
function logAudit(action, description) {
  fb.logAction({ action, description, userUid: state.currentUser.uid, userName: firstName(state.currentUser) })
    .catch(e => console.error("Falha ao registrar auditoria:", e));
}

// Contas a pagar/receber vivem em mais de uma lista em memória (a paginada
// da tela de Financeiro, e a mais ampla usada em alertas/DRE/previsão do
// Dashboard). Sem isso, marcar como pago só atualizava uma das duas.
function syncPayableState(id, updates) {
  [state.financePayables, state.cashFlowPayables].forEach(list => {
    const item = (list || []).find(p => p.id === id);
    if (item) Object.assign(item, updates);
  });
}
function syncReceivableState(id, updates) {
  [state.financeReceivables, state.cashFlowReceivables].forEach(list => {
    const item = (list || []).find(r => r.id === id);
    if (item) Object.assign(item, updates);
  });
}

function showToast(msg) {
  state.toast = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 1800);
}

async function handleAction(action) {
  const [type, value] = action.split(":");
  switch (type) {
    case "nav": {
      document.activeElement?.blur();
      const allowed = (NAV_ACCESS[value] || []).includes(state.currentUser?.role);
      state.page = allowed ? value : "dashboard";
      state.mobileNavOpen = false;
      if (value === "caixa" && state.openCashRegister && state.cashMovements.length === 0) {
        render();
        try { state.cashMovements = await fb.listCashMovements(state.openCashRegister.id); }
        catch (e) { console.error(e); }
      }
      if (value === "financeiro" && !state.financeLoaded) {
        render();
        try {
          const [payables, receivables, recurring, accounts, categories, movements] = await Promise.all([
            fb.listAccountsPayablePage({ max: 20 }),
            fb.listAccountsReceivablePage({ max: 20 }),
            fb.listRecurringBills(),
            fb.listFinancialAccounts(),
            fb.listFinanceCategories(),
            fb.listAccountMovements(300),
          ]);
          state.financePayables = payables.items;
          state.payablesCursor = payables.cursor; state.payablesHasMore = payables.hasMore;
          state.financeReceivables = receivables.items;
          state.receivablesCursor = receivables.cursor; state.receivablesHasMore = receivables.hasMore;
          state.recurringBills = recurring;
          state.financialAccounts = accounts;
          state.financeCategories = categories;
          state.accountMovements = movements;
          state.financeLoaded = true;
          await generateDueRecurringBills();
        } catch (e) { console.error(e); showToast("Não foi possível carregar o Financeiro."); }
      }
      if (value === "clientes" && !state.customersLoaded) {
        render();
        try {
          const page = await fb.listCustomersPage({ max: 30 });
          state.customers = page.items;
          state.customersCursor = page.cursor; state.customersHasMore = page.hasMore;
          state.customersLoaded = true;
        } catch (e) { console.error(e); showToast("Não foi possível carregar os clientes."); }
      }
      if (value === "fornecedores" && !state.suppliersLoaded) {
        render();
        try { state.suppliers = await fb.listSuppliers(200); state.suppliersLoaded = true; }
        catch (e) { console.error(e); showToast("Não foi possível carregar os fornecedores."); }
      }
      if (value === "compras" && (!state.purchasesLoaded || !state.suppliersLoaded)) {
        render();
        try {
          const [purchasesPage, suppliers] = await Promise.all([
            fb.listPurchasesPage({ max: 20 }),
            state.suppliersLoaded ? Promise.resolve(state.suppliers) : fb.listSuppliers(200),
          ]);
          state.purchases = purchasesPage.items;
          state.purchasesCursor = purchasesPage.cursor; state.purchasesHasMore = purchasesPage.hasMore;
          state.suppliers = suppliers;
          state.purchasesLoaded = true;
          state.suppliersLoaded = true;
        } catch (e) { console.error(e); showToast("Não foi possível carregar as compras."); }
      }
      if (value === "funcionarios" && !state.employeesLoaded) {
        render();
        try {
          const page = await fb.listUsersPage({ max: 30 });
          state.employees = page.items;
          state.employeesCursor = page.cursor; state.employeesHasMore = page.hasMore;
          state.employeesLoaded = true;
        } catch (e) { console.error(e); showToast("Não foi possível carregar a equipe."); }
      }
      if (value === "relatorios" && !state.reportsLoaded) {
        await loadReportPeriod(state.reportPeriod);
      }
      if (value === "comandas" && !state.comandasLoaded) {
        render();
        try { state.comandas = await fb.listOpenComandas(); state.comandasLoaded = true; }
        catch (e) { console.error(e); showToast("Não foi possível carregar as comandas."); }
      }
      if (value === "entregas" && !state.deliveriesLoaded) {
        render();
        try {
          const [deliveries, drivers] = await Promise.all([fb.listDeliveries(200), fb.listDeliveryDrivers(100)]);
          state.deliveries = deliveries;
          state.deliveryDrivers = drivers;
          state.deliveriesLoaded = true;
        } catch (e) { console.error(e); showToast("Não foi possível carregar as entregas."); }
      }
      if (value === "configuracoes" && !state.settingsLoaded) {
        render();
        try { state.storeSettings = await fb.getSettings(); state.settingsLoaded = true; }
        catch (e) { console.error(e); showToast("Não foi possível carregar as configurações."); }
        if (isManager(state.currentUser) && !state.auditLogLoaded) {
          try { state.auditLog = await fb.listAuditLog(100); state.auditLogLoaded = true; }
          catch (e) { console.error(e); }
        }
      }
      break;
    }
    case "open-mobile-nav": document.activeElement?.blur(); state.mobileNavOpen = true; break;
    case "close-mobile-nav": state.mobileNavOpen = false; break;
    case "toggle-mobile-nav-width": state.mobileNavExpanded = !state.mobileNavExpanded; break;
    case "toggle-search": state.searchOpen = !state.searchOpen; break;
    case "toggle-notif": state.notifOpen = !state.notifOpen; state.profileOpen = false; break;
    case "toggle-profile": state.profileOpen = !state.profileOpen; state.notifOpen = false; break;
    case "logout":
      state.profileOpen = false;
      try { await logout(); } catch (e) { console.error(e); }
      // watchAuth detecta o logout e re-renderiza a tela de login sozinho
      return;
    case "retry-load":
      loadInitialData();
      return;
    case "set-category": state.category = value; break;
    case "set-mobile-tab": state.mobileTab = value; break;

    case "open-reset": state.resetMode = true; state.loginError = null; state.resetSent = false; break;
    case "close-reset": state.resetMode = false; state.loginError = null; break;

    case "open-new-sale": {
      state.newSaleOpen = true;
      state.cart = [];
      state.query = "";
      state.category = "Todas";
      state.mobileTab = "produtos";
      state.selectedMethod = null;
      state.splitPaymentMode = false;
      state.paymentSplits = [];
      state.selectedCustomerId = null;
      if (!state.pdvCustomersLoaded) {
        render();
        try { state.pdvCustomers = await fb.listCustomers(300); state.pdvCustomersLoaded = true; }
        catch (e) { console.error(e); }
      }
      break;
    }
    case "close-new-sale": {
      if (state.cart.length > 0 && !confirm("Descartar esta venda em andamento?")) return;
      state.newSaleOpen = false;
      state.cart = [];
      state.selectedMethod = null;
      state.splitPaymentMode = false;
      state.paymentSplits = [];
      state.selectedCustomerId = null;
      state.customerPickerOpen = false;
      break;
    }

    case "add-to-cart": {
      const product = PRODUCTS.find(p => p.id === value);
      if (!product || product.stock === 0) return;
      const existing = state.cart.find(i => i.productId === value);
      if (existing) {
        if (existing.qty < product.stock) { existing.qty += 1; showToast(`${product.name} +1`); }
      } else {
        state.cart.push({ productId: value, qty: 1, discount: 0 });
        showToast(`${product.name} adicionado`);
      }
      break;
    }
    case "qty-inc": case "qty-dec": {
      const product = PRODUCTS.find(p => p.id === value);
      const item = state.cart.find(i => i.productId === value);
      if (item) item.qty = type === "qty-inc" ? Math.min(product.stock, item.qty + 1) : Math.max(1, item.qty - 1);
      break;
    }
    case "remove-cart":
      state.cart = state.cart.filter(i => i.productId !== value);
      break;
    case "select-payment": state.selectedMethod = value; break;
    case "toggle-split-payment": {
      state.splitPaymentMode = !state.splitPaymentMode;
      if (state.splitPaymentMode) {
        state.paymentSplits = [{ method: "pix", amount: "" }];
        state.selectedMethod = null;
      } else {
        state.paymentSplits = [];
      }
      break;
    }
    case "add-split":
      state.paymentSplits.push({ method: "dinheiro", amount: "" });
      break;
    case "remove-split":
      state.paymentSplits.splice(Number(value), 1);
      break;

    case "open-customer-picker":
      state.customerPickerOpen = true;
      state.customerPickerQuery = "";
      break;
    case "close-customer-picker":
      state.customerPickerOpen = false;
      break;
    case "select-customer":
      state.selectedCustomerId = value || null;
      state.customerPickerOpen = false;
      break;

    // ---- WhatsApp ----
    case "whatsapp-customer": {
      const c = state.customers.find(x => x.id === value) || state.pdvCustomers.find(x => x.id === value);
      if (!c) return;
      openWhatsApp(c.phone, `Olá, ${c.name}! Aqui é da Vinha Real. `);
      return;
    }
    case "open-promo-modal": {
      state.promoModalOpen = true; state.promoQuery = "";
      if (!state.pdvCustomersLoaded) {
        render();
        try { state.pdvCustomers = await fb.listCustomers(300); state.pdvCustomersLoaded = true; }
        catch (e) { console.error(e); }
      }
      break;
    }
    case "close-promo-modal":
      state.promoModalOpen = false;
      break;
    case "send-promo": {
      const c = state.pdvCustomers.find(x => x.id === value);
      const message = document.getElementById("promo-message")?.value.trim();
      if (!c) return;
      if (!message) { showToast("Escreva a mensagem antes de enviar."); return; }
      state.promoMessage = message;
      openWhatsApp(c.phone, message);
      return;
    }
    case "open-supplier-picker": {
      state.supplierPickerProductId = value;
      state.supplierPickerOpen = true;
      if (!state.suppliersLoaded) {
        render();
        try { state.suppliers = await fb.listSuppliers(200); state.suppliersLoaded = true; }
        catch (e) { console.error(e); }
      }
      break;
    }
    case "close-supplier-picker":
      state.supplierPickerOpen = false;
      state.supplierPickerProductId = null;
      break;
    case "whatsapp-supplier": {
      const s = state.suppliers.find(x => x.id === value);
      const p = PRODUCTS.find(x => x.id === state.supplierPickerProductId);
      if (!s || !p) return;
      const message = `Olá, ${s.name}! Preciso repor estoque de "${p.name}" (estoque atual: ${p.stock} un.). Poderia me passar disponibilidade e preço?`;
      openWhatsApp(s.phone, message);
      state.supplierPickerOpen = false;
      state.supplierPickerProductId = null;
      break;
    }
    case "whatsapp-comanda": {
      const c = state.comandas.find(x => x.id === value);
      if (!c) return;
      const customer = c.customerId ? (state.customers.find(x => x.id === c.customerId) || state.pdvCustomers.find(x => x.id === c.customerId)) : null;
      if (!customer?.phone) return;
      const message = `Olá, ${customer.name}! Você tem uma comanda em aberto na Vinha Real no valor de ${currency(c.subtotal || 0)}. Poderia vir fechar quando puder? 😊`;
      openWhatsApp(customer.phone, message);
      return;
    }

    // ---- Entregas ----
    case "set-deliveries-tab":
      state.deliveriesTab = value;
      break;
    case "open-new-delivery":
      state.newDeliveryModalOpen = true; state.formError = null;
      break;
    case "close-new-delivery":
      state.newDeliveryModalOpen = false; state.formError = null;
      break;
    case "advance-delivery": {
      const d = state.deliveries.find(x => x.id === value);
      const next = d && DELIVERY_NEXT_STATUS[d.status];
      if (!next) return;
      try {
        await fb.updateDeliveryStatus(value, next);
        state.deliveries = await fb.listDeliveries(200);
        showToast(next === "a_caminho" ? "Pedido a caminho" : "Pedido entregue");
      } catch (e) {
        console.error(e);
        showToast("Não foi possível atualizar o status.");
      }
      return;
    }
    case "cancel-delivery": {
      if (!confirm("Cancelar este pedido de entrega?")) return;
      try {
        await fb.updateDeliveryStatus(value, "cancelada");
        state.deliveries = await fb.listDeliveries(200);
        showToast("Pedido cancelado");
      } catch (e) {
        console.error(e);
        showToast("Não foi possível cancelar.");
      }
      return;
    }
    case "open-driver-modal":
      state.driverModalOpen = true; state.editingDriverId = null; state.formError = null;
      break;
    case "edit-driver":
      state.driverModalOpen = true; state.editingDriverId = value; state.formError = null;
      break;
    case "close-driver-modal":
      state.driverModalOpen = false; state.editingDriverId = null; state.formError = null;
      break;
    case "open-settle-driver":
      state.settleDriverId = value;
      break;
    case "close-settle-driver":
      state.settleDriverId = null;
      break;
    case "confirm-settle-driver": {
      if (!isManager(state.currentUser)) return;
      const dr = state.deliveryDrivers.find(d => d.id === state.settleDriverId);
      if (!dr) return;
      const toPay = state.deliveries.filter(d => d.driverId === dr.id && d.status === "entregue" && !d.paid);
      if (toPay.length === 0) return;
      const total = toPay.reduce((s, d) => s + (d.feeAmount || 0), 0);
      if (!confirm(`Confirmar pagamento de ${currency(total)} pra ${dr.name} (${toPay.length} entrega${toPay.length === 1 ? "" : "s"})? Não dá pra desfazer.`)) return;
      state.formLoading = true; render();
      try {
        await fb.settleDriverDeliveries(toPay.map(d => d.id));
        state.deliveries = await fb.listDeliveries(200);
        state.settleDriverId = null;
        logAudit("pagou_entregador", `Confirmou pagamento de ${currency(total)} pra ${dr.name} (${toPay.length} entrega${toPay.length === 1 ? "" : "s"})`);
        showToast(`Pagamento confirmado: ${toPay.length} entrega${toPay.length === 1 ? "" : "s"}`);
      } catch (e) {
        console.error(e);
        showToast("Não foi possível confirmar o pagamento.");
      } finally {
        state.formLoading = false;
      }
      break;
    }

    // ---- Comandas ----
    case "open-new-comanda-modal": {
      state.openComandaModal = true; state.formError = null; state.selectedCustomerId = null;
      if (!state.pdvCustomersLoaded) {
        render();
        try { state.pdvCustomers = await fb.listCustomers(300); state.pdvCustomersLoaded = true; }
        catch (e) { console.error(e); }
      }
      break;
    }
    case "close-new-comanda-modal":
      state.openComandaModal = false; state.formError = null; state.selectedCustomerId = null;
      break;
    case "open-comanda":
      state.activeComandaId = value;
      state.comandaQuery = ""; state.comandaCategory = "Todas"; state.comandaAttendMode = true;
      break;
    case "close-comanda-detail":
      state.activeComandaId = null;
      break;
    case "toggle-comanda-attend-mode":
      state.comandaAttendMode = !state.comandaAttendMode;
      break;
    case "cancel-comanda": {
      const comandaBeingCancelled = state.comandas.find(c => c.id === value);
      if (!confirm("Cancelar esta comanda? Os itens já lançados voltam pro estoque.")) return;
      try {
        await fb.cancelComanda(value);
        state.comandas = await fb.listOpenComandas();
        if (state.activeComandaId === value) state.activeComandaId = null;
        logAudit("cancelou_comanda", `Cancelou a comanda de ${comandaBeingCancelled?.customerName || "cliente"}${comandaBeingCancelled ? ` (${currency(comandaBeingCancelled.subtotal || 0)})` : ""}`);
        showToast("Comanda cancelada");
      } catch (e) {
        console.error(e);
        showToast("Não foi possível cancelar a comanda.");
      }
      break;
    }
    case "set-comanda-category":
      state.comandaCategory = value;
      renderComandaDetailOnly();
      return;
    case "add-item-to-comanda": {
      const product = PRODUCTS.find(p => p.id === value);
      if (!product || product.stock <= 0) return;
      try {
        await fb.addItemToComanda({
          comandaId: state.activeComandaId, productId: product.id, productName: product.name,
          price: product.price, qty: 1, userUid: state.currentUser.uid,
        });
        await Promise.all([refreshProducts(), (async () => { state.comandas = await fb.listOpenComandas(); })()]);
        renderComandaDetailOnly();
      } catch (e) {
        console.error(e);
        showToast(e.message || "Não foi possível adicionar o item.");
      }
      return;
    }
    case "remove-item-from-comanda": {
      try {
        await fb.removeItemFromComanda({ comandaId: state.activeComandaId, productId: value, qty: 1, userUid: state.currentUser.uid });
        await Promise.all([refreshProducts(), (async () => { state.comandas = await fb.listOpenComandas(); })()]);
        renderComandaDetailOnly();
      } catch (e) {
        console.error(e);
        showToast(e.message || "Não foi possível remover o item.");
      }
      return;
    }
    case "open-comanda-close":
      state.comandaCloseOpen = true; state.comandaSelectedMethod = null; state.comandaDiscount = 0; state.comandaServiceCharge = false; state.formError = null;
      renderComandaDetailOnly();
      return;
    case "close-comanda-close":
      state.comandaCloseOpen = false;
      renderComandaDetailOnly();
      return;
    case "select-comanda-payment":
      state.comandaSelectedMethod = value;
      renderComandaDetailOnly();
      return;
    case "confirm-close-comanda": {
      if (!state.comandaSelectedMethod) return;
      const comanda = state.comandas.find(c => c.id === state.activeComandaId);
      if (!comanda) return;
      const { serviceCharge } = computeComandaCloseTotals(comanda);
      state.formLoading = true; state.formError = null;
      renderComandaDetailOnly();
      try {
        await fb.closeComanda({
          comandaId: comanda.id,
          payment: PAYMENT_LABELS[state.comandaSelectedMethod],
          discount: Number(state.comandaDiscount) || 0,
          serviceCharge,
          employeeUid: state.currentUser.uid,
          employeeName: firstName(state.currentUser),
          cashRegisterId: state.openCashRegister?.id || null,
        });
        state.comandas = await fb.listOpenComandas();
        state.comandaCloseOpen = false;
        state.activeComandaId = null;
        await Promise.all([
          refreshSales(),
          state.openCashRegister ? fb.listCashMovements(state.openCashRegister.id).then(m => { state.cashMovements = m; }) : Promise.resolve(),
        ]);
        showToast("Comanda fechada e cobrada");
      } catch (e) {
        console.error(e);
        state.formError = e.message || "Não foi possível fechar a comanda.";
      } finally {
        state.formLoading = false;
      }
      break;
    }

    case "finalize-sale": {
      // Trava contra duplo clique (Etapa 4, item 7)
      if (state.processingSale) return;
      const lines = getCartLines();
      if (lines.length === 0) return;

      const subtotal = lines.reduce((s, l) => s + l.lineSubtotal, 0);
      const totalDiscount = lines.reduce((s, l) => s + l.discount, 0);
      const total = Math.max(0, subtotal - totalDiscount);

      let paymentPayload;
      if (state.splitPaymentMode) {
        const splits = state.paymentSplits
          .map(s => ({ method: PAYMENT_LABELS[s.method], amount: Number(s.amount) || 0 }))
          .filter(s => s.amount > 0);
        const sum = Math.round(splits.reduce((s, x) => s + x.amount, 0) * 100) / 100;
        if (splits.length === 0 || Math.abs(sum - total) > 0.01) {
          showToast("A soma dos pagamentos precisa bater com o total.");
          return;
        }
        paymentPayload = { payment: "Múltiplo", paymentSplits: splits };
      } else {
        if (!state.selectedMethod) return;
        paymentPayload = { payment: PAYMENT_LABELS[state.selectedMethod] };
      }

      const selectedCustomer = state.selectedCustomerId ? state.pdvCustomers.find(c => c.id === state.selectedCustomerId) : null;

      state.processingSale = true;
      render();
      try {
        const saleId = await fb.finalizeSale({
          items: lines.map(l => ({ productId: l.productId, name: l.product.name, qty: l.qty, price: l.product.price, discount: l.discount })),
          ...paymentPayload,
          subtotal, discount: totalDiscount, total,
          employeeUid: state.currentUser.uid,
          employeeName: firstName(state.currentUser),
          clientId: selectedCustomer?.id || null,
          clientName: selectedCustomer?.name || "Cliente Balcão",
          cashRegisterId: state.openCashRegister?.id || null,
        });
        state.confirmedSale = {
          id: saleId, total,
          itemsCount: lines.reduce((s, l) => s + l.qty, 0),
          payment: paymentPayload.payment,
          clientName: selectedCustomer?.name || "Cliente Balcão",
          time: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
        };
        await Promise.all([
          refreshProducts(),
          refreshSales(),
          state.openCashRegister ? fb.listCashMovements(state.openCashRegister.id).then(m => { state.cashMovements = m; }) : Promise.resolve(),
        ]);
      } catch (e) {
        console.error(e);
        showToast(e.message || "Não foi possível concluir a venda.");
      } finally {
        state.processingSale = false;
      }
      break;
    }
    case "new-sale":
      state.cart = [];
      state.confirmedSale = null;
      state.mobileTab = "produtos";
      state.query = "";
      state.selectedMethod = null;
      state.splitPaymentMode = false;
      state.paymentSplits = [];
      break;
    case "finish-and-close":
      state.cart = [];
      state.confirmedSale = null;
      state.newSaleOpen = false;
      state.mobileTab = "produtos";
      state.query = "";
      state.selectedMethod = null;
      state.splitPaymentMode = false;
      state.paymentSplits = [];
      break;

    case "open-sale-detail": state.selectedSaleId = value; break;
    case "close-sale-detail": state.selectedSaleId = null; break;
    case "cancel-sale": {
      if (!isManager(state.currentUser)) { showToast("Só gerência/admin pode cancelar uma venda."); return; }
      if (!confirm(`Cancelar a venda ${value}? Essa ação não pode ser desfeita.`)) return;
      try {
        await fb.cancelSale(value);
        const sale = state.sales.find(s => s.id === value);
        if (sale) sale.status = "cancelada";
        logAudit("cancelou_venda", `Cancelou a venda ${value}${sale ? ` (${currency(sale.total)})` : ""}`);
        showToast("Venda cancelada");
      } catch (e) {
        showToast(e.message || "Não foi possível cancelar a venda.");
      }
      state.selectedSaleId = null;
      break;
    }
    case "print-receipt": {
      const sale = state.sales.find(s => s.id === value);
      if (!sale) { showToast("Venda não encontrada."); break; }
      await shareReceipt(sale);
      break;
    }
    case "whatsapp-order": {
      const sale = state.sales.find(s => s.id === value);
      if (!sale) return;
      const c = state.customers.find(x => x.id === sale.clientId) || state.pdvCustomers.find(x => x.id === sale.clientId);
      if (!c?.phone) return;
      openWhatsApp(c.phone, buildReceiptText(sale));
      return;
    }

    // ---- Produtos ----
    case "open-product-modal":
      state.productModalOpen = true; state.editingProductId = null; state.formError = null;
      if (!state.suppliersLoaded) {
        render();
        try { state.suppliers = await fb.listSuppliers(200); state.suppliersLoaded = true; }
        catch (e) { console.error(e); }
      }
      break;
    case "edit-product":
      state.productModalOpen = true; state.editingProductId = value; state.formError = null;
      if (!state.suppliersLoaded) {
        render();
        try { state.suppliers = await fb.listSuppliers(200); state.suppliersLoaded = true; }
        catch (e) { console.error(e); }
      }
      break;
    case "close-product-modal":
      state.productModalOpen = false; state.editingProductId = null; state.formError = null;
      break;

    // ---- Estoque ----
    case "open-stock-adjust":
      state.stockAdjustProductId = value; state.formError = null;
      break;
    case "close-stock-adjust":
      state.stockAdjustProductId = null; state.formError = null;
      break;
    case "open-stock-history": {
      state.stockHistoryProductId = value;
      state.stockHistoryMovements = [];
      state.stockHistoryLoading = true;
      render();
      try {
        state.stockHistoryMovements = await fb.listStockMovements({ productId: value, max: 30 });
      } catch (e) {
        console.error(e);
        showToast("Não foi possível carregar o histórico.");
      } finally {
        state.stockHistoryLoading = false;
      }
      break;
    }
    case "close-stock-history":
      state.stockHistoryProductId = null;
      state.stockHistoryMovements = [];
      break;
    case "set-stock-filter":
      state.stockFilter = value;
      renderEstoqueOnly();
      return;
    case "open-inventory-count":
      state.inventoryCountOpen = true;
      state.inventoryCounts = {};
      state.inventoryQuery = "";
      break;
    case "close-inventory-count": {
      const hasCounts = Object.keys(state.inventoryCounts).length > 0;
      if (hasCounts && !confirm("Sair sem finalizar? A contagem feita até agora será perdida.")) return;
      state.inventoryCountOpen = false;
      state.inventoryCounts = {};
      break;
    }
    case "finalize-inventory-count": {
      const diffs = Object.entries(state.inventoryCounts)
        .map(([id, counted]) => {
          const p = PRODUCTS.find(x => x.id === id);
          return p ? { id, name: p.name, counted, delta: counted - p.stock } : null;
        })
        .filter(d => d && d.delta !== 0);
      if (diffs.length === 0) return;
      state.inventorySubmitting = true;
      renderInventoryCountOnly();
      try {
        for (const d of diffs) {
          await fb.adjustStock({
            productId: d.id, productName: d.name, quantityDelta: d.delta,
            reason: "Contagem de inventário", userUid: state.currentUser.uid,
          });
        }
        await refreshProducts();
        state.inventoryCountOpen = false;
        state.inventoryCounts = {};
        showToast(`Inventário ajustado: ${diffs.length} produto${diffs.length === 1 ? "" : "s"}`);
      } catch (e) {
        console.error(e);
        showToast("Não foi possível concluir todos os ajustes. Confira o estoque antes de tentar de novo.");
      } finally {
        state.inventorySubmitting = false;
      }
      break;
    }

    // ---- Leitor de código de barras ----
    case "open-barcode-scanner": {
      state.barcodeScannerContext = value; // "pdv" | "comanda"
      state.barcodeScannerOpen = true;
      state.barcodeScannerError = null;
      render(); // desenha o overlay (com o viewport vazio) antes de ligar a câmera
      try {
        await loadQuaggaScript();
        startQuaggaScanner();
      } catch (e) {
        state.barcodeScannerError = e.message || "Não foi possível carregar o leitor.";
        render();
      }
      return;
    }
    case "close-barcode-scanner":
      stopQuaggaScanner();
      return;

    // ---- Caixa ----
    case "open-cash-move":
      state.cashMoveType = value; state.formError = null;
      break;
    case "close-cash-move":
      state.cashMoveType = null; state.formError = null;
      break;
    case "open-close-cash":
      state.closeCashOpen = true; state.formError = null;
      break;
    case "close-close-cash":
      state.closeCashOpen = false; state.formError = null;
      break;

    // ---- Financeiro ----
    case "set-finance-tab":
      state.financeTab = value;
      break;
    case "open-finance-modal":
      state.financeModalOpen = true; state.formError = null;
      break;
    case "close-finance-modal":
      state.financeModalOpen = false; state.formError = null;
      break;
    case "open-recurring-modal":
      state.recurringModalOpen = true; state.editingRecurringId = null; state.formError = null;
      break;
    case "edit-recurring":
      state.recurringModalOpen = true; state.editingRecurringId = value; state.formError = null;
      break;
    case "close-recurring-modal":
      state.recurringModalOpen = false; state.editingRecurringId = null; state.formError = null;
      break;
    case "open-account-modal":
      state.accountModalOpen = true; state.editingAccountId = null; state.newAccountType = null; state.formError = null;
      break;
    case "edit-account":
      state.accountModalOpen = true; state.editingAccountId = value; state.newAccountType = null; state.formError = null;
      break;
    case "close-account-modal":
      state.accountModalOpen = false; state.editingAccountId = null; state.newAccountType = null; state.formError = null;
      break;
    case "set-new-account-type":
      state.newAccountType = value;
      break;
    case "open-category-modal":
      state.categoryModalOpen = true; state.editingCategoryId = null; state.formError = null;
      break;
    case "edit-category":
      state.categoryModalOpen = true; state.editingCategoryId = value; state.formError = null;
      break;
    case "close-category-modal":
      state.categoryModalOpen = false; state.editingCategoryId = null; state.formError = null;
      break;
    case "toggle-payable-paid": {
      const item = state.financePayables.find(p => p.id === value);
      if (!item) return;
      if (!item.paid && state.financialAccounts.filter(a => a.active !== false).length > 0) {
        state.confirmPaymentItem = { type: "payable", id: value, description: item.description, amount: item.amount, categoryId: item.categoryId, categoryName: item.categoryName };
        state.confirmPaymentAccountId = state.financialAccounts.find(a => a.active !== false)?.id || null;
        break;
      }
      const next = !item.paid;
      item.paid = next; // atualização otimista
      syncPayableState(value, { paid: next });
      render();
      try {
        await fb.setAccountPayablePaid(value, next);
        if (!next) {
          // Desmarcando um pagamento que tinha conta vinculada: estorna (lança
          // o contrário no extrato) — nunca apaga o movimento original.
          const movement = state.accountMovements.find(m => m.relatedType === "payable" && m.relatedId === value);
          if (movement) {
            await fb.registerAccountMovement({
              accountId: movement.accountId, accountName: movement.accountName, type: "entrada",
              amount: movement.amount, description: `Estorno: ${movement.description}`,
              categoryId: movement.categoryId, categoryName: movement.categoryName,
              relatedType: "payable", relatedId: value, userUid: state.currentUser.uid,
            });
            state.financialAccounts = await fb.listFinancialAccounts();
            state.accountMovements = await fb.listAccountMovements(300);
            logAudit("estornou_pagamento", `Estornou o pagamento de "${item.description}" (${currency(movement.amount)}), devolvendo pra ${movement.accountName}`);
          }
        }
        showToast(next ? "Marcada como paga" : "Marcada como pendente");
      }
      catch (e) { item.paid = !next; syncPayableState(value, { paid: !next }); showToast("Não foi possível atualizar."); }
      break;
    }
    case "toggle-receivable-received": {
      const item = state.financeReceivables.find(r => r.id === value);
      if (!item) return;
      if (!item.received && state.financialAccounts.filter(a => a.active !== false).length > 0) {
        state.confirmPaymentItem = { type: "receivable", id: value, description: item.description, amount: item.amount, categoryId: item.categoryId, categoryName: item.categoryName };
        state.confirmPaymentAccountId = state.financialAccounts.find(a => a.active !== false)?.id || null;
        break;
      }
      const next = !item.received;
      item.received = next; // atualização otimista
      syncReceivableState(value, { received: next });
      render();
      try {
        await fb.setAccountReceivableReceived(value, next);
        if (!next) {
          const movement = state.accountMovements.find(m => m.relatedType === "receivable" && m.relatedId === value);
          if (movement) {
            await fb.registerAccountMovement({
              accountId: movement.accountId, accountName: movement.accountName, type: "saida",
              amount: movement.amount, description: `Estorno: ${movement.description}`,
              categoryId: movement.categoryId, categoryName: movement.categoryName,
              relatedType: "receivable", relatedId: value, userUid: state.currentUser.uid,
            });
            state.financialAccounts = await fb.listFinancialAccounts();
            state.accountMovements = await fb.listAccountMovements(300);
            logAudit("estornou_recebimento", `Estornou o recebimento de "${item.description}" (${currency(movement.amount)}), retirando de ${movement.accountName}`);
          }
        }
        showToast(next ? "Marcada como recebida" : "Marcada como pendente");
      }
      catch (e) { item.received = !next; syncReceivableState(value, { received: !next }); showToast("Não foi possível atualizar."); }
      break;
    }
    case "set-cashflow-grouping":
      state.cashFlowGrouping = value;
      break;
    case "close-confirm-payment":
      state.confirmPaymentItem = null;
      break;
    case "set-confirm-payment-account":
      state.confirmPaymentAccountId = value;
      break;
    case "confirm-payment-with-account": {
      const p = state.confirmPaymentItem;
      if (!p) return;
      const account = state.financialAccounts.find(a => a.id === state.confirmPaymentAccountId);
      if (!account) { showToast("Selecione uma conta."); return; }
      state.formLoading = true; render();
      try {
        if (p.type === "payable") {
          await fb.setAccountPayablePaid(p.id, true);
          const item = state.financePayables.find(x => x.id === p.id);
          if (item) item.paid = true;
          syncPayableState(p.id, { paid: true });
        } else {
          await fb.setAccountReceivableReceived(p.id, true);
          const item = state.financeReceivables.find(x => x.id === p.id);
          if (item) item.received = true;
          syncReceivableState(p.id, { received: true });
        }
        await fb.registerAccountMovement({
          accountId: account.id, accountName: account.name,
          type: p.type === "payable" ? "saida" : "entrada",
          amount: p.amount, description: p.description,
          categoryId: p.categoryId, categoryName: p.categoryName,
          relatedType: p.type, relatedId: p.id, userUid: state.currentUser.uid,
        });
        state.financialAccounts = await fb.listFinancialAccounts();
        state.accountMovements = await fb.listAccountMovements(300);
        state.confirmPaymentItem = null;
        logAudit(
          p.type === "payable" ? "pagou_conta" : "recebeu_conta",
          `${p.type === "payable" ? "Pagou" : "Recebeu"} "${p.description}" (${currency(p.amount)}) ${p.type === "payable" ? "de" : "em"} ${account.name}`
        );
        showToast(p.type === "payable" ? "Pagamento registrado na conta" : "Recebimento registrado na conta");
      } catch (e) {
        console.error(e);
        showToast("Não foi possível confirmar.");
      } finally {
        state.formLoading = false; render();
      }
      break;
    }

    // ---- Clientes ----
    case "open-customer-modal":
      state.customerModalOpen = true; state.editingCustomerId = null; state.formError = null;
      break;
    case "edit-customer":
      state.customerModalOpen = true; state.editingCustomerId = value; state.formError = null;
      break;
    case "close-customer-modal":
      state.customerModalOpen = false; state.editingCustomerId = null; state.formError = null;
      break;
    case "open-customer-history": {
      state.customerHistoryId = value;
      render();
      try { state.customerHistory = await fb.customerPurchaseHistory(value, 20); }
      catch (e) { console.error(e); state.customerHistory = []; }
      break;
    }
    case "close-customer-history":
      state.customerHistoryId = null; state.customerHistory = [];
      break;

    // ---- Fornecedores ----
    case "open-supplier-modal":
      state.supplierModalOpen = true; state.editingSupplierId = null; state.formError = null;
      break;
    case "edit-supplier":
      state.supplierModalOpen = true; state.editingSupplierId = value; state.formError = null;
      break;
    case "close-supplier-modal":
      state.supplierModalOpen = false; state.editingSupplierId = null; state.formError = null;
      break;

    // ---- Compras ----
    case "open-new-purchase":
      state.newPurchaseOpen = true; state.purchaseCart = []; state.purchaseSupplierId = ""; state.query = ""; state.formError = null;
      break;
    case "close-new-purchase":
      if (state.purchaseCart.length > 0 && !confirm("Descartar esta compra em andamento?")) return;
      state.newPurchaseOpen = false; state.purchaseCart = []; state.query = "";
      break;
    case "open-invoice-scan":
      state.invoiceScanOpen = true; state.invoiceScanning = false; state.invoiceRawText = "";
      state.invoiceDetectedDate = null; state.invoiceDetectedTotal = null;
      break;
    case "close-invoice-scan":
      state.invoiceScanOpen = false;
      break;
    case "retry-invoice-scan":
      state.invoiceRawText = ""; state.invoiceDetectedDate = null; state.invoiceDetectedTotal = null;
      break;
    case "go-to-new-purchase":
      state.invoiceScanOpen = false;
      state.newPurchaseOpen = true; state.purchaseCart = []; state.purchaseSupplierId = ""; state.query = ""; state.formError = null;
      break;
    case "add-to-purchase": {
      const product = PRODUCTS.find(p => p.id === value);
      if (!product) return;
      const existing = state.purchaseCart.find(i => i.productId === value);
      if (existing) existing.qty += 1;
      else state.purchaseCart.push({ productId: value, qty: 1, cost: product.cost || "" });
      break;
    }
    case "purchase-qty-inc": case "purchase-qty-dec": {
      const item = state.purchaseCart.find(i => i.productId === value);
      if (item) item.qty = type === "purchase-qty-inc" ? item.qty + 1 : Math.max(1, item.qty - 1);
      break;
    }
    case "remove-from-purchase":
      state.purchaseCart = state.purchaseCart.filter(i => i.productId !== value);
      break;
    case "confirm-purchase": {
      if (state.purchaseCart.length === 0) return;
      const supplier = state.suppliers.find(s => s.id === state.purchaseSupplierId);
      const items = state.purchaseCart.map(i => {
        const product = PRODUCTS.find(p => p.id === i.productId);
        return { productId: i.productId, name: product.name, qty: i.qty, cost: Number(i.cost) || 0 };
      });
      const total = items.reduce((s, it) => s + it.cost * it.qty, 0);
      state.formLoading = true; state.formError = null; render();
      try {
        await fb.createPurchase({
          items, supplierId: state.purchaseSupplierId || null, supplierName: supplier?.name || "",
          total, userUid: state.currentUser.uid,
        });
        await Promise.all([
          refreshProducts(),
          (async () => {
            const page = await fb.listPurchasesPage({ max: 20 });
            state.purchases = page.items;
            state.purchasesCursor = page.cursor; state.purchasesHasMore = page.hasMore;
          })(),
        ]);
        state.newPurchaseOpen = false;
        state.purchaseCart = [];
        showToast("Compra registrada e estoque atualizado");
      } catch (e) {
        state.formError = e.message || "Não foi possível registrar a compra.";
      } finally {
        state.formLoading = false;
      }
      break;
    }

    // ---- Funcionários ----
    case "open-employee-modal":
      state.employeeModalOpen = true; state.editingEmployeeId = null; state.formError = null;
      break;
    case "edit-employee":
      state.employeeModalOpen = true; state.editingEmployeeId = value; state.formError = null;
      break;
    case "close-employee-modal":
      state.employeeModalOpen = false; state.editingEmployeeId = null; state.formError = null;
      break;

    // ---- Relatórios ----
    case "set-report-period": {
      const days = Number(value);
      if (days === state.reportPeriod && state.reportsLoaded) return;
      state.reportCustomOpen = false;
      await loadReportPeriod(days);
      return; // loadReportPeriod já renderiza
    }
    case "toggle-report-custom":
      state.reportCustomOpen = !state.reportCustomOpen;
      break;
    case "apply-report-custom": {
      const start = document.getElementById("report-custom-start")?.value;
      const end = document.getElementById("report-custom-end")?.value;
      await loadReportCustomRange(start, end);
      return; // loadReportCustomRange já renderiza
    }
    case "set-rank-mode":
      state.rankMode = value;
      break;
    case "export-pro-report": {
      const [key, format] = value.split("_");
      const rt = PRO_REPORT_TYPES.find(r => r.key === key);
      if (!rt || state.proReportLoading) return;
      state.proReportLoading = value;
      render();
      try {
        const data = await buildProReportData(key);
        if (!data || data.rows.length === 0) { showToast("Nenhum dado encontrado pra esse relatório."); return; }
        const dateSlug = new Date().toISOString().slice(0, 10);
        const filename = `vinha-real-${key}-${dateSlug}`;
        if (format === "pdf") {
          await exportReportPDF(data.title, `Gerado em ${new Date().toLocaleDateString("pt-BR")}`, data.headers, data.rows, filename);
        } else {
          await exportReportExcel(data.title, data.headers, data.rows, filename);
        }
      } catch (e) {
        console.error(e);
        showToast("Não foi possível gerar o relatório.");
      } finally {
        state.proReportLoading = null;
        render();
      }
      return;
    }
    case "export-report-csv": {
      const periodLabel = state.reportPeriod === "custom"
        ? `${state.reportCustomStart}_a_${state.reportCustomEnd}`
        : REPORT_PERIODS.find(p => p.days === state.reportPeriod)?.label || "periodo";
      const slug = periodLabel.toLowerCase().replace(/\s+/g, "-").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      exportReportCSV(state.reportSales, slug);
      break;
    }

    // ---- Configurações ----
    case "request-password-reset": {
      if (!confirm(`Enviar e-mail de redefinição de senha para ${state.currentUser.email}?`)) return;
      try {
        await resetPassword(state.currentUser.email);
        showToast("E-mail de redefinição enviado");
      } catch (e) {
        showToast(e.message || "Não foi possível enviar o e-mail.");
      }
      break;
    }

    // ---- Paginação ("Carregar mais") ----
    case "load-more": {
      const key = value; // customers | purchases | payables | receivables | employees
      if (state.loadingMoreKey) return;
      state.loadingMoreKey = key;
      render();
      try {
        if (key === "customers") {
          const page = await fb.listCustomersPage({ max: 30, cursor: state.customersCursor });
          state.customers = state.customers.concat(page.items);
          state.customersCursor = page.cursor; state.customersHasMore = page.hasMore;
        } else if (key === "purchases") {
          const page = await fb.listPurchasesPage({ max: 20, cursor: state.purchasesCursor });
          state.purchases = state.purchases.concat(page.items);
          state.purchasesCursor = page.cursor; state.purchasesHasMore = page.hasMore;
        } else if (key === "payables") {
          const page = await fb.listAccountsPayablePage({ max: 20, cursor: state.payablesCursor });
          state.financePayables = state.financePayables.concat(page.items);
          state.payablesCursor = page.cursor; state.payablesHasMore = page.hasMore;
        } else if (key === "receivables") {
          const page = await fb.listAccountsReceivablePage({ max: 20, cursor: state.receivablesCursor });
          state.financeReceivables = state.financeReceivables.concat(page.items);
          state.receivablesCursor = page.cursor; state.receivablesHasMore = page.hasMore;
        } else if (key === "employees") {
          const page = await fb.listUsersPage({ max: 30, cursor: state.employeesCursor });
          state.employees = state.employees.concat(page.items);
          state.employeesCursor = page.cursor; state.employeesHasMore = page.hasMore;
        }
      } catch (e) {
        console.error(e);
        showToast("Não foi possível carregar mais itens.");
      } finally {
        state.loadingMoreKey = null;
      }
      break;
    }

    case "toggle-install-guide":
      state.showInstallGuide = !state.showInstallGuide;
      break;
    case "install-pwa": {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      if (choice.outcome === "accepted") showToast("Aplicativo instalado");
      deferredInstallPrompt = null;
      state.installAvailable = false;
      break;
    }
    case "enable-notifications": {
      if (!("Notification" in window)) { showToast("Seu navegador não suporta notificações."); return; }
      if (Notification.permission === "granted") {
        state.notificationsEnabled = true;
        localStorage.setItem("vinhaReal_notifications", "on");
        showToast("Notificações já estavam ativadas");
        break;
      }
      const permission = await Notification.requestPermission();
      if (permission === "granted") {
        state.notificationsEnabled = true;
        localStorage.setItem("vinhaReal_notifications", "on");
        notifyLocal("Vinha Real", "Notificações ativadas! Você vai ver avisos como estoque baixo aqui.");
        showToast("Notificações ativadas");
      } else {
        showToast("Permissão de notificação negada pelo navegador.");
      }
      break;
    }
    case "export-full-backup": {
      if (state.backupExporting) return;
      state.backupExporting = true; render();
      try {
        const [products, sales, customers, suppliers, purchases, payables, receivables, employeesPage, comandas, deliveries, drivers, recurring] = await Promise.all([
          fb.listProducts({ onlyActive: false, max: 1000 }).catch(() => []),
          fb.listSalesRange(365, 5000).catch(() => []),
          fb.listCustomers(1000).catch(() => []),
          fb.listSuppliers(500).catch(() => []),
          fb.listPurchases(1000).catch(() => []),
          fb.listAccountsPayable(1000).catch(() => []),
          fb.listAccountsReceivable(1000).catch(() => []),
          fb.listUsersPage({ max: 200 }).catch(() => ({ items: [] })),
          fb.listOpenComandas().catch(() => []),
          fb.listDeliveries(1000).catch(() => []),
          fb.listDeliveryDrivers(200).catch(() => []),
          fb.listRecurringBills().catch(() => []),
        ]);
        const backup = {
          geradoEm: new Date().toISOString(), geradoPor: firstName(state.currentUser),
          produtos: products, vendas: sales, clientes: customers, fornecedores: suppliers,
          compras: purchases, contasAPagar: payables, contasAReceber: receivables,
          equipe: employeesPage.items, comandasAbertas: comandas, entregas: deliveries,
          entregadores: drivers, contasRecorrentes: recurring,
        };
        const json = JSON.stringify(backup, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `vinha-real-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        logAudit("exportou_backup", "Exportou um backup completo dos dados");
        showToast("Backup baixado");
      } catch (e) {
        console.error(e);
        showToast("Não foi possível gerar o backup.");
      } finally {
        state.backupExporting = false; render();
      }
      break;
    }
    case "open-example-data-viewer": {
      if (state.exampleDataLoading) return;
      state.exampleDataLoading = true; render();
      try { state.exampleDataSummary = await fb.listExampleData(); state.exampleDataOpen = true; }
      catch (e) { console.error(e); showToast("Não foi possível buscar os dados de exemplo."); }
      finally { state.exampleDataLoading = false; render(); }
      return;
    }
    case "close-example-data-viewer":
      state.exampleDataOpen = false;
      break;
    case "seed-example-data": {
      if (!isAdmin(state.currentUser)) return;
      if (state.seedingData) return;
      if (!confirm("Isso vai criar produtos, vendas, cliente, fornecedor e contas de exemplo no seu banco de dados real. Pode ser apagado depois manualmente. Continuar?")) return;
      state.seedingData = true; render();
      try {
        await fb.seedExampleData(state.currentUser.uid, firstName(state.currentUser));
        await loadInitialData(); // recarrega tudo (produtos, vendas, contas a pagar)
        showToast("Dados de exemplo criados");
      } catch (e) {
        console.error(e);
        showToast(e.message || "Não foi possível criar os dados de exemplo.");
      } finally {
        state.seedingData = false;
      }
      break;
    }
  }
  render();
}

document.addEventListener("click", (e) => {
  if (e.target.closest(".z-20")) return;
  let changed = false;
  if (state.notifOpen && !e.target.closest('[data-action="toggle-notif"]')) { state.notifOpen = false; changed = true; }
  if (state.profileOpen && !e.target.closest('[data-action="toggle-profile"]')) { state.profileOpen = false; changed = true; }
  if (changed) render();
});

/* =========================================================================
   BOOTSTRAP — observa a sessão do Firebase Auth
   ========================================================================= */
function resetLazyPageCaches() {
  state.customers = []; state.customersLoaded = false; state.customersCursor = null; state.customersHasMore = true;
  state.pdvCustomers = []; state.pdvCustomersLoaded = false; state.selectedCustomerId = null;
  state.suppliers = []; state.suppliersLoaded = false;
  state.purchases = []; state.purchasesLoaded = false; state.purchasesCursor = null; state.purchasesHasMore = true;
  state.financePayables = []; state.financeReceivables = []; state.financeLoaded = false;
  state.financialAccounts = []; state.financeCategories = [];
  state.accountMovements = [];
  state.payablesCursor = null; state.payablesHasMore = true; state.receivablesCursor = null; state.receivablesHasMore = true;
  state.employees = []; state.employeesLoaded = false; state.employeesCursor = null; state.employeesHasMore = true;
  state.reportSales = []; state.reportsLoaded = false; state.reportPeriod = 7;
  state.storeSettings = {}; state.settingsLoaded = false;
  state.auditLog = []; state.auditLogLoaded = false;
  state.notifiedLowStockThisSession = false;
  state.autoSeeded = false;
  state.comandas = []; state.comandasLoaded = false; state.activeComandaId = null;
  state.deliveries = []; state.deliveryDrivers = []; state.deliveriesLoaded = false; state.settleDriverId = null;
  state.loadingMoreKey = null;
}

watchAuth((user) => {
  state.authChecked = true;
  state.currentUser = user;
  state.loginLoading = false;
  state.loginError = null;
  state.resetMode = false;
  resetLazyPageCaches(); // nunca reaproveitar dado carregado por outra sessão

  if (user) {
    // Se a página atual não é permitida para este papel, volta ao dashboard
    if (!(NAV_ACCESS[state.page] || []).includes(user.role)) state.page = "dashboard";
    loadInitialData(); // dispara o carregamento e já chama render() internamente
  } else {
    // Deslogado: limpa dados sensíveis da memória
    PRODUCTS = [];
    state.sales = [];
    state.openCashRegister = null;
    state.cashMovements = [];
    state.page = "dashboard";
    render();
  }
});


</script>
