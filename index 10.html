<script>
// ============================================================================
// app.js — Vinha Real (Etapa 4: conectado ao Firebase, plano gratuito Spark)
//
// Usa o SDK "compat" do Firebase (API com namespace, ex: firebase.auth()),
// carregado como <script> clássica pelo index.html via cdnjs.cloudflare.com.
// Isso é proposital: <script> clássica não passa pela checagem de CORS que
// um `import` de módulo ES exige, então funciona em qualquer ambiente de
// pré-visualização e também quando publicado de verdade — sem depender de
// nenhum outro arquivo local.
// ============================================================================

// ----------------------------------------------------------------------------
// CONFIGURAÇÃO DO PROJETO — cole aqui as credenciais do SEU projeto Firebase
// (Console do Firebase > Configurações do projeto > Geral > "Seus apps").
// Essas chaves não são segredas — a proteção de verdade está nas Regras do
// Firestore (firestore.rules) e na Authentication, não em escondê-las.
// ----------------------------------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyBc4h92zJAfoKwAcmrCKrXpjCHUhr07Qzw",
  authDomain: "adega-gw.firebaseapp.com",
  projectId: "adega-gw",
  storageBucket: "adega-gw.firebasestorage.app", // não usado nesta etapa — ver README
  messagingSenderId: "522584066497",
  appId: "1:522584066497:web:eab338e7260063cf2d4740",
};

const firebaseApp = firebase.initializeApp(firebaseConfig);
const auth = firebaseApp.auth();
const db = firebaseApp.firestore();
try {
  db.enablePersistence({ synchronizeTabs: true }).catch((e) =>
    console.warn("Cache local do Firestore não disponível:", e.code)
  );
} catch (e) { /* navegador sem suporte — segue sem cache local, sem problema */ }

try {
  auth.setPersistence("local").catch((e) =>
    console.warn("Não foi possível configurar a persistência de sessão:", e)
  );
} catch (e) {
  console.warn("setPersistence indisponível neste navegador:", e);
}

/* =========================================================================
   AUTENTICAÇÃO
   ========================================================================= */
function login(email, password) {
  return auth.signInWithEmailAndPassword(email, password);
}
function logout() {
  return auth.signOut();
}
function resetPassword(email) {
  return auth.sendPasswordResetEmail(email);
}
async function getUserProfile(uid) {
  const snap = await db.collection("users").doc(uid).get();
  if (!snap.exists) return { role: "funcionario", name: null, active: false };
  return snap.data();
}
function watchAuth(callback) {
  return auth.onAuthStateChanged(async (user) => {
    if (!user) { callback(null); return; }
    try {
      const profile = await getUserProfile(user.uid);
      callback({ uid: user.uid, email: user.email, ...profile });
    } catch (e) {
      console.error("Erro ao carregar perfil do usuário:", e);
      callback({ uid: user.uid, email: user.email, role: "funcionario", name: null });
    }
  });
}
const ROLES = { ADMIN: "administrador", MANAGER: "gerente", STAFF: "funcionario" };
function isAdmin(user) { return user?.role === ROLES.ADMIN; }
function isManager(user) { return user?.role === ROLES.ADMIN || user?.role === ROLES.MANAGER; }

/* =========================================================================
   FIRESTORE — camada de serviço (API compat: encadeamento de métodos)
   ========================================================================= */
const fbcol = (name) => db.collection(name);
const fbList = (snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() }));
const serverTimestamp = () => firebase.firestore.FieldValue.serverTimestamp();
const tsFromDate = (date) => firebase.firestore.Timestamp.fromDate(date);

const fb = {
  // ---- Produtos ----
  async listProducts({ onlyActive = true, max = 300 } = {}) {
    if (onlyActive) {
      // Evita índice composto (active + name): filtra no Firestore, ordena no navegador.
      const list = fbList(await fbcol("products").where("active", "==", true).limit(max).get());
      return list.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    }
    return fbList(await fbcol("products").orderBy("name").limit(max).get());
  },
  async createProduct(data) {
    return fbcol("products").add({ ...data, stock: data.stock ?? 0, active: true, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
  },
  async updateProduct(id, data) {
    return fbcol("products").doc(id).update({ ...data, updatedAt: serverTimestamp() });
  },
  async setProductActive(id, active) {
    return fbcol("products").doc(id).update({ active, updatedAt: serverTimestamp() });
  },

  // ---- Categorias ----
  async listCategories(max = 50) {
    return fbList(await fbcol("categories").orderBy("name").limit(max).get());
  },

  // ---- Estoque ----
  async adjustStock({ productId, productName, quantityDelta, reason, userUid }) {
    return db.runTransaction(async (tx) => {
      const ref = fbcol("products").doc(productId);
      const snap = await tx.get(ref);
      if (!snap.exists) throw new Error("Produto não encontrado.");
      const newStock = (snap.data().stock ?? 0) + quantityDelta;
      if (newStock < 0) throw new Error("O estoque não pode ficar negativo.");
      tx.update(ref, { stock: newStock, updatedAt: serverTimestamp() });
      tx.set(fbcol("stockMovements").doc(), {
        productId, productName, type: "ajuste", quantity: quantityDelta,
        reason: reason || "Ajuste manual", userUid, createdAt: serverTimestamp(),
      });
    });
  },
  async listStockMovements({ productId, max = 30 } = {}) {
    if (productId) {
      // Evita índice composto (productId + createdAt): filtra no Firestore, ordena no navegador.
      const list = fbList(await fbcol("stockMovements").where("productId", "==", productId).limit(max).get());
      return list.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
    }
    return fbList(await fbcol("stockMovements").orderBy("createdAt", "desc").limit(max).get());
  },

  // ---- Vendas (PDV) ----
  async finalizeSale({ items, payment, subtotal, discount, total, employeeUid, employeeName, clientId, clientName, cashRegisterId }) {
    return db.runTransaction(async (tx) => {
      const productRefs = items.map((it) => fbcol("products").doc(it.productId));
      const productSnaps = await Promise.all(productRefs.map((ref) => tx.get(ref)));

      productSnaps.forEach((snap, i) => {
        if (!snap.exists) throw new Error(`Produto "${items[i].name}" não encontrado.`);
        if ((snap.data().stock ?? 0) < items[i].qty) throw new Error(`Estoque insuficiente para "${snap.data().name}".`);
      });

      const saleRef = fbcol("sales").doc();
      tx.set(saleRef, {
        items, payment, subtotal, discount, total, employeeUid, employeeName,
        clientId: clientId || null, clientName: clientName || "Cliente Balcão",
        status: "concluida", cashRegisterId: cashRegisterId || null, createdAt: serverTimestamp(),
      });

      productSnaps.forEach((snap, i) => {
        const newStock = (snap.data().stock ?? 0) - items[i].qty;
        tx.update(productRefs[i], { stock: newStock, updatedAt: serverTimestamp() });
        tx.set(fbcol("stockMovements").doc(), {
          productId: items[i].productId, productName: snap.data().name, type: "venda", quantity: -items[i].qty,
          reason: `Venda ${saleRef.id}`, userUid: employeeUid, saleId: saleRef.id, createdAt: serverTimestamp(),
        });
      });

      if (cashRegisterId) {
        tx.set(fbcol("cashMovements").doc(), {
          cashRegisterId, type: "venda", amount: total, payment, saleId: saleRef.id, userUid: employeeUid, createdAt: serverTimestamp(),
        });
      }
      return saleRef.id;
    });
  },
  async listRecentSales(max = 20) {
    return fbList(await fbcol("sales").orderBy("createdAt", "desc").limit(max).get());
  },
  async listSalesToday(max = 200) {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    return fbList(await fbcol("sales").where("createdAt", ">=", tsFromDate(start)).orderBy("createdAt", "desc").limit(max).get());
  },
  async listSalesRange(days = 7, max = 500) {
    const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - (days - 1));
    return fbList(await fbcol("sales").where("createdAt", ">=", tsFromDate(start)).orderBy("createdAt", "desc").limit(max).get());
  },
  async cancelSale(saleId) {
    return fbcol("sales").doc(saleId).update({ status: "cancelada", cancelledAt: serverTimestamp() });
  },

  // ---- Caixa ----
  async getOpenCashRegister() {
    const snap = await fbcol("cashRegisters").where("status", "==", "aberto").limit(1).get();
    return snap.empty ? null : { id: snap.docs[0].id, ...snap.docs[0].data() };
  },
  async openCashRegister({ openingAmount, userUid, userName }) {
    return fbcol("cashRegisters").add({ openingAmount, status: "aberto", openedBy: userUid, openedByName: userName, openedAt: serverTimestamp() });
  },
  async addCashMovement({ cashRegisterId, type, amount, reason, userUid }) {
    return fbcol("cashMovements").add({ cashRegisterId, type, amount, reason: reason || "", userUid, createdAt: serverTimestamp() });
  },
  async listCashMovements(cashRegisterId) {
    // Evita índice composto (cashRegisterId + createdAt): filtra no Firestore, ordena no navegador.
    const list = fbList(await fbcol("cashMovements").where("cashRegisterId", "==", cashRegisterId).get());
    return list.sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));
  },
  async closeCashRegister({ cashRegisterId, expectedAmount, informedAmount, userUid }) {
    const difference = Number((informedAmount - expectedAmount).toFixed(2));
    return fbcol("cashRegisters").doc(cashRegisterId).update({ status: "fechado", expectedAmount, informedAmount, difference, closedBy: userUid, closedAt: serverTimestamp() });
  },

  // ---- Clientes ----
  async listCustomers(max = 200) { return fbList(await fbcol("customers").orderBy("name").limit(max).get()); },
  async createCustomer(data) { return fbcol("customers").add({ ...data, createdAt: serverTimestamp() }); },
  async updateCustomer(id, data) { return fbcol("customers").doc(id).update(data); },
  async customerPurchaseHistory(customerId, max = 20) {
    // Evita índice composto (clientId + createdAt): filtra no Firestore, ordena no navegador.
    const list = fbList(await fbcol("sales").where("clientId", "==", customerId).limit(max).get());
    return list.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
  },

  // ---- Fornecedores ----
  async listSuppliers(max = 200) { return fbList(await fbcol("suppliers").orderBy("name").limit(max).get()); },
  async createSupplier(data) { return fbcol("suppliers").add({ ...data, createdAt: serverTimestamp() }); },
  async updateSupplier(id, data) { return fbcol("suppliers").doc(id).update(data); },

  // ---- Compras ----
  async createPurchase({ items, supplierId, supplierName, total, userUid }) {
    return db.runTransaction(async (tx) => {
      const productRefs = items.map((it) => fbcol("products").doc(it.productId));
      const productSnaps = await Promise.all(productRefs.map((ref) => tx.get(ref)));
      const purchaseRef = fbcol("purchases").doc();
      tx.set(purchaseRef, { items, supplierId, supplierName, total, userUid, createdAt: serverTimestamp() });
      productSnaps.forEach((snap, i) => {
        const newStock = (snap.data()?.stock ?? 0) + items[i].qty;
        tx.update(productRefs[i], { stock: newStock, updatedAt: serverTimestamp() });
        tx.set(fbcol("stockMovements").doc(), {
          productId: items[i].productId, productName: snap.data()?.name, type: "compra", quantity: items[i].qty,
          reason: `Compra ${purchaseRef.id}`, userUid, purchaseId: purchaseRef.id, createdAt: serverTimestamp(),
        });
      });
      return purchaseRef.id;
    });
  },
  async listPurchases(max = 50) { return fbList(await fbcol("purchases").orderBy("createdAt", "desc").limit(max).get()); },

  // ---- Financeiro ----
  async listExpenses(max = 50) { return fbList(await fbcol("expenses").orderBy("dueDate", "asc").limit(max).get()); },
  async createExpense(data) { return fbcol("expenses").add({ ...data, paid: false, createdAt: serverTimestamp() }); },
  async listAccountsPayable(max = 50) { return fbList(await fbcol("accountsPayable").orderBy("dueDate", "asc").limit(max).get()); },
  async createAccountPayable(data) {
    return fbcol("accountsPayable").add({ ...data, paid: false, createdAt: serverTimestamp() });
  },
  async setAccountPayablePaid(id, paid) {
    return fbcol("accountsPayable").doc(id).update({ paid, paidAt: paid ? serverTimestamp() : null });
  },
  async listAccountsReceivable(max = 50) { return fbList(await fbcol("accountsReceivable").orderBy("dueDate", "asc").limit(max).get()); },
  async createAccountReceivable(data) {
    return fbcol("accountsReceivable").add({ ...data, received: false, createdAt: serverTimestamp() });
  },
  async setAccountReceivableReceived(id, received) {
    return fbcol("accountsReceivable").doc(id).update({ received, receivedAt: received ? serverTimestamp() : null });
  },

  // ---- Dashboard ----
  async getStockAlerts(max = 300) {
    const all = fbList(await fbcol("products").where("active", "==", true).limit(max).get());
    return { lowStock: all.filter((p) => p.stock > 0 && p.stock <= (p.minStock ?? 0)), outOfStock: all.filter((p) => p.stock === 0) };
  },

  // ---- Configurações / usuários ----
  async getSettings() {
    const snap = await db.collection("settings").doc("general").get();
    return snap.exists ? snap.data() : {};
  },
  async updateSettings(data) {
    return fbcol("settings").doc("general").set({ ...data, updatedAt: serverTimestamp() }, { merge: true });
  },
  async listUsers(max = 100) { return fbList(await fbcol("users").orderBy("name").limit(max).get()); },
  async createUserProfile(uid, data) {
    return fbcol("users").doc(uid).set({ ...data, createdAt: serverTimestamp() });
  },
  async updateUserProfile(uid, data) {
    return fbcol("users").doc(uid).update(data);
  },
};

}

/* =========================================================================

   ========================================================================= */
async function loadInitialData() {
  state.dataLoading = true;
  state.dataError = null;
  render();
  try {
    const [products, categories, salesToday, salesRange, cash, payables] = await Promise.all([
      fb.listProducts({ onlyActive: true }),
      fb.listCategories().catch(() => []),
      fb.listSalesToday(),
      fb.listSalesRange(7),
      fb.getOpenCashRegister().catch(() => null),
      fb.listAccountsPayable(5).catch(() => []),
    ]);
    PRODUCTS = products;
    CATEGORIES_CACHE = categories;
    state.sales = salesToday;
    SALES_RANGE_CACHE = salesRange;
    state.openCashRegister = cash;
    state.accountsPayable = payables;
  } catch (e) {
    console.error("Erro ao carregar dados iniciais:", e);
    state.dataError = e.message || "Não foi possível carregar os dados do Firestore.";
  } finally {
    state.dataLoading = false;
    render();
  }
}

async function refreshProducts() {
  try { PRODUCTS = await fb.listProducts({ onlyActive: true }); } catch (e) { console.error(e); }
}
async function refreshSales() {
  try {
    state.sales = await fb.listSalesToday();
    SALES_RANGE_CACHE = await fb.listSalesRange(7);
  } catch (e) { console.error(e); }
}

async function loadReportPeriod(days) {
  state.reportsLoading = true;
  render();
  try {
    state.reportSales = await fb.listSalesRange(days, days > 7 ? 1500 : 500);
    state.reportPeriod = days;
    state.reportsLoaded = true;
  } catch (e) {
    console.error(e);
    showToast("Não foi possível carregar o relatório.");
  } finally {
    state.reportsLoading = false;
    render();
  }
}

function render() {

  // 1. Ainda não sabemos se há sessão salva

        <div class="w-10 h-10 rounded-full border-2 border-[#E8590C] border-t-transparent animate-spin"></div>

  // 2. Sem sessão -> tela de login

function renderPageRouter() {
  // Página exige um papel que o usuário logado não tem -> volta para o dashboard
  const allowed = (NAV_ACCESS[state.page] || []).includes(state.currentUser?.role);
  if (!allowed) {
    return renderPlaceholder("dashboard");
  }
  if (state.dataLoading) {
    return `
      <div class="flex items-center justify-center py-24">
        <div class="w-8 h-8 rounded-full border-2 border-[#E8590C] border-t-transparent animate-spin"></div>
      </div>`;
  }
  if (state.dataError) {
    return `
      <div class="bg-[#F1EDE7] border border-[#D8CFC6] rounded-2xl p-6 text-center">
        <p class="text-sm text-[#1B1210] font-medium">Não foi possível carregar os dados</p>
        <p class="text-xs text-[#8A7E76] mt-1">${state.dataError}</p>
        <button data-action="retry-load" class="mt-4 bg-[#1B1210] text-white text-sm font-medium px-5 py-2.5 rounded-full hover:bg-[#2A1E1B]">Tentar novamente</button>
      </div>`;
  }
  // Páginas com busca sob demanda: mostra o giratório até o primeiro carregamento
  // terminar, em vez de piscar "nenhum encontrado" com a lista ainda vazia.
  const LAZY_LOAD_FLAGS = {
    clientes: ["customersLoaded"],
    fornecedores: ["suppliersLoaded"],
    compras: ["purchasesLoaded", "suppliersLoaded"],
    financeiro: ["financeLoaded"],
    funcionarios: ["employeesLoaded"],
    relatorios: ["reportsLoaded"],
    configuracoes: ["settingsLoaded"],
  };
  const requiredFlags = LAZY_LOAD_FLAGS[state.page];
  if (requiredFlags && !requiredFlags.every(f => state[f])) {
    return `
      <div class="flex items-center justify-center py-24">
        <div class="w-8 h-8 rounded-full border-2 border-[#E8590C] border-t-transparent animate-spin"></div>
      </div>`;
  }
  switch (state.page) {
    case "dashboard": return renderDashboard();
    case "pdv": return renderVendas();
    case "produtos": return renderProdutos();
    case "estoque": return renderEstoque();
    case "caixa": return renderCaixa();
    case "financeiro": return renderFinanceiro();
    case "clientes": return renderClientes();
    case "fornecedores": return renderFornecedores();
    case "compras": return renderCompras();
    case "funcionarios": return renderFuncionarios();
    case "relatorios": return renderRelatorios();
    case "configuracoes": return renderConfiguracoes();
    default: return renderPlaceholder(state.page);
  }
}

const WEEKDAY_SHORT = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

function toJsDate(ts) {
  if (!ts) return null;
  if (typeof ts.toDate === "function") return ts.toDate();
  return new Date(ts);
}

// Agrega os últimos N dias a partir de uma única consulta (SALES_RANGE_CACHE)
function buildRevenueByDay(salesRange, days = 7) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const buckets = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    buckets.push({ time: d.getTime(), day: WEEKDAY_SHORT[d.getDay()], value: 0 });
  }
  salesRange.forEach(s => {
    if (s.status === "cancelada") return;
    const d = toJsDate(s.createdAt);
    if (!d) return;
    d.setHours(0, 0, 0, 0);
    const bucket = buckets.find(b => b.time === d.getTime());
    if (bucket) bucket.value += s.total || 0;
  });
  return buckets.map(({ day, value }) => ({ day, value }));
}

// Ranking de produtos mais vendidos a partir dos itens das vendas do período
function buildTopProducts(salesRange, max = 5) {
  const map = new Map();
  salesRange.forEach(s => {
    if (s.status === "cancelada") return;
    (s.items || []).forEach(it => {
      const cur = map.get(it.productId) || { id: it.productId, name: it.name, sold: 0, revenue: 0 };
      cur.sold += it.qty;
      cur.revenue += it.qty * it.price - (it.discount || 0);
      map.set(it.productId, cur);
    });
  });
  return Array.from(map.values()).sort((a, b) => b.revenue - a.revenue).slice(0, max);
}

}

// Gráfico de área em SVG puro — sem biblioteca externa, sem risco de falha de CDN.
function renderRevenueChart(data) {
  const W = 400, H = 92, padX = 6, padY = 10;
  const n = data.length;
  const values = data.map(d => d.value);
  const max = Math.max(...values, 0) || 1; // evita divisão por zero quando não há vendas ainda
  const stepX = n > 1 ? (W - padX * 2) / (n - 1) : 0;
  const todayIndex = n - 1;

  const points = data.map((d, i) => ({
    x: padX + i * stepX,
    y: padY + (1 - d.value / max) * (H - padY * 2),
    day: d.day,
  }));

  // Curva suavizada (Bézier cúbica usando pontos médios)
  let linePath = `M ${points[0].x} ${points[0].y}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i], p1 = points[i + 1];
    const midX = (p0.x + p1.x) / 2;
    linePath += ` C ${midX} ${p0.y}, ${midX} ${p1.y}, ${p1.x} ${p1.y}`;
  }
  const areaPath = `${linePath} L ${points[n - 1].x} ${H} L ${points[0].x} ${H} Z`;
  const today = points[todayIndex];

  return `
    <div class="relative h-full">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="absolute inset-x-0" style="top:0; bottom:16px; width:100%; height:calc(100% - 16px);">
        <defs>
          <linearGradient id="revGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E8590C" stop-opacity="0.22" />
            <stop offset="100%" stop-color="#E8590C" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path d="${areaPath}" fill="url(#revGrad)" />
        <path d="${linePath}" fill="none" stroke="#E8590C" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke" />
        <circle cx="${today.x}" cy="${today.y}" r="3.5" fill="#E8590C" stroke="#FFFFFF" stroke-width="1.6" />
      </svg>

      <!-- Rótulos dos dias, alinhados a cada ponto (espaçados quando há muitos pontos) -->
      <div class="absolute inset-x-0 bottom-0 h-4">
        ${(() => {
          const labelStep = Math.max(1, Math.ceil(n / 7));
          return points.map((p, i) => (i % labelStep !== 0 && i !== todayIndex) ? "" : `
            <span class="absolute text-[10px] ${i === todayIndex ? "text-[#C2410C] font-semibold" : "text-[#B3A79D]"}"
              style="left:${(p.x / W) * 100}%; transform: translateX(-50%);">${p.day}</span>
          `).join("");
        })()}
      </div>
    </div>
  `;
}

function getCartLines() {
  return state.cart.map(i => {
    const product = PRODUCTS.find(p => p.id === i.productId);
    const lineSubtotal = product.price * i.qty;
    const lineTotal = Math.max(0, lineSubtotal - i.discount);
    return { ...i, product, lineSubtotal, lineTotal };
  });
}

    <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in max-h-[92vh] flex flex-col">
        <div class="px-5 py-4 border-b border-[#F1EDE7] flex items-center justify-between flex-shrink-0">
          <div>
            <h3 class="font-serif text-[17px] text-[#241C1A]">Venda #${sale.id.replace("V-", "")}</h3>
            <p class="text-xs text-[#8A7E76] mt-0.5">${sale.date} às ${sale.time} · ${sale.employee}</p>
          </div>
          <button data-action="close-sale-detail" class="text-[#A79A90] hover:text-[#241C1A]">${icon("x", 20)}</button>
        </div>
        <div class="flex-1 overflow-y-auto p-5 space-y-4">
          <div>${statusPill(sale.status)}</div>
          <div class="divide-y divide-[#F4F0E9]">
            ${sale.items.map(it => `
              <div class="py-2.5 flex items-center justify-between gap-3">
                <div class="min-w-0">
                  <p class="text-sm text-[#241C1A] font-medium truncate">${it.name}</p>
                  <p class="text-xs text-[#8A7E76]">${it.qty} × ${currency(it.price)}${it.discount ? ` · desconto ${currency(it.discount)}` : ""}</p>
                </div>
                <p class="text-sm font-medium text-[#241C1A] flex-shrink-0">${currency(it.qty * it.price - (it.discount || 0))}</p>
              </div>
            `).join("")}
          </div>
          <div class="bg-[#F9F7F4] rounded-2xl p-4 text-sm space-y-2">
            <div class="flex justify-between"><span class="text-[#8A7E76]">Subtotal</span><span class="text-[#241C1A]">${currency(sale.subtotal)}</span></div>
            <div class="flex justify-between"><span class="text-[#8A7E76]">Desconto</span><span class="${sale.discount > 0 ? "text-[#1B1210]" : "text-[#241C1A]"}">${sale.discount > 0 ? "- " + currency(sale.discount) : currency(0)}</span></div>
            <div class="flex justify-between pt-2 border-t border-[#EFEAE3]"><span class="font-medium text-[#241C1A]">Total</span><span class="font-serif text-[#C2410C] text-lg">${currency(sale.total)}</span></div>
            <div class="flex justify-between pt-1"><span class="text-[#8A7E76]">Pagamento</span><span class="text-[#241C1A]">${sale.payment}</span></div>
          </div>
        </div>
        <div class="p-4 border-t border-[#F1EDE7] flex gap-2 flex-shrink-0">
          <button data-action="print-receipt" class="flex-1 flex items-center justify-center gap-1.5 border border-[#EFEAE3] text-[#4A3F3A] text-sm font-medium py-3 rounded-full hover:bg-[#F9F7F4] transition-colors">
            ${icon("printer", 15)} Comprovante
          </button>
          ${canCancel ? `
          <button data-action="cancel-sale:${sale.id}" class="flex-1 flex items-center justify-center gap-1.5 border border-[#D8CFC6] text-[#1B1210] text-sm font-medium py-3 rounded-full hover:bg-[#F1EDE7] transition-colors">
            ${icon("x", 15)} Cancelar
          </button>` : ""}
        </div>
      </div>
    </div>
  `;
}

/* =========================================================================
   PRODUTOS — CRUD real no Firestore
   ========================================================================= */
function renderProdutos() {
  const q = (state.query || "").trim().toLowerCase();
  const categories = ["Todas", ...Array.from(new Set(PRODUCTS.map(p => p.category).filter(Boolean)))];
  const filtered = PRODUCTS.filter(p => {
    const matchesCategory = state.category === "Todas" || !state.category || p.category === state.category;
    const matchesQuery = !q || p.name.toLowerCase().includes(q) || (p.sku || "").toLowerCase().includes(q);
    return matchesCategory && matchesQuery;
  });

  return `
    <div class="space-y-6">
      <div class="flex items-center justify-between gap-3">
        <p class="text-sm text-[#8A7E76]">${PRODUCTS.length} produto${PRODUCTS.length === 1 ? "" : "s"} ativos</p>
        <button data-action="open-product-modal" class="inline-flex items-center justify-center gap-1.5 bg-[#E8590C] hover:bg-[#C2410C] text-white text-sm font-medium px-5 py-3 rounded-full transition-colors flex-shrink-0">
          ${icon("plus", 16)} Novo produto
        </button>
      </div>

      <div class="flex flex-col sm:flex-row gap-2.5">
        <div class="relative flex-1">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#A79A90]">${icon("search", 16)}</span>
          <input id="produtos-search" value="${state.query || ""}" placeholder="Buscar por nome ou código"
            class="w-full bg-white border border-[#EFEAE3] rounded-full pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
        </div>
        <div class="flex gap-2 overflow-x-auto no-scrollbar">
          ${categories.map(c => `
            <button data-action="set-category:${c}" class="whitespace-nowrap px-3.5 py-1.5 rounded-full text-xs font-medium border transition-colors
              ${(state.category || "Todas") === c ? "bg-[#E8590C] border-[#E8590C] text-white" : "bg-white border-[#EFEAE3] text-[#4A3F3A] hover:border-[#E8590C]/40"}">${c}</button>
          `).join("")}
        </div>
      </div>

      <div class="bg-white border border-[#EFEAE3] rounded-2xl divide-y divide-[#F4F0E9] overflow-hidden">
        ${filtered.length === 0 ? `<div class="py-14 text-center text-sm text-[#8A7E76]">Nenhum produto encontrado.</div>` : filtered.map(p => `
          <button data-action="edit-product:${p.id}" class="w-full flex items-center gap-3 px-4 sm:px-5 py-3.5 text-left hover:bg-[#FAF8F5] transition-colors">
            <div class="w-10 h-10 rounded-full bg-[#FDE7DA] text-[#C2410C] flex items-center justify-center flex-shrink-0 overflow-hidden">
              ${p.imageUrl ? `<img src="${p.imageUrl}" class="w-full h-full object-cover" alt="" />` : icon("wine", 17)}
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-[#241C1A] truncate">${p.name}</p>
              <p class="text-[11px] text-[#A79A90] truncate">${p.sku || "—"} · ${p.category || "Sem categoria"}</p>
            </div>
            <div class="text-right flex-shrink-0">
              <p class="text-sm font-serif text-[#C2410C]">${currency(p.price)}</p>
              <p class="text-[11px] mt-0.5 ${p.stock === 0 ? "text-[#1B1210] font-semibold" : p.stock <= (p.minStock ?? 0) ? "text-[#A67C00] font-semibold" : "text-[#8A7E76]"}">${p.stock} un.</p>
            </div>
            <span class="w-8 h-8 rounded-lg flex items-center justify-center text-[#A79A90] flex-shrink-0">${icon("edit", 15)}</span>
          </button>
        `).join("")}
      </div>
    </div>
    ${state.productModalOpen ? renderProductModal() : ""}
  `;
}

function renderProductModal() {
  const editing = state.editingProductId ? PRODUCTS.find(p => p.id === state.editingProductId) : null;
  return `
    <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in max-h-[92vh] flex flex-col">
        <div class="px-5 py-4 border-b border-[#F1EDE7] flex items-center justify-between flex-shrink-0">
          <h3 class="font-serif text-[17px] text-[#241C1A]">${editing ? "Editar produto" : "Novo produto"}</h3>
          <button data-action="close-product-modal" class="text-[#A79A90] hover:text-[#241C1A]">${icon("x", 20)}</button>
        </div>
        <form id="product-form" class="flex-1 overflow-y-auto p-5 space-y-3.5" novalidate>
          ${state.formError ? `<div class="bg-[#F1EDE7] border border-[#D8CFC6] text-[#1B1210] text-xs rounded-xl px-3.5 py-2.5">${state.formError}</div>` : ""}
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Nome do produto</label>
            <input id="pf-name" required value="${editing?.name || ""}" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Código (SKU)</label>
              <input id="pf-sku" value="${editing?.sku || ""}" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
            </div>
            <div>
              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Categoria</label>
              <input id="pf-category" value="${editing?.category || ""}" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Código de barras</label>
            <input id="pf-barcode" value="${editing?.barcode || ""}" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>
          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Preço (R$)</label>
              <input id="pf-price" type="number" min="0" step="0.01" required value="${editing?.price ?? ""}" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
            </div>
            <div>
              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Estoque</label>
              <input id="pf-stock" type="number" min="0" value="${editing?.stock ?? 0}" ${editing ? "disabled" : ""} class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20 disabled:opacity-50" />
            </div>
            <div>
              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Estoque mín.</label>
              <input id="pf-minstock" type="number" min="0" value="${editing?.minStock ?? 5}" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
            </div>
          </div>
          ${editing ? `<p class="text-[11px] text-[#A79A90] -mt-2">Para corrigir o estoque, use a tela de Estoque (registra o motivo do ajuste).</p>` : ""}
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Link da imagem (opcional)</label>
            <input id="pf-image" value="${editing?.imageUrl || ""}" placeholder="https://..." class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
            <p class="text-[11px] text-[#A79A90] mt-1">Sem custo: cole um link de imagem já hospedada (Drive, Imgur, etc). Upload direto fica para quando o Storage for ativado.</p>
          </div>
          ${editing ? `
          <label class="flex items-center gap-2.5 pt-1">
            <input id="pf-active" type="checkbox" ${editing.active !== false ? "checked" : ""} class="w-4 h-4 rounded accent-[#E8590C]" />
            <span class="text-sm text-[#241C1A]">Produto ativo</span>
          </label>` : ""}
        </form>
        <div class="p-4 border-t border-[#F1EDE7] flex-shrink-0">
          <button type="submit" form="product-form" ${state.formLoading ? "disabled" : ""}
            class="w-full bg-[#E8590C] disabled:bg-[#D8CFC6] text-white font-medium py-3 rounded-full text-sm hover:bg-[#C2410C] transition-colors">
            ${state.formLoading ? "Salvando..." : editing ? "Salvar alterações" : "Criar produto"}
          </button>
        </div>
      </div>
    </div>
  `;
}

/* =========================================================================
   ESTOQUE — níveis e ajuste manual (com motivo)
   ========================================================================= */
function renderEstoque() {
  const q = (state.query || "").trim().toLowerCase();
  const sorted = [...PRODUCTS].sort((a, b) => (a.stock <= (a.minStock ?? 0) ? -1 : 1) - (b.stock <= (b.minStock ?? 0) ? -1 : 1));
  const filtered = sorted.filter(p => !q || p.name.toLowerCase().includes(q) || (p.sku || "").toLowerCase().includes(q));
  const outOfStock = PRODUCTS.filter(p => p.stock === 0).length;
  const lowStock = PRODUCTS.filter(p => p.stock > 0 && p.stock <= (p.minStock ?? 0)).length;

  return `
    <div class="space-y-6">
      <p class="text-sm text-[#8A7E76]">${outOfStock} zerado${outOfStock === 1 ? "" : "s"} · ${lowStock} próximo${lowStock === 1 ? "" : "s"} de acabar</p>

      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#A79A90]">${icon("search", 16)}</span>
        <input id="estoque-search" value="${state.query || ""}" placeholder="Buscar produto"
          class="w-full bg-white border border-[#EFEAE3] rounded-full pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
      </div>

      <div class="bg-white border border-[#EFEAE3] rounded-2xl divide-y divide-[#F4F0E9] overflow-hidden">
        ${filtered.length === 0 ? `<div class="py-14 text-center text-sm text-[#8A7E76]">Nenhum produto encontrado.</div>` : filtered.map(p => {
          const status = p.stock === 0
            ? `<span class="text-[11px] font-medium px-2 py-1 rounded-full bg-[#F1EDE7] text-[#1B1210] whitespace-nowrap">Zerado</span>`
            : p.stock <= (p.minStock ?? 0)
              ? `<span class="text-[11px] font-medium px-2 py-1 rounded-full bg-[#FFF3D6] text-[#A67C00] whitespace-nowrap">Baixo</span>`
              : `<span class="text-[11px] font-medium px-2 py-1 rounded-full bg-[#F9F7F4] text-[#8A7E76] whitespace-nowrap">Ok</span>`;
          return `
          <div class="flex items-center gap-3 px-4 sm:px-5 py-3.5">
            <div class="min-w-0 flex-1">
              <p class="text-sm font-medium text-[#241C1A] truncate">${p.name}</p>
              <p class="text-[11px] text-[#A79A90]">${p.sku || "—"}</p>
            </div>
            <p class="text-sm text-[#241C1A] flex-shrink-0 hidden sm:block w-14 text-right">${p.stock} un.</p>
            <div class="flex-shrink-0">${status}</div>
            <button data-action="open-stock-adjust:${p.id}" class="text-xs font-medium text-[#C2410C] border border-[#F5C9A8] px-3 py-1.5 rounded-full hover:bg-[#FDE7DA] transition-colors flex-shrink-0">Ajustar</button>
          </div>`;
        }).join("")}
      </div>
    </div>
    ${state.stockAdjustProductId ? renderStockAdjustModal() : ""}
  `;
}

function renderStockAdjustModal() {
  const p = PRODUCTS.find(x => x.id === state.stockAdjustProductId);
  if (!p) return "";
  return `
    <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in">
        <div class="px-5 py-4 border-b border-[#F1EDE7] flex items-center justify-between">
          <h3 class="font-serif text-[17px] text-[#241C1A]">Ajustar estoque</h3>
          <button data-action="close-stock-adjust" class="text-[#A79A90] hover:text-[#241C1A]">${icon("x", 20)}</button>
        </div>
        <form id="stock-adjust-form" class="p-5 space-y-3.5">
          ${state.formError ? `<div class="bg-[#F1EDE7] border border-[#D8CFC6] text-[#1B1210] text-xs rounded-xl px-3.5 py-2.5">${state.formError}</div>` : ""}
          <div>
            <p class="text-sm font-medium text-[#241C1A]">${p.name}</p>
            <p class="text-xs text-[#8A7E76]">Estoque atual: ${p.stock} un.</p>
          </div>
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Ajuste (use negativo para reduzir, ex: -3)</label>
            <input id="sa-delta" type="number" step="1" required placeholder="ex: 10 ou -3" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Motivo</label>
            <input id="sa-reason" required placeholder="ex: Contagem de inventário, avaria..." class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>
          <button type="submit" ${state.formLoading ? "disabled" : ""} class="w-full bg-[#E8590C] disabled:bg-[#D8CFC6] text-white font-medium py-3 rounded-full text-sm hover:bg-[#C2410C] transition-colors">
            ${state.formLoading ? "Salvando..." : "Confirmar ajuste"}
          </button>
        </form>
      </div>
    </div>
  `;
}

/* =========================================================================
   CAIXA — abertura, sangria, suprimento e fechamento
   ========================================================================= */
function renderCaixa() {
  if (!state.openCashRegister) {
    return `
      <div class="max-w-sm mx-auto">
        <div class="bg-white border border-[#EFEAE3] rounded-2xl p-6 text-center">
          <div class="w-12 h-12 rounded-full bg-[#FDE7DA] text-[#C2410C] flex items-center justify-center mx-auto mb-4">${icon("wallet", 20)}</div>
          <h3 class="font-serif text-[18px] text-[#241C1A] mb-1.5">Caixa fechado</h3>
          <p class="text-xs text-[#8A7E76] mb-5">Informe o valor inicial para abrir o caixa do turno.</p>
          <form id="open-cash-form" class="space-y-3 text-left">
            ${state.formError ? `<div class="bg-[#F1EDE7] border border-[#D8CFC6] text-[#1B1210] text-xs rounded-xl px-3.5 py-2.5">${state.formError}</div>` : ""}
            <div>
              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Saldo inicial (R$)</label>
              <input id="oc-amount" type="number" min="0" step="0.01" required placeholder="0,00" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
            </div>
            <button type="submit" ${state.formLoading ? "disabled" : ""} class="w-full bg-[#E8590C] disabled:bg-[#D8CFC6] text-white font-medium py-3 rounded-full text-sm hover:bg-[#C2410C] transition-colors">
              ${state.formLoading ? "Abrindo..." : "Abrir caixa"}
            </button>
          </form>
        </div>
      </div>
      ${renderCashModals()}
    `;
  }

  const c = state.openCashRegister;
  const vendas = state.cashMovements.filter(m => m.type === "venda");
  const sangrias = state.cashMovements.filter(m => m.type === "sangria");
  const suprimentos = state.cashMovements.filter(m => m.type === "suprimento");
  const totalVendas = vendas.reduce((s, m) => s + m.amount, 0);
  const totalSangrias = sangrias.reduce((s, m) => s + m.amount, 0);
  const totalSuprimentos = suprimentos.reduce((s, m) => s + m.amount, 0);
  const saldoEsperado = (c.openingAmount || 0) + totalVendas + totalSuprimentos - totalSangrias;

  return `
    <div class="space-y-6">
      <div class="flex items-center justify-between gap-3">
        <p class="text-sm text-[#8A7E76]">Aberto por ${c.openedByName || "—"}</p>
        <span class="text-[11px] font-medium px-2.5 py-1 rounded-full bg-[#FDE7DA] text-[#C2410C] flex-shrink-0">Aberto</span>
      </div>

      <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
        ${summaryCard("Saldo inicial", currency(c.openingAmount || 0), "wallet", "bg-[#F1EDE7] text-[#1B1210]")}
        ${summaryCard("Vendas", currency(totalVendas), "receipt", "bg-[#FDE7DA] text-[#C2410C]")}
        ${summaryCard("Sangrias", currency(totalSangrias), "trendUp", "bg-[#FFF3D6] text-[#A67C00]")}
        ${summaryCard("Saldo esperado", currency(saldoEsperado), "wallet", "bg-[#F6DEB8] text-[#A67C00]")}
      </div>

      <div class="flex gap-2">
        <button data-action="open-cash-move:sangria" class="flex-1 bg-white border border-[#EFEAE3] text-[#4A3F3A] text-sm font-medium py-3 rounded-full hover:border-[#1B1210]/20 transition-colors">Sangria</button>
        <button data-action="open-cash-move:suprimento" class="flex-1 bg-white border border-[#EFEAE3] text-[#4A3F3A] text-sm font-medium py-3 rounded-full hover:border-[#1B1210]/20 transition-colors">Suprimento</button>
        <button data-action="open-close-cash" class="flex-1 bg-[#1B1210] text-white text-sm font-medium py-3 rounded-full hover:bg-[#2A1E1B] transition-colors">Fechar caixa</button>
      </div>

      <div>
        <h3 class="font-serif text-[16px] text-[#241C1A] mb-3">Movimentações</h3>
        <div class="bg-white border border-[#EFEAE3] rounded-2xl divide-y divide-[#F4F0E9] overflow-hidden">
          ${state.cashMovements.length === 0 ? `<div class="py-10 text-center text-sm text-[#8A7E76]">Nenhuma movimentação ainda.</div>` : state.cashMovements.slice().reverse().map(m => `
            <div class="flex items-center gap-3 px-4 sm:px-5 py-3">
              <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${m.type === "venda" ? "bg-[#FDE7DA] text-[#C2410C]" : m.type === "suprimento" ? "bg-[#FFF3D6] text-[#A67C00]" : "bg-[#F1EDE7] text-[#1B1210]"}">
                ${icon(m.type === "venda" ? "receipt" : "wallet", 14)}
              </div>
              <div class="min-w-0 flex-1">
                <p class="text-sm text-[#241C1A] capitalize">${m.type}${m.reason ? ` — ${m.reason}` : ""}</p>
              </div>
              <p class="text-sm font-medium flex-shrink-0 ${m.type === "sangria" ? "text-[#1B1210]" : "text-[#C2410C]"}">${m.type === "sangria" ? "-" : "+"}${currency(m.amount)}</p>
            </div>
          `).join("")}
        </div>
      </div>
    </div>
    ${renderCashModals()}
  `;
}

function renderCashModals() {
  return `
    ${state.cashMoveType ? `

      <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in">

        <form id="cash-move-form" class="p-5 space-y-3.5">

          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Valor (R$)</label>
            <input id="cm-amount" type="number" min="0" step="0.01" required placeholder="0,00" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>
          <div>
            <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Motivo</label>
            <input id="cm-reason" placeholder="ex: Pagamento de fornecedor" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>
          <button type="submit" ${state.formLoading ? "disabled" : ""} class="w-full bg-[#E8590C] disabled:bg-[#D8CFC6] text-white font-medium py-3 rounded-full text-sm hover:bg-[#C2410C] transition-colors">

        </form>
      </div>
    </div>` : ""}

    ${state.closeCashOpen ? (() => {
      const c = state.openCashRegister;
      const vendas = state.cashMovements.filter(m => m.type === "venda").reduce((s, m) => s + m.amount, 0);
      const sangrias = state.cashMovements.filter(m => m.type === "sangria").reduce((s, m) => s + m.amount, 0);
      const suprimentos = state.cashMovements.filter(m => m.type === "suprimento").reduce((s, m) => s + m.amount, 0);
      const esperado = (c?.openingAmount || 0) + vendas + suprimentos - sangrias;
      return `
      <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in">
          <div class="px-5 py-4 border-b border-[#F1EDE7] flex items-center justify-between">
            <h3 class="font-serif text-[17px] text-[#241C1A]">Fechar caixa</h3>

          </div>
          <form id="close-cash-form" class="p-5 space-y-3.5">
            ${state.formError ? `<div class="bg-[#F1EDE7] border border-[#D8CFC6] text-[#1B1210] text-xs rounded-xl px-3.5 py-2.5">${state.formError}</div>` : ""}
            <div class="bg-[#F9F7F4] rounded-xl p-3.5 text-sm flex justify-between">
              <span class="text-[#8A7E76]">Saldo esperado</span>
              <span class="font-medium text-[#241C1A]">${currency(esperado)}</span>
            </div>
            <div>
              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Saldo informado (contado no caixa)</label>
              <input id="cc-informed" type="number" min="0" step="0.01" required placeholder="0,00" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />

            <button type="submit" ${state.formLoading ? "disabled" : ""} class="w-full bg-[#1B1210] disabled:bg-[#D8CFC6] text-white font-medium py-3 rounded-full text-sm hover:bg-[#2A1E1B] transition-colors">

/* =========================================================================
   FINANCEIRO — contas a pagar e a receber
   ========================================================================= */
function renderFinanceiro() {
  const payablesOpen = state.financePayables.filter(p => !p.paid);
  const receivablesOpen = state.financeReceivables.filter(r => !r.received);
  const totalPagar = payablesOpen.reduce((s, p) => s + (p.amount || 0), 0);
  const totalReceber = receivablesOpen.reduce((s, r) => s + (r.amount || 0), 0);
  const list = state.financeTab === "pagar" ? state.financePayables : state.financeReceivables;

  return `
    <div class="space-y-6">
      <div class="flex items-center justify-between gap-3">
        <p class="text-sm text-[#8A7E76]">${payablesOpen.length} a pagar · ${receivablesOpen.length} a receber</p>
        <button data-action="open-finance-modal" class="inline-flex items-center justify-center gap-1.5 bg-[#E8590C] hover:bg-[#C2410C] text-white text-sm font-medium px-5 py-3 rounded-full transition-colors flex-shrink-0">
          ${icon("plus", 16)} Nova conta
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2.5 sm:gap-3">
        ${summaryCard("A pagar (pendente)", currency(totalPagar), "landmark", "bg-[#F1EDE7] text-[#1B1210]")}
        ${summaryCard("A receber (pendente)", currency(totalReceber), "wallet", "bg-[#FDE7DA] text-[#C2410C]")}
      </div>

      <div class="flex bg-[#F4F2EF] rounded-full p-1 max-w-xs">
        <button data-action="set-finance-tab:pagar" class="flex-1 py-2 rounded-full text-sm font-medium transition-colors ${state.financeTab === "pagar" ? "bg-[#1B1210] text-white" : "text-[#4A3F3A]"}">A pagar</button>
        <button data-action="set-finance-tab:receber" class="flex-1 py-2 rounded-full text-sm font-medium transition-colors ${state.financeTab === "receber" ? "bg-[#1B1210] text-white" : "text-[#4A3F3A]"}">A receber</button>
      </div>

      <div class="space-y-2.5">
        ${list.length === 0
          ? `<div class="bg-white border border-[#EFEAE3] rounded-2xl py-14 text-center text-sm text-[#8A7E76]">Nenhuma conta ${state.financeTab === "pagar" ? "a pagar" : "a receber"} cadastrada ainda.</div>`
          : list.map(item => financeRow(item, state.financeTab)).join("")}
      </div>
    </div>
    ${state.financeModalOpen ? renderFinanceModal() : ""}
  `;
}

function financeRow(item, tab) {
  const isPayable = tab === "pagar";
  const done = isPayable ? item.paid : item.received;
  const due = toJsDate(item.dueDate);
  const dueLabel = due ? due.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }) : "sem data";
  const overdue = !done && due && due < new Date();
  const statusLabel = done ? (isPayable ? "Pago" : "Recebido") : overdue ? "Atrasado" : "Pendente";
  const statusCls = done ? "bg-[#FDE7DA] text-[#C2410C]" : overdue ? "bg-[#F1EDE7] text-[#1B1210]" : "bg-[#FFF3D6] text-[#A67C00]";
  const who = isPayable ? item.supplierName : item.clientName;
  const toggleAction = isPayable ? `toggle-payable-paid:${item.id}` : `toggle-receivable-received:${item.id}`;

  return `
    <div class="flex items-center gap-3 bg-white border border-[#EFEAE3] rounded-2xl px-4 py-3.5">
      <div class="w-9 h-9 rounded-full bg-[#F1EDE7] text-[#1B1210] flex items-center justify-center flex-shrink-0">${icon("landmark", 15)}</div>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-medium text-[#241C1A] truncate">${item.description || "Conta"}</p>
        <p class="text-xs text-[#8A7E76] mt-0.5 truncate">${who ? who + " · " : ""}Vence em ${dueLabel}</p>
      </div>
      <div class="text-right flex-shrink-0">
        <p class="text-sm font-serif text-[#241C1A]">${currency(item.amount)}</p>
        <span class="inline-block text-[11px] font-medium px-2 py-0.5 rounded-full mt-1 ${statusCls}">${statusLabel}</span>
      </div>
      <button data-action="${toggleAction}" data-tip="${done ? 'Marcar como pendente' : 'Marcar como ' + (isPayable ? 'paga' : 'recebida')}"
        class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 border transition-colors ${done ? "border-[#F5C9A8] text-[#C2410C] hover:bg-[#FDE7DA]" : "border-[#EFEAE3] text-[#8A7E76] hover:bg-[#F9F7F4]"}">
        ${icon("check", 15)}
      </button>
    </div>
  `;
}

function renderFinanceModal() {
  return `
    <div class="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white w-full sm:max-w-sm rounded-t-3xl sm:rounded-3xl overflow-hidden fade-in">

          <div class="flex bg-[#F4F2EF] rounded-full p-1">
            <label class="flex-1">

            <input id="ff-description" required placeholder="ex: Aluguel do espaço" class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
          </div>
          <div>

              <label class="block text-xs font-medium text-[#4A3F3A] mb-1.5">Vencimento</label>
              <input id="ff-duedate" type="date" required class="w-full bg-[#F9F7F4] border border-[#EFEAE3] rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#E8590C]/20" />
            </div>
          </div>
          <button type="submit" ${state.formLoading ? "disabled" : ""} class="w-full bg-[#E8590C] disabled:bg-[#D8CFC6] text-white font-medium py-3 rounded-full text-sm hover:bg-[#C2410C] transition-colors">
            ${state.formLoading ? "Salvando..." : "Salvar conta"}
          </button>
        </form>
      </div>
    </div>
  `;
}

/* =========================================================================
   RELATÓRIOS
   ========================================================================= */
const REPORT_PERIODS = [
  { days: 1, label: "Hoje" },
  { days: 7, label: "7 dias" },
  { days: 30, label: "30 dias" },
];

function buildPaymentBreakdown(sales) {
  const map = new Map();
  sales.filter(s => s.status !== "cancelada").forEach(s => {
    const cur = map.get(s.payment) || { label: s.payment || "Outros", count: 0, total: 0 };
    cur.count += 1;
    cur.total += s.total || 0;
    map.set(s.payment, cur);
  });
  return Array.from(map.values()).sort((a, b) => b.total - a.total);
}

function buildEmployeePerformance(sales) {
  const map = new Map();
  sales.filter(s => s.status !== "cancelada").forEach(s => {
    const key = s.employeeName || "—";
    const cur = map.get(key) || { name: key, count: 0, total: 0 };
    cur.count += 1;
    cur.total += s.total || 0;
    map.set(key, cur);
  });
  return Array.from(map.values()).sort((a, b) => b.total - a.total);
}

function renderRelatorios() {
  const sales = state.reportSales;
  const active = sales.filter(s => s.status !== "cancelada");
  const faturamentoTotal = active.reduce((s, x) => s + (x.total || 0), 0);
  const numVendas = active.length;
  const ticketMedio = numVendas ? faturamentoTotal / numVendas : 0;
  const produtosVendidos = active.reduce((s, x) => s + (x.items || []).reduce((n, it) => n + it.qty, 0), 0);

  const revenueByDay = buildRevenueByDay(sales, state.reportPeriod || 1);
  const topProducts = buildTopProducts(sales, 5);
  const payments = buildPaymentBreakdown(sales);
  const maxPayment = Math.max(...payments.map(p => p.total), 1);
  const employees = buildEmployeePerformance(sales);

  const periodLabel = REPORT_PERIODS.find(p => p.days === state.reportPeriod)?.label || "Período";

  return `
    <div class="space-y-6">
      <div class="flex items-center justify-between gap-3">
        <p class="text-sm text-[#8A7E76]">${numVendas} ${numVendas === 1 ? "venda" : "vendas"} · ${periodLabel}</p>

        ${summaryCard("Faturamento", currency(faturamentoTotal), "wallet", "bg-[#FDE7DA] text-[#C2410C]")}

                  <p class="text-[11px] text-[#A79A90]">${e.count} ${e.count === 1 ? "venda" : "vendas"}</p>
                </div>
                <p class="text-sm font-serif text-[#241C1A] flex-shrink-0">${currency(e.total)}</p>
              </div>
            `).join("")}
          </div>
        </div>
      </div>

      <!-- Produtos mais vendidos -->
      <div>
        <h3 class="font-serif text-[16px] text-[#241C1A] mb-3">Produtos mais vendidos</h3>
        <div class="bg-white border border-[#EFEAE3] rounded-2xl p-4 sm:px-6 sm:pt-4 sm:pb-2">
          ${topProducts.length === 0 ? `
            <div class="py-10 text-center text-sm text-[#8A7E76]">Nenhuma venda registrada no período.</div>
          ` : `
          <div class="sm:hidden space-y-2">
            ${topProducts.map(p => `
              <div class="flex items-center gap-3 bg-[#FAF8F5] rounded-xl p-3">
                <div class="w-9 h-9 rounded-full bg-[#FDE7DA] text-[#C2410C] flex items-center justify-center flex-shrink-0">${icon("wine", 15)}</div>
                <div class="min-w-0 flex-1">
                  <p class="text-sm font-medium text-[#241C1A] truncate">${p.name}</p>
                  <p class="text-xs text-[#8A7E76]">${p.sold} vendidos</p>
                </div>
                <span class="text-sm font-serif text-[#C2410C] flex-shrink-0">${currency(p.revenue)}</span>
              </div>
            `).join("")}
          </div>
          <div class="hidden sm:block overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-left text-[11px] uppercase tracking-wide text-[#A79A90]">
                  <th class="pb-2.5 font-medium">Produto</th>
                  <th class="pb-2.5 font-medium">Vendas</th>
                  <th class="pb-2.5 font-medium text-right">Faturamento</th>
                </tr>
              </thead>
              <tbody>
                ${topProducts.map(p => `
                  <tr class="border-t border-[#F4F0E9]">
                    <td class="py-3 pr-3">
                      <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-full bg-[#FDE7DA] text-[#C2410C] flex items-center justify-center flex-shrink-0">${icon("wine", 14)}</div>
                        <p class="text-[#241C1A] font-medium truncate max-w-[220px]">${p.name}</p>
                      </div>
                    </td>
                    <td class="py-3 text-[#4A3F3A]">${p.sold} un.</td>
                    <td class="py-3 text-right text-[#241C1A] font-medium">${currency(p.revenue)}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
          `}
        </div>
      </div>
      `}
    </div>
  `;
}

/* =========================================================================
   EVENTOS
   ========================================================================= */
function attachEvents() {
  document.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      handleAction(el.getAttribute("data-action"));
    });
  });

  const overlay = document.getElementById("overlay");
  if (overlay) overlay.addEventListener("click", () => { state.mobileNavOpen = false; render(); });

  const productSearch = document.getElementById("pdv-search");
  if (productSearch) {
    productSearch.addEventListener("input", (e) => {
      state.query = e.target.value;
      renderNewSaleOnly();
    });
    productSearch.focus();
    productSearch.setSelectionRange(productSearch.value.length, productSearch.value.length);
  }

  const salesSearch = document.getElementById("sales-search");
  if (salesSearch) {
    salesSearch.addEventListener("input", (e) => {
      state.salesQuery = e.target.value;
      renderVendasOnly();
    });
    salesSearch.focus();
    salesSearch.setSelectionRange(salesSearch.value.length, salesSearch.value.length);
  }

  const produtosSearch = document.getElementById("produtos-search");
  if (produtosSearch) {
    produtosSearch.addEventListener("input", (e) => {
      state.query = e.target.value;
      renderProdutosOnly();
    });
    produtosSearch.focus();
    produtosSearch.setSelectionRange(produtosSearch.value.length, produtosSearch.value.length);
  }

  const estoqueSearch = document.getElementById("estoque-search");
  if (estoqueSearch) {
    estoqueSearch.addEventListener("input", (e) => {
      state.query = e.target.value;
      renderEstoqueOnly();
    });
    estoqueSearch.focus();
    estoqueSearch.setSelectionRange(estoqueSearch.value.length, estoqueSearch.value.length);
  }

  // ---- Formulários (login, recuperação de senha, produtos, estoque, caixa) ----
  bindForm("login-form", async () => {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    state.loginLoading = true; state.loginError = null; render();
    try {
      await login(email, password);
      // watchAuth cuida do resto (carrega perfil, dados, e renderiza o app)
    } catch (e) {
      state.loginLoading = false;
      state.loginError = mapAuthError(e);
      render();
    }
  });

  bindForm("reset-form", async () => {
    const email = document.getElementById("reset-email").value.trim();
    state.loginLoading = true; state.loginError = null; state.resetSent = false; render();
    try {
      await resetPassword(email);
      state.resetSent = true;
    } catch (e) {
      state.loginError = mapAuthError(e);
    } finally {
      state.loginLoading = false; render();
    }
  });

  bindForm("product-form", async () => {
    const name = document.getElementById("pf-name").value.trim();
    const price = Number(document.getElementById("pf-price").value);
    if (!name || !(price >= 0)) { state.formError = "Preencha nome e preço corretamente."; render(); return; }
    const data = {
      name,
      sku: document.getElementById("pf-sku").value.trim(),
      category: document.getElementById("pf-category").value.trim(),
      barcode: document.getElementById("pf-barcode").value.trim(),
      price,
      minStock: Number(document.getElementById("pf-minstock").value) || 0,
      imageUrl: document.getElementById("pf-image").value.trim(),
    };
    state.formLoading = true; state.formError = null; render();
    try {
      if (state.editingProductId) {
        const activeEl = document.getElementById("pf-active");
        if (activeEl) data.active = activeEl.checked;
        await fb.updateProduct(state.editingProductId, data);
        showToast("Produto atualizado");
      } else {
        data.stock = Number(document.getElementById("pf-stock").value) || 0;
        await fb.createProduct(data);
        showToast("Produto criado");
      }
      await refreshProducts();
      state.productModalOpen = false;
      state.editingProductId = null;
    } catch (e) {
      state.formError = e.message || "Não foi possível salvar o produto.";
    } finally {
      state.formLoading = false; render();
    }
  });

  bindForm("stock-adjust-form", async () => {
    const delta = Number(document.getElementById("sa-delta").value);
    const reason = document.getElementById("sa-reason").value.trim();
    if (!delta || !reason) { state.formError = "Informe a quantidade e o motivo."; render(); return; }
    const p = PRODUCTS.find(x => x.id === state.stockAdjustProductId);
    state.formLoading = true; state.formError = null; render();
    try {
      await fb.adjustStock({
        productId: p.id, productName: p.name, quantityDelta: delta,
        reason, userUid: state.currentUser.uid,
      });
      await refreshProducts();
      state.stockAdjustProductId = null;
      showToast("Estoque ajustado");
    } catch (e) {
      state.formError = e.message || "Não foi possível ajustar o estoque.";
    } finally {
      state.formLoading = false; render();
    }
  });

  bindForm("open-cash-form", async () => {
    const amount = Number(document.getElementById("oc-amount").value);
    if (!(amount >= 0)) { state.formError = "Informe o saldo inicial."; render(); return; }
    state.formLoading = true; state.formError = null; render();
    try {
      const ref = await fb.openCashRegister({
        openingAmount: amount, userUid: state.currentUser.uid, userName: firstName(state.currentUser),
      });
      state.openCashRegister = { id: ref.id, openingAmount: amount, status: "aberto", openedByName: firstName(state.currentUser) };
      state.cashMovements = [];
      showToast("Caixa aberto");
    } catch (e) {
      state.formError = e.message || "Não foi possível abrir o caixa.";
    } finally {
      state.formLoading = false; render();
    }
  });

  bindForm("cash-move-form", async () => {
    const amount = Number(document.getElementById("cm-amount").value);
    const reason = document.getElementById("cm-reason").value.trim();
    if (!(amount > 0)) { state.formError = "Informe um valor válido."; render(); return; }
    state.formLoading = true; state.formError = null; render();
    try {
      await fb.addCashMovement({
        cashRegisterId: state.openCashRegister.id, type: state.cashMoveType,
        amount, reason, userUid: state.currentUser.uid,
      });
      state.cashMovements = await fb.listCashMovements(state.openCashRegister.id);
      state.cashMoveType = null;
      showToast(state.cashMoveType === "sangria" ? "Sangria registrada" : "Suprimento registrado");
    } catch (e) {
      state.formError = e.message || "Não foi possível registrar a movimentação.";
    } finally {
      state.formLoading = false; render();
    }
  });

  bindForm("close-cash-form", async () => {
    const informed = Number(document.getElementById("cc-informed").value);
    if (!(informed >= 0)) { state.formError = "Informe o valor contado no caixa."; render(); return; }
    const c = state.openCashRegister;
    const vendas = state.cashMovements.filter(m => m.type === "venda").reduce((s, m) => s + m.amount, 0);
    const sangrias = state.cashMovements.filter(m => m.type === "sangria").reduce((s, m) => s + m.amount, 0);
    const suprimentos = state.cashMovements.filter(m => m.type === "suprimento").reduce((s, m) => s + m.amount, 0);
    const expected = (c.openingAmount || 0) + vendas + suprimentos - sangrias;
    state.formLoading = true; state.formError = null; render();
    try {
      await fb.closeCashRegister({
        cashRegisterId: c.id, expectedAmount: expected, informedAmount: informed, userUid: state.currentUser.uid,
      });
      state.openCashRegister = null;
      state.cashMovements = [];
      state.closeCashOpen = false;
      showToast("Caixa fechado");
    } catch (e) {
      state.formError = e.message || "Não foi possível fechar o caixa.";
    } finally {
      state.formLoading = false; render();
    }
  });

  bindForm("finance-form", async () => {
    const type = document.querySelector('input[name="ff-type"]:checked')?.value || "pagar";
    const description = document.getElementById("ff-description").value.trim();
    const who = document.getElementById("ff-who").value.trim();
    const amount = Number(document.getElementById("ff-amount").value);
    const dueDateStr = document.getElementById("ff-duedate").value;
    if (!description || !(amount > 0) || !dueDateStr) {
      state.formError = "Preencha descrição, valor e vencimento."; render(); return;
    }
    const dueDate = tsFromDate(new Date(dueDateStr + "T12:00:00"));
    state.formLoading = true; state.formError = null; render();
    try {
      if (type === "pagar") {
        await fb.createAccountPayable({ description, supplierName: who, amount, dueDate });
      } else {
        await fb.createAccountReceivable({ description, clientName: who, amount, dueDate });
      }
      const [payables, receivables] = await Promise.all([fb.listAccountsPayable(50), fb.listAccountsReceivable(50)]);
      state.financePayables = payables;
      state.financeReceivables = receivables;
      state.financeTab = type;
      state.financeModalOpen = false;
      showToast("Conta salva");
    } catch (e) {
      state.formError = e.message || "Não foi possível salvar a conta.";
    } finally {
      state.formLoading = false; render();
    }
  });

  document.querySelectorAll('input[name="ff-type"]').forEach(el => {
    el.addEventListener("change", (e) => {
      const label = document.getElementById("ff-who-label");
      if (label) label.textContent = e.target.value === "pagar" ? "Fornecedor (opcional)" : "Cliente (opcional)";
    });
  });

  bindForm("customer-form", async () => {
    const name = document.getElementById("cf-name").value.trim();
    if (!name) { state.formError = "Informe o nome do cliente."; render(); return; }
    const data = {
      name,
      phone: document.getElementById("cf-phone").value.trim(),
      email: document.getElementById("cf-email").value.trim(),
    };
    state.formLoading = true; state.formError = null; render();
    try {
      if (state.editingCustomerId) {
        await fb.updateCustomer(state.editingCustomerId, data);
        showToast("Cliente atualizado");
      } else {
        await fb.createCustomer(data);
        showToast("Cliente criado");
      }
      state.customers = await fb.listCustomers(200);
      state.customerModalOpen = false;
      state.editingCustomerId = null;
    } catch (e) {
      state.formError = e.message || "Não foi possível salvar o cliente.";
    } finally {
      state.formLoading = false; render();
    }
  });

  bindForm("supplier-form", async () => {
    const name = document.getElementById("sf-name").value.trim();
    if (!name) { state.formError = "Informe o nome do fornecedor."; render(); return; }
    const data = {
      name,
      phone: document.getElementById("sf-phone").value.trim(),
      email: document.getElementById("sf-email").value.trim(),
    };
    state.formLoading = true; state.formError = null; render();
    try {
      if (state.editingSupplierId) {
        await fb.updateSupplier(state.editingSupplierId, data);
        showToast("Fornecedor atualizado");
      } else {
        await fb.createSupplier(data);
        showToast("Fornecedor criado");
      }
      state.suppliers = await fb.listSuppliers(200);
      state.supplierModalOpen = false;
      state.editingSupplierId = null;
    } catch (e) {
      state.formError = e.message || "Não foi possível salvar o fornecedor.";
    } finally {
      state.formLoading = false; render();
    }
  });

  bindForm("employee-form", async () => {
    const editing = state.editingEmployeeId;
    const name = document.getElementById("ef-name").value.trim();
    if (!name) { state.formError = "Informe o nome."; render(); return; }
    const email = document.getElementById("ef-email").value.trim();
    const roleEl = document.getElementById("ef-role");
    const role = roleEl && !roleEl.disabled ? roleEl.value : null;

    state.formLoading = true; state.formError = null; render();
    try {
      if (editing) {
        const data = { name, email };
        if (role) data.role = role;
        await fb.updateUserProfile(editing, data);
        showToast("Membro atualizado");
      } else {
        const uid = document.getElementById("ef-uid").value.trim();
        if (!uid) { state.formError = "Cole o UID do usuário (veja em Authentication)."; state.formLoading = false; render(); return; }
        await fb.createUserProfile(uid, { name, email, role: role || "funcionario" });
        showToast("Membro vinculado");
      }
      state.employees = await fb.listUsers(100);
      state.employeeModalOpen = false;
      state.editingEmployeeId = null;
    } catch (e) {
      state.formError = e.message || "Não foi possível salvar. Confira se o UID está correto.";
    } finally {
      state.formLoading = false; render();
    }
  });

  bindForm("profile-form", async () => {
    const name = document.getElementById("pf-my-name").value.trim();
    if (!name) { state.formError = "Informe o nome."; render(); return; }
    state.formLoading = true; state.formError = null; state.profileSaved = false; render();
    try {
      await fb.updateUserProfile(state.currentUser.uid, { name });
      state.currentUser.name = name;
      state.profileSaved = true;
      showToast("Perfil atualizado");
    } catch (e) {
      state.formError = e.message || "Não foi possível salvar o perfil.";
    } finally {
      state.formLoading = false; render();
    }
  });

  bindForm("store-form", async () => {
    if (!isAdmin(state.currentUser)) return;
    const data = {
      name: document.getElementById("sf-store-name").value.trim(),
      phone: document.getElementById("sf-store-phone").value.trim(),
      address: document.getElementById("sf-store-address").value.trim(),
    };
    state.formLoading = true; state.formError = null; render();
    try {
      await fb.updateSettings(data);
      state.storeSettings = { ...state.storeSettings, ...data };
      showToast("Dados da adega salvos");
    } catch (e) {
      state.formError = e.message || "Não foi possível salvar.";
    } finally {
      state.formLoading = false; render();
    }
  });

  const funcionariosSearch = document.getElementById("funcionarios-search");
  if (funcionariosSearch) {
    funcionariosSearch.addEventListener("input", (e) => { state.query = e.target.value; renderFuncionariosOnly(); });
    funcionariosSearch.focus();
    funcionariosSearch.setSelectionRange(funcionariosSearch.value.length, funcionariosSearch.value.length);
  }

  document.querySelectorAll("[data-purchase-cost]").forEach(el => {
    el.addEventListener("input", (e) => {
      const id = el.getAttribute("data-purchase-cost");
      const item = state.purchaseCart.find(i => i.productId === id);
      if (item) item.cost = e.target.value;
    });
  });

  const npSupplier = document.getElementById("np-supplier");
  if (npSupplier) {
    npSupplier.addEventListener("change", (e) => { state.purchaseSupplierId = e.target.value; });
  }

  const clientesSearch = document.getElementById("clientes-search");
  if (clientesSearch) {
    clientesSearch.addEventListener("input", (e) => { state.query = e.target.value; renderClientesOnly(); });
    clientesSearch.focus();
    clientesSearch.setSelectionRange(clientesSearch.value.length, clientesSearch.value.length);
  }

  const fornecedoresSearch = document.getElementById("fornecedores-search");
  if (fornecedoresSearch) {
    fornecedoresSearch.addEventListener("input", (e) => { state.query = e.target.value; renderFornecedoresOnly(); });
    fornecedoresSearch.focus();
    fornecedoresSearch.setSelectionRange(fornecedoresSearch.value.length, fornecedoresSearch.value.length);
  }

  const purchaseSearch = document.getElementById("purchase-search");
  if (purchaseSearch) {
    purchaseSearch.addEventListener("input", (e) => { state.query = e.target.value; renderNewPurchaseOnly(); });
    purchaseSearch.focus();
    purchaseSearch.setSelectionRange(purchaseSearch.value.length, purchaseSearch.value.length);
  }


  document.querySelectorAll("[data-discount]").forEach(el => {
    el.addEventListener("input", (e) => {
      const id = el.getAttribute("data-discount");
      const v = Math.max(0, Number(e.target.value) || 0);
      const item = state.cart.find(i => i.productId === id);
      if (item) item.discount = v;
      renderNewSaleOnly();
    });
  });

  document.querySelectorAll("[data-filter]").forEach(el => {
    el.addEventListener("change", (e) => {
      const key = el.getAttribute("data-filter");
      if (key === "period") state.periodFilter = e.target.value;
      if (key === "payment") state.paymentFilter = e.target.value;
      if (key === "status") state.statusFilter = e.target.value;
      renderVendasOnly();
    });
  });

  const tip = document.getElementById("global-tooltip");
  document.querySelectorAll("[data-tip]").forEach(el => {
    const show = () => {
      const r = el.getBoundingClientRect();
      tip.textContent = el.getAttribute("data-tip");
      tip.style.left = `${r.right + 10}px`;
      tip.style.top = `${r.top + r.height / 2}px`;
      tip.classList.add("show");
    };
    const hide = () => tip.classList.remove("show");
    el.addEventListener("mouseenter", show);
    el.addEventListener("mouseleave", hide);
    el.addEventListener("focus", show);
    el.addEventListener("blur", hide);
  });
}
