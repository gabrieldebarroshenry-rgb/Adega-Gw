function mapAuthError(e) {
  const code = e?.code || "";
  const map = {
    "auth/invalid-email": "E-mail inválido.",
    "auth/user-disabled": "Este usuário foi desativado.",
    "auth/user-not-found": "E-mail ou senha incorretos.",
    "auth/wrong-password": "E-mail ou senha incorretos.",
    "auth/invalid-credential": "E-mail ou senha incorretos.",
    "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco e tente novamente.",
    "auth/network-request-failed": "Falha de conexão. Verifique sua internet.",
  };
  return map[code] || "Não foi possível concluir. Tente novamente.";
}

let toastTimer = null;
function showToast(msg) {
  state.toast = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 1800);
}

async function handleAction(action) {
  const [type, value] = action.split(":");
  switch (type) {
    case "nav": {
      const allowed = (NAV_ACCESS[value] || []).includes(state.currentUser?.role);
      state.page = allowed ? value : "dashboard";
      state.mobileNavOpen = false;
      if (value === "caixa" && state.openCashRegister && state.cashMovements.length === 0) {
        render();
        try { state.cashMovements = await fb.listCashMovements(state.openCashRegister.id); }
        catch (e) { console.error(e); }
      }
      if (value === "financeiro" && !state.financeLoaded) {
        render();
        try {
          const [payables, receivables] = await Promise.all([
            fb.listAccountsPayable(50),
            fb.listAccountsReceivable(50),
          ]);
          state.financePayables = payables;
          state.financeReceivables = receivables;
          state.financeLoaded = true;
        } catch (e) { console.error(e); showToast("Não foi possível carregar o Financeiro."); }
      }
      if (value === "clientes" && !state.customersLoaded) {
        render();
        try { state.customers = await fb.listCustomers(200); state.customersLoaded = true; }
        catch (e) { console.error(e); showToast("Não foi possível carregar os clientes."); }
      }
      if (value === "fornecedores" && !state.suppliersLoaded) {
        render();
        try { state.suppliers = await fb.listSuppliers(200); state.suppliersLoaded = true; }
        catch (e) { console.error(e); showToast("Não foi possível carregar os fornecedores."); }
      }
      if (value === "compras" && (!state.purchasesLoaded || !state.suppliersLoaded)) {
        render();
        try {
          const [purchases, suppliers] = await Promise.all([
            fb.listPurchases(50),
            state.suppliersLoaded ? Promise.resolve(state.suppliers) : fb.listSuppliers(200),
          ]);
          state.purchases = purchases;
          state.suppliers = suppliers;
          state.purchasesLoaded = true;
          state.suppliersLoaded = true;
        } catch (e) { console.error(e); showToast("Não foi possível carregar as compras."); }
      }
      if (value === "funcionarios" && !state.employeesLoaded) {
        render();
        try { state.employees = await fb.listUsers(100); state.employeesLoaded = true; }
        catch (e) { console.error(e); showToast("Não foi possível carregar a equipe."); }
      }
      if (value === "relatorios" && !state.reportsLoaded) {
        await loadReportPeriod(state.reportPeriod);
      }
      if (value === "configuracoes" && !state.settingsLoaded) {
        render();
        try { state.storeSettings = await fb.getSettings(); state.settingsLoaded = true; }
        catch (e) { console.error(e); showToast("Não foi possível carregar as configurações."); }
      }
      break;
    }
    case "open-mobile-nav": state.mobileNavOpen = true; break;
    case "close-mobile-nav": state.mobileNavOpen = false; break;
    case "toggle-search": state.searchOpen = !state.searchOpen; break;
    case "toggle-notif": state.notifOpen = !state.notifOpen; state.profileOpen = false; break;
    case "toggle-profile": state.profileOpen = !state.profileOpen; state.notifOpen = false; break;
    case "logout":
      state.profileOpen = false;
      try { await logout(); } catch (e) { console.error(e); }
      // watchAuth detecta o logout e re-renderiza a tela de login sozinho
      return;
    case "retry-load":
      loadInitialData();
      return;
    case "set-category": state.category = value; break;
    case "set-mobile-tab": state.mobileTab = value; break;

    case "open-reset": state.resetMode = true; state.loginError = null; state.resetSent = false; break;
    case "close-reset": state.resetMode = false; state.loginError = null; break;

    case "open-new-sale":
      state.newSaleOpen = true;
      state.cart = [];
      state.query = "";
      state.category = "Todas";
      state.mobileTab = "produtos";
      state.selectedMethod = null;
      break;
    case "close-new-sale": {
      if (state.cart.length > 0 && !confirm("Descartar esta venda em andamento?")) return;
      state.newSaleOpen = false;
      state.cart = [];
      state.selectedMethod = null;
      break;
    }

    case "add-to-cart": {
      const product = PRODUCTS.find(p => p.id === value);
      if (!product || product.stock === 0) return;
      const existing = state.cart.find(i => i.productId === value);
      if (existing) {
        if (existing.qty < product.stock) { existing.qty += 1; showToast(`${product.name} +1`); }
      } else {
        state.cart.push({ productId: value, qty: 1, discount: 0 });
        showToast(`${product.name} adicionado`);
      }
      break;
    }
    case "qty-inc": case "qty-dec": {
      const product = PRODUCTS.find(p => p.id === value);
      const item = state.cart.find(i => i.productId === value);
      if (item) item.qty = type === "qty-inc" ? Math.min(product.stock, item.qty + 1) : Math.max(1, item.qty - 1);
      break;
    }
    case "remove-cart":
      state.cart = state.cart.filter(i => i.productId !== value);
      break;
    case "select-payment": state.selectedMethod = value; break;

    case "finalize-sale": {
      // Trava contra duplo clique (Etapa 4, item 7)
      if (state.processingSale) return;
      const lines = getCartLines();
      if (lines.length === 0 || !state.selectedMethod) return;

      const subtotal = lines.reduce((s, l) => s + l.lineSubtotal, 0);
      const totalDiscount = lines.reduce((s, l) => s + l.discount, 0);
      const total = Math.max(0, subtotal - totalDiscount);

      state.processingSale = true;
      render();
      try {
        const saleId = await fb.finalizeSale({
          items: lines.map(l => ({ productId: l.productId, name: l.product.name, qty: l.qty, price: l.product.price, discount: l.discount })),
          payment: PAYMENT_LABELS[state.selectedMethod],
          subtotal, discount: totalDiscount, total,
          employeeUid: state.currentUser.uid,
          employeeName: firstName(state.currentUser),
          clientId: null, clientName: "Cliente Balcão",
          cashRegisterId: state.openCashRegister?.id || null,
        });
        state.confirmedSale = {
          id: saleId, total,
          itemsCount: lines.reduce((s, l) => s + l.qty, 0),
          payment: PAYMENT_LABELS[state.selectedMethod],
          time: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
        };
        await Promise.all([
          refreshProducts(),
          refreshSales(),
          state.openCashRegister ? fb.listCashMovements(state.openCashRegister.id).then(m => { state.cashMovements = m; }) : Promise.resolve(),
        ]);
      } catch (e) {
        console.error(e);
        showToast(e.message || "Não foi possível concluir a venda.");
      } finally {
        state.processingSale = false;
      }
      break;
    }
    case "new-sale":
      state.cart = [];
      state.confirmedSale = null;
      state.mobileTab = "produtos";
      state.query = "";
      state.selectedMethod = null;
      break;
    case "finish-and-close":
      state.cart = [];
      state.confirmedSale = null;
      state.newSaleOpen = false;
      state.mobileTab = "produtos";
      state.query = "";
      state.selectedMethod = null;
      break;

    case "open-sale-detail": state.selectedSaleId = value; break;
    case "close-sale-detail": state.selectedSaleId = null; break;
    case "cancel-sale": {
      if (!isManager(state.currentUser)) { showToast("Só gerência/admin pode cancelar uma venda."); return; }
      if (!confirm(`Cancelar a venda ${value}? Essa ação não pode ser desfeita.`)) return;
      try {
        await fb.cancelSale(value);
        const sale = state.sales.find(s => s.id === value);
        if (sale) sale.status = "cancelada";
        showToast("Venda cancelada");
      } catch (e) {
        showToast(e.message || "Não foi possível cancelar a venda.");
      }
      state.selectedSaleId = null;
      break;
    }
    case "print-receipt":
      showToast("Comprovante pronto para impressão/compartilhamento (mock)");
      break;

    // ---- Produtos ----
    case "open-product-modal":
      state.productModalOpen = true; state.editingProductId = null; state.formError = null;
      break;
    case "edit-product":
      state.productModalOpen = true; state.editingProductId = value; state.formError = null;
      break;
    case "close-product-modal":
      state.productModalOpen = false; state.editingProductId = null; state.formError = null;
      break;

    // ---- Estoque ----
    case "open-stock-adjust":
      state.stockAdjustProductId = value; state.formError = null;
      break;
    case "close-stock-adjust":
      state.stockAdjustProductId = null; state.formError = null;
      break;

    // ---- Caixa ----
    case "open-cash-move":
      state.cashMoveType = value; state.formError = null;
      break;
    case "close-cash-move":
      state.cashMoveType = null; state.formError = null;
      break;
    case "open-close-cash":
      state.closeCashOpen = true; state.formError = null;
      break;
    case "close-close-cash":
      state.closeCashOpen = false; state.formError = null;
      break;

    // ---- Financeiro ----
    case "set-finance-tab":
      state.financeTab = value;
      break;
    case "open-finance-modal":
      state.financeModalOpen = true; state.formError = null;
      break;
    case "close-finance-modal":
      state.financeModalOpen = false; state.formError = null;
      break;
    case "toggle-payable-paid": {
      const item = state.financePayables.find(p => p.id === value);
      if (!item) return;
      const next = !item.paid;
      item.paid = next; // atualização otimista
      render();
      try { await fb.setAccountPayablePaid(value, next); showToast(next ? "Marcada como paga" : "Marcada como pendente"); }
      catch (e) { item.paid = !next; showToast("Não foi possível atualizar."); }
      break;
    }
    case "toggle-receivable-received": {
      const item = state.financeReceivables.find(r => r.id === value);
      if (!item) return;
      const next = !item.received;
      item.received = next; // atualização otimista
      render();
      try { await fb.setAccountReceivableReceived(value, next); showToast(next ? "Marcada como recebida" : "Marcada como pendente"); }
      catch (e) { item.received = !next; showToast("Não foi possível atualizar."); }
      break;
    }

    // ---- Clientes ----
    case "open-customer-modal":
      state.customerModalOpen = true; state.editingCustomerId = null; state.formError = null;
      break;
    case "edit-customer":
      state.customerModalOpen = true; state.editingCustomerId = value; state.formError = null;
      break;
    case "close-customer-modal":
      state.customerModalOpen = false; state.editingCustomerId = null; state.formError = null;
      break;
    case "open-customer-history": {
      state.customerHistoryId = value;
      render();
      try { state.customerHistory = await fb.customerPurchaseHistory(value, 20); }
      catch (e) { console.error(e); state.customerHistory = []; }
      break;
    }
    case "close-customer-history":
      state.customerHistoryId = null; state.customerHistory = [];
      break;

    // ---- Fornecedores ----
    case "open-supplier-modal":
      state.supplierModalOpen = true; state.editingSupplierId = null; state.formError = null;
      break;
    case "edit-supplier":
      state.supplierModalOpen = true; state.editingSupplierId = value; state.formError = null;
      break;
    case "close-supplier-modal":
      state.supplierModalOpen = false; state.editingSupplierId = null; state.formError = null;
      break;

    // ---- Compras ----
    case "open-new-purchase":
      state.newPurchaseOpen = true; state.purchaseCart = []; state.purchaseSupplierId = ""; state.query = ""; state.formError = null;
      break;
    case "close-new-purchase":
      if (state.purchaseCart.length > 0 && !confirm("Descartar esta compra em andamento?")) return;
      state.newPurchaseOpen = false; state.purchaseCart = []; state.query = "";
      break;
    case "add-to-purchase": {
      const product = PRODUCTS.find(p => p.id === value);
      if (!product) return;
      const existing = state.purchaseCart.find(i => i.productId === value);
      if (existing) existing.qty += 1;
      else state.purchaseCart.push({ productId: value, qty: 1, cost: product.cost || "" });
      break;
    }
    case "purchase-qty-inc": case "purchase-qty-dec": {
      const item = state.purchaseCart.find(i => i.productId === value);
      if (item) item.qty = type === "purchase-qty-inc" ? item.qty + 1 : Math.max(1, item.qty - 1);
      break;
    }
    case "remove-from-purchase":
      state.purchaseCart = state.purchaseCart.filter(i => i.productId !== value);
      break;
    case "confirm-purchase": {
      if (state.purchaseCart.length === 0) return;
      const supplier = state.suppliers.find(s => s.id === state.purchaseSupplierId);
      const items = state.purchaseCart.map(i => {
        const product = PRODUCTS.find(p => p.id === i.productId);
        return { productId: i.productId, name: product.name, qty: i.qty, cost: Number(i.cost) || 0 };
      });
      const total = items.reduce((s, it) => s + it.cost * it.qty, 0);
      state.formLoading = true; state.formError = null; render();
      try {
        await fb.createPurchase({
          items, supplierId: state.purchaseSupplierId || null, supplierName: supplier?.name || "",
          total, userUid: state.currentUser.uid,
        });
        await Promise.all([refreshProducts(), (async () => { state.purchases = await fb.listPurchases(50); })()]);
        state.newPurchaseOpen = false;
        state.purchaseCart = [];
        showToast("Compra registrada e estoque atualizado");
      } catch (e) {
        state.formError = e.message || "Não foi possível registrar a compra.";
      } finally {
        state.formLoading = false;
      }
      break;
    }

    // ---- Funcionários ----
    case "open-employee-modal":
      state.employeeModalOpen = true; state.editingEmployeeId = null; state.formError = null;
      break;
    case "edit-employee":
      state.employeeModalOpen = true; state.editingEmployeeId = value; state.formError = null;
      break;
    case "close-employee-modal":
      state.employeeModalOpen = false; state.editingEmployeeId = null; state.formError = null;
      break;

    // ---- Relatórios ----
    case "set-report-period": {
      const days = Number(value);
      if (days === state.reportPeriod && state.reportsLoaded) return;
      await loadReportPeriod(days);
      return; // loadReportPeriod já renderiza
    }

    // ---- Configurações ----
    case "request-password-reset": {
      if (!confirm(`Enviar e-mail de redefinição de senha para ${state.currentUser.email}?`)) return;
      try {
        await resetPassword(state.currentUser.email);
        showToast("E-mail de redefinição enviado");
      } catch (e) {
        showToast(e.message || "Não foi possível enviar o e-mail.");
      }
      break;
    }
  }
  render();
}

document.addEventListener("click", (e) => {
  if (e.target.closest(".z-20")) return;
  let changed = false;
  if (state.notifOpen && !e.target.closest('[data-action="toggle-notif"]')) { state.notifOpen = false; changed = true; }
  if (state.profileOpen && !e.target.closest('[data-action="toggle-profile"]')) { state.profileOpen = false; changed = true; }
  if (changed) render();
});

/* =========================================================================
   BOOTSTRAP — observa a sessão do Firebase Auth
   ========================================================================= */
function resetLazyPageCaches() {
  state.customers = []; state.customersLoaded = false;
  state.suppliers = []; state.suppliersLoaded = false;
  state.purchases = []; state.purchasesLoaded = false;
  state.financePayables = []; state.financeReceivables = []; state.financeLoaded = false;
  state.employees = []; state.employeesLoaded = false;
  state.reportSales = []; state.reportsLoaded = false; state.reportPeriod = 7;
  state.storeSettings = {}; state.settingsLoaded = false;
}

watchAuth((user) => {
  state.authChecked = true;
  state.currentUser = user;
  state.loginLoading = false;
  state.loginError = null;
  state.resetMode = false;
  resetLazyPageCaches(); // nunca reaproveitar dado carregado por outra sessão

  if (user) {
    // Se a página atual não é permitida para este papel, volta ao dashboard
    if (!(NAV_ACCESS[state.page] || []).includes(user.role)) state.page = "dashboard";
    loadInitialData(); // dispara o carregamento e já chama render() internamente
  } else {
    // Deslogado: limpa dados sensíveis da memória
    PRODUCTS = [];
    state.sales = [];
    state.openCashRegister = null;
    state.cashMovements = [];
    state.page = "dashboard";
    render();
  }
});
